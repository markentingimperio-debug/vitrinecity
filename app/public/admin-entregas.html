<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Entregas locais | VitrineCity</title>
<style>:root{--navy:#071f4b;--blue:#1768e6;--bg:#f3f7fc;--line:#d8e5f4;--muted:#657a96;--green:#13764b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.5 system-ui}header{padding:18px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{max-width:1180px;margin:32px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.wide{grid-column:1/-1}label{font-size:13px;font-weight:800}input,select{width:100%;padding:10px;border:1px solid #bfd0e4;border-radius:9px;margin-top:4px;font:inherit}button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:11px 16px;font-weight:850;cursor:pointer}.secondary{background:#eef4ff;color:var(--blue)}.status{padding:11px;border-radius:10px;background:#fff1d2}.status.ok{background:#e4f7ed;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f6f9fd;border-radius:13px;padding:15px}.stat b{display:block;font-size:24px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1.4fr repeat(5,minmax(100px,.7fr));gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px}.muted{color:var(--muted);font-size:13px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}@media(max-width:760px){.grid,.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><header><b>Entregas locais</b><a href="/admin">← Painel administrativo</a></header><main><div id="readiness" class="status">Carregando configuração…</div>
<section class="card"><h1>Tarifas e comissão</h1><p>A distância usa a rota real de carro. Cada quilômetro adicional iniciado é cobrado integralmente.</p><form id="settings" class="grid"><label>Tarifa base (R$)<input name="baseFee" type="number" min="0" step="0.01" required></label><label>Distância incluída (km)<input name="baseDistance" type="number" min="0.1" step="0.1" required></label><label>Valor por km adicional (R$)<input name="additionalKm" type="number" min="0" step="0.01" required></label><label>Comissão VitrineCity (%)<input name="commission" type="number" min="0" max="100" step="0.1" required></label><label>Distância máxima (km)<input name="maxDistance" type="number" min="1" step="1" required></label><label class="check"><input name="enabled" type="checkbox"> Ativar entrega local</label><div class="wide"><button>Salvar configuração</button> <span id="settingsMessage" class="muted" role="status"></span></div></form></section>
<section class="card"><h2>Cidades ativas</h2><form id="cityForm" class="grid"><label>Cidade<input name="city" required></label><label>UF<input name="state" maxlength="2" required></label><div><button style="margin-top:25px">Adicionar cidade</button></div></form><div id="cities" class="list"></div></section>
<section class="card"><h2>Entregadores</h2><form id="courierForm" class="grid"><label>Nome<input name="name" required></label><label>WhatsApp<input name="whatsapp" required inputmode="tel"></label><label>Cidade<input name="city" required></label><label>UF<input name="state" maxlength="2" required></label><div class="wide"><button>Cadastrar entregador</button></div></form><div id="couriers" class="list"></div></section>
<section class="card"><h2>Operação das corridas</h2><div id="stats" class="stats"></div><div id="jobs" class="list"></div></section></main>
<script>const money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={};async function api(url,options){const r=await fetch(url,options),d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-entregas.html';throw Error('Acesso administrativo necessário.')}if(!r.ok)throw Error(d.error||'Não foi possível concluir.');return d}function render(){const s=data.settings;settings.baseFee.value=(s.baseFeeCents/100).toFixed(2);settings.baseDistance.value=(s.baseDistanceMeters/1000).toFixed(1);settings.additionalKm.value=(s.additionalKmCents/100).toFixed(2);settings.commission.value=(s.platformCommissionBps/100).toFixed(1);settings.maxDistance.value=(s.maxDistanceMeters/1000).toFixed(0);settings.enabled.checked=s.enabled;readiness.className='status '+(s.enabled&&data.routesConfigured&&data.cities.some(c=>c.active)?'ok':'');readiness.textContent=!data.routesConfigured?'Falta configurar GOOGLE_MAPS_ROUTES_API_KEY no servidor.':!data.cities.some(c=>c.active)?'Cadastre ao menos uma cidade para ativar a operação.':s.enabled?'Entrega local ativa e pronta para calcular rotas.':'Configuração salva; ative a entrega local quando estiver pronto.';cities.innerHTML=data.cities.map(c=>`<div class="row"><b>${esc(c.city)}/${esc(c.state)}</b><span>${c.active?'Ativa':'Pausada'}</span><button class="secondary" data-city="${c.id}" data-active="${!c.active}">${c.active?'Pausar':'Ativar'}</button></div>`).join('')||'<p class="muted">Nenhuma cidade cadastrada.</p>';couriers.innerHTML=data.couriers.map(c=>`<div class="row"><b>${esc(c.name)}</b><span>${esc(c.city)}/${esc(c.state)}</span><span>${esc(c.status)}</span><span>Saldo ${money(c.balanceCents)}</span></div>`).join('')||'<p class="muted">Nenhum entregador cadastrado.</p>';const counts=Object.fromEntries(['available','assigned','picked_up','delivered'].map(k=>[k,data.jobs.filter(j=>j.status===k).length]));stats.innerHTML=`<div class="stat"><b>${counts.available}</b>Disponíveis</div><div class="stat"><b>${counts.assigned}</b>Atribuídas</div><div class="stat"><b>${counts.picked_up}</b>Em rota</div><div class="stat"><b>${counts.delivered}</b>Concluídas</div>`;jobs.innerHTML=data.jobs.map(j=>`<div class="row"><div><b>Pedido ${esc(j.order_reference.slice(-8).toUpperCase())}</b><div class="muted">${esc(j.store_name)} · ${(j.distance_meters/1000).toFixed(2)} km</div></div><span>${money(j.fee_cents)}</span><span>Vitrine ${money(j.platform_cents)}</span><span>Entregador ${money(j.courier_cents)}</span><select data-courier="${j.id}"><option value="">Entregador</option>${data.couriers.filter(c=>c.status==='active').map(c=>`<option value="${c.id}" ${c.id===j.courier_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select data-job="${j.id}"><option value="${j.status}">${esc(j.status)}</option>${['available','assigned','picked_up','delivered','cancelled'].filter(x=>x!==j.status).map(x=>`<option>${x}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Nenhuma corrida registrada.</p>'}async function load(){data=await api('/api/admin/local-delivery');render()}settings.onsubmit=async e=>{e.preventDefault();const f=new FormData(settings),body={enabled:settings.enabled.checked,baseFeeCents:Math.round(Number(f.get('baseFee'))*100),baseDistanceMeters:Math.round(Number(f.get('baseDistance'))*1000),additionalKmCents:Math.round(Number(f.get('additionalKm'))*100),platformCommissionBps:Math.round(Number(f.get('commission'))*100),maxDistanceMeters:Math.round(Number(f.get('maxDistance'))*1000)};settingsMessage.textContent='Salvando…';try{await api('/api/admin/local-delivery/settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});settingsMessage.textContent='Configuração salva.';await load()}catch(err){settingsMessage.textContent=err.message}};cityForm.onsubmit=async e=>{e.preventDefault();await api('/api/admin/local-delivery/cities',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(cityForm)))});cityForm.reset();load()};courierForm.onsubmit=async e=>{e.preventDefault();await api('/api/admin/local-delivery/couriers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(courierForm)))});courierForm.reset();load()};cities.onclick=async e=>{const b=e.target.closest('[data-city]');if(!b)return;await api('/api/admin/local-delivery/cities/'+b.dataset.city,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({active:b.dataset.active==='true'})});load()};jobs.onchange=async e=>{if(!e.target.dataset.job)return;const id=e.target.dataset.job,courierId=jobs.querySelector(`[data-courier="${id}"]`).value;try{await api('/api/admin/local-delivery/jobs/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:e.target.value,courierId})});load()}catch(err){alert(err.message);load()}};load();</script></body></html>
