<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Métricas externas | VitrineCity</title><style>body{margin:0;background:#f3f7fc;color:#0b2855;font:15px/1.5 system-ui}header{padding:18px 5%;background:#071f4b;color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{max-width:950px;margin:35px auto;padding:0 20px}.intro,.card{background:#fff;border:1px solid #d8e5f4;border-radius:16px;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:15px}.status{padding:5px 9px;border-radius:99px;background:#fff1d3;color:#805600;font-size:11px;font-weight:900}.ok{background:#e7f7ee;color:#17623a}label{display:block;font-weight:800;margin:10px 0}input{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #bfd0e4;border-radius:9px;margin-top:4px}button{background:#1768e6;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:850;cursor:pointer}.hint{color:#657a96;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><script src="/openai-ads.js" defer></script><style>.youtube-scope{margin:14px 0;padding:14px;border:1px solid currentColor;border-radius:12px;min-width:0;overflow-wrap:anywhere;font-size:13px;line-height:1.5}.youtube-scope p{margin:7px 0}.youtube-scope a{display:inline-flex;align-items:center;min-height:44px;max-width:100%;overflow-wrap:anywhere;word-break:break-word}.youtube-scope strong{font-size:14px}</style></head><body><header><b>Credenciais de métricas</b><a href="/admin-integracoes.html">← Integrações</a></header><main><section class="intro"><h1>YouTube, TikTok e Kwai</h1><p>As credenciais são criptografadas e nunca aparecem novamente. Os coletores importam somente métricas agregadas oficiais.</p></section><section id="youtubeScope" class="youtube-scope" aria-live="polite"></section><section class="grid"><form class="card provider" data-provider="youtube"><h2>YouTube</h2><span class="status">PENDENTE</span><label>API Key<input name="YOUTUBE_API_KEY" type="password" autocomplete="new-password" required></label><label>Channel ID<input name="YOUTUBE_CHANNEL_ID" autocomplete="off" required></label><button>Salvar</button> <small class="message hint"></small></form><form class="card provider" data-provider="tiktok"><h2>TikTok</h2><span class="status">PENDENTE</span><label>Content Access Token<input name="TIKTOK_CONTENT_ACCESS_TOKEN" type="password" autocomplete="new-password" required></label><button>Salvar</button> <small class="message hint"></small></form><form class="card provider" data-provider="kwai"><h2>Kwai</h2><span class="status">PENDENTE</span><label>App ID<input name="KWAI_APP_ID" autocomplete="off" required></label><label>Access Token<input name="KWAI_ACCESS_TOKEN" type="password" autocomplete="new-password" required></label><button>Salvar</button> <small class="message hint"></small></form></section></main><script>
// BEGIN YOUTUBE SCOPE VIEW
function renderYouTubeScope(container, scope) {
  if (!container) return;
  container.replaceChildren();
  const add = (tag, text) => { const node = document.createElement(tag); node.textContent = text; container.append(node); return node; };
  add('strong', 'Canal do YouTube usado nas métricas');
  if (scope?.scoped !== true) { add('p', 'A identificação do canal está indisponível. Atualize o painel.'); return; }
  const channelId = typeof scope.channelId === 'string' && /^UC[A-Za-z0-9_-]{22}$/.test(scope.channelId) ? scope.channelId : '';
  if (!channelId) { add('p', 'Canal ainda não configurado.'); return; }
  add('p', typeof scope.channelTitle === 'string' && scope.channelTitle.trim() ? scope.channelTitle.slice(0,240) : 'Nome disponível após a primeira sincronização.');
  const link = add('a', channelId); link.href = 'https://www.youtube.com/channel/' + channelId; link.target = '_blank'; link.rel = 'noopener noreferrer';
  link.setAttribute('aria-label', 'Abrir o canal do YouTube usado nestas métricas');
  const run = scope.lastSync;
  if (!run) add('p', 'Este canal ainda não foi sincronizado.');
  else if (run.status === 'completed') {
    const count = Number(run.importedCount);
    const amount = Number.isFinite(count) && count >= 0 ? new Intl.NumberFormat('pt-BR').format(Math.floor(count)) + ' registros.' : 'Dados atualizados.';
    add('p', 'Última sincronização concluída: ' + amount);
  } else if (run.status === 'running') add('p', 'Sincronização deste canal em andamento.');
  else add('p', 'A última sincronização deste canal não foi concluída. Confira a conexão antes de tentar novamente.');
  const count = value => Number.isFinite(Number(value)) ? Math.max(0, Math.floor(Number(value))) : 0;
  const excluded = count(scope.history?.unscopedContents) + count(scope.history?.otherChannelContents);
  if (excluded) add('p', new Intl.NumberFormat('pt-BR').format(excluded) + ' conteúdos de conexões anteriores ou sem canal identificado ficam fora destes totais.');
}
// END YOUTUBE SCOPE VIEW

const forms=[...document.querySelectorAll('.provider')];async function load(){const r=await fetch('/api/admin/social/intelligence/credentials');if(r.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-metricas-externas.html';return}const d=await r.json();renderYouTubeScope(document.getElementById("youtubeScope"),d.youtubeScope);for(const item of d.providers){const form=forms.find(x=>x.dataset.provider===item.id),status=form.querySelector('.status');status.textContent=item.configured?'CONFIGURADO':'PENDENTE';status.className='status'+(item.configured?' ok':'');if(item.configured)for(const input of form.elements)if(input.tagName==='INPUT')input.placeholder='Valor protegido. Preencha todos para substituir.'}}for(const form of forms)form.onsubmit=async e=>{e.preventDefault();const button=e.submitter,message=form.querySelector('.message');button.disabled=true;message.textContent='Salvando…';try{const r=await fetch('/api/admin/social/intelligence/credentials/'+form.dataset.provider,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível salvar.');form.reset();message.textContent=d.message;await load()}catch(error){message.textContent=error.message}finally{button.disabled=false}};load();</script></body></html>
