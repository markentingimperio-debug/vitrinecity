<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Real — Administração VitrineCity</title><style>
:root{--navy:#071f4b;--blue:#1768e6;--green:#188459;--line:#d8e6f7;--muted:#607393;--bg:#f2f7fd}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}header{padding:18px 5%;display:flex;justify-content:space-between;background:var(--navy);color:#fff}header a{color:#fff}main{max-width:1100px;margin:28px auto;padding:0 18px}h1{margin-bottom:6px}.lead{color:var(--muted);margin-top:0}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input{flex:1}.grid{display:grid;gap:14px}.card{padding:20px;display:grid;grid-template-columns:1fr minmax(320px,440px);gap:20px;background:#fff;border:1px solid var(--line);border-radius:18px}.card h2{margin:0 0 6px}.meta{color:var(--muted);line-height:1.5}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:grid;gap:5px;font-size:12px;font-weight:800}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #bfd3ec;border-radius:9px}.consent{display:flex;align-items:flex-start;gap:8px;padding:10px;background:#eef5ff;border-radius:10px}.consent input{width:auto;margin-top:2px}button{padding:11px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.message{font-size:12px;font-weight:800}.enabled{color:var(--green)}@media(max-width:760px){.card{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style><script src="/openai-ads.js" defer></script></head>
<body><header><strong>VitrineCity · Mapa Real</strong><a href="/admin.html">← Painel administrativo</a></header><main><h1>Localização das lojas</h1><p class="lead">Ative somente lojas com autorização do responsável. Para endereços residenciais, prefira região aproximada.</p><div class="toolbar"><input id="search" type="search" placeholder="Buscar loja, cidade ou estado"><button id="reload" type="button">Atualizar</button></div><section id="list" class="grid"></section></main><script>
const list=document.getElementById('list'),search=document.getElementById('search');let stores=[];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function api(url,options){const response=await fetch(url,options),data=await response.json().catch(()=>({}));if(response.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-mapa-real.html';throw Error('Entre como administrador.')}if(!response.ok)throw Error(data.error||'Falha na operação.');return data}
function card(store){return `<article class="card" data-ref="${esc(store.order_reference)}"><div><h2>${esc(store.business_name)}</h2><div class="meta">${esc(store.description||'Sem descrição')}<br><b>${esc([store.address,store.city,store.state,store.postal_code].filter(Boolean).join(' · ')||'Endereço não informado')}</b><br>Status: ${esc(store.review_status)}${store.show_on_real_map?' · <span class="enabled">Visível no mapa</span>':''}</div>${store.google_maps_url?`<p><a href="${esc(store.google_maps_url)}" target="_blank" rel="noopener">Abrir localização informada no Google Maps</a></p>`:''}</div><form class="form"><label>Latitude<input name="latitude" type="number" min="-90" max="90" step="any" value="${esc(store.latitude??'')}"></label><label>Longitude<input name="longitude" type="number" min="-180" max="180" step="any" value="${esc(store.longitude??'')}"></label><label class="wide">Google Place ID<input name="googlePlaceId" maxlength="240" value="${esc(store.google_place_id||'')}" placeholder="Opcional"></label><label class="wide">Precisão pública<select name="locationPrecision"><option value="exact"${store.location_precision!=='area'?' selected':''}>Localização exata</option><option value="area"${store.location_precision==='area'?' selected':''}>Região aproximada (~1 km)</option></select></label><label class="wide consent"><input name="showOnRealMap" type="checkbox"${store.show_on_real_map?' checked':''}><span>Confirmo que o lojista autorizou a exibição no Mapa Real</span></label><button class="wide" type="submit">Salvar localização</button><span class="wide message" role="status"></span></form></article>`}
function render(){const term=search.value.trim().toLocaleLowerCase('pt-BR');const filtered=stores.filter(item=>`${item.business_name} ${item.city} ${item.state}`.toLocaleLowerCase('pt-BR').includes(term));list.innerHTML=filtered.map(card).join('')||'<article class="card">Nenhuma loja encontrada.</article>'}
async function load(){list.textContent='Carregando…';try{const data=await api('/api/admin/store-submissions');stores=data.submissions||[];render()}catch(error){list.textContent=error.message}}
list.addEventListener('submit',async event=>{event.preventDefault();const form=event.target,article=form.closest('[data-ref]'),store=stores.find(item=>item.order_reference===article.dataset.ref),message=form.querySelector('.message'),button=form.querySelector('button');button.disabled=true;message.textContent='Salvando…';const fields=['businessName','description','whatsapp','websiteUrl','instagramUrl','tiktokUrl','googleMapsUrl','videoUrl','address','city','state','postalCode','promotionText','locationNotes','adminNotes'];const keys={businessName:'business_name',websiteUrl:'website_url',instagramUrl:'instagram_url',tiktokUrl:'tiktok_url',googleMapsUrl:'google_maps_url',videoUrl:'video_url',postalCode:'postal_code',promotionText:'promotion_text',locationNotes:'location_notes',adminNotes:'admin_notes'};const body={};for(const field of fields)body[field]=store[keys[field]||field]||'';body.wantsWebsite=!!store.wants_website;body.wantsBrandArt=!!store.wants_brand_art;body.wantsGoogleProfile=!!store.wants_google_profile;body.latitude=form.latitude.value;body.longitude=form.longitude.value;body.googlePlaceId=form.googlePlaceId.value;body.locationPrecision=form.locationPrecision.value;body.showOnRealMap=form.showOnRealMap.checked;try{const data=await api(`/api/admin/store-submissions/${encodeURIComponent(store.order_reference)}/content`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});Object.assign(store,data.submission);message.textContent='Localização salva.';render()}catch(error){message.textContent=error.message}finally{button.disabled=false}});
search.addEventListener('input',render);document.getElementById('reload').onclick=load;load();
</script></body></html>
