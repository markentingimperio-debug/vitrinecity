<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificado | VitrineCity</title><style>
:root{--navy:#08275c;--blue:#1268ed;--gold:#e8a900}*{box-sizing:border-box}body{margin:0;background:#edf3fb;font:16px/1.5 Georgia,serif;color:var(--navy)}.actions{max-width:1120px;margin:24px auto;display:flex;justify-content:space-between;gap:12px;padding:0 20px}.actions a,.actions button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:12px 16px;text-decoration:none;font:700 14px system-ui;cursor:pointer}.paper{position:relative;max-width:1120px;min-height:700px;margin:0 auto 35px;padding:72px;background:#fff;border:14px solid var(--navy);outline:3px solid var(--gold);outline-offset:-25px;text-align:center;box-shadow:0 24px 70px #0b2d5a22}.seal{width:92px;height:92px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffd85e,#c98700);color:#fff;font:900 35px system-ui;box-shadow:0 0 0 8px #fff,0 0 0 11px var(--gold)}.brand{margin:23px 0 0;font:900 22px system-ui;letter-spacing:2px}.paper h1{font-size:52px;margin:20px 0 8px}.intro{font-size:20px}.name{font-size:39px;color:var(--blue);margin:25px auto 14px;border-bottom:1px solid #b8c7da;max-width:760px;padding-bottom:12px}.course{font-size:29px;margin:17px 0}.meta{margin-top:48px;font:14px/1.6 system-ui;color:#536988}.signature{display:inline-block;margin-top:38px;min-width:300px;border-top:1px solid var(--navy);padding-top:8px;font:700 14px system-ui}.error{padding:80px 20px;text-align:center;font:18px system-ui}@media(max-width:700px){.paper{margin:0 10px 25px;min-height:650px;padding:55px 30px}.paper h1{font-size:38px}.name{font-size:29px}.course{font-size:23px}}@media print{body{background:#fff}.actions{display:none}.paper{box-shadow:none;margin:0;max-width:none;width:100%;min-height:100vh;page-break-after:avoid}}
</style></head><body><div class="actions"><a href="/meus-cursos.html">← Meus cursos</a><button onclick="print()">Imprimir ou salvar em PDF</button></div><main id="root"><div class="error">Preparando certificado…</div></main><script>
const escapeHtml=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const slug=new URLSearchParams(location.search).get('curso')||'';
async function load(){const root=document.querySelector('#root');try{const r=await fetch(`/api/my-courses/${encodeURIComponent(slug)}/certificate`,{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível emitir.');const date=new Date(`${d.issuedAt.replace(' ','T')}Z`).toLocaleDateString('pt-BR');root.innerHTML=`<article class="paper"><div class="seal">VC</div><p class="brand">VITRINECITY EDUCAÇÃO</p><h1>Certificado de Conclusão</h1><p class="intro">Certificamos que</p><div class="name">${escapeHtml(d.holderName)}</div><p class="intro">concluiu o curso livre</p><div class="course">${escapeHtml(d.courseTitle)}</div><p>com ${d.totalLessons} aulas e atividades de aprendizagem.</p><div class="signature">VitrineCity Educação</div><div class="meta">Emitido em ${date}<br>Código de validação: <b>${escapeHtml(d.verificationCode)}</b><br>${escapeHtml(d.verificationUrl)}<br><small>Certificado de curso livre, sem equivalência a diploma ou habilitação profissional.</small></div></article>`}catch(e){root.innerHTML=`<div class="error"><h1>Certificado indisponível</h1><p>${escapeHtml(e.message)}</p><a href="/meus-cursos.html">Voltar aos cursos</a></div>`}}load();
</script></body></html>
