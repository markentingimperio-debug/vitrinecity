<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Oportunidades | Administração VitrineCity</title><style>body{margin:0;background:#f3f7fc;color:#0b2855;font:15px/1.5 system-ui}header{padding:18px 5%;background:#071f4b;color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{max-width:1100px;margin:30px auto;padding:0 20px}.toolbar,article{background:#fff;border:1px solid #d8e5f4;border-radius:16px;padding:18px;margin-bottom:13px}.toolbar{display:flex;gap:10px}select,textarea,button{font:inherit;padding:10px;border:1px solid #bfd0e4;border-radius:9px}textarea{width:100%;min-height:70px}button{background:#1768e6;color:#fff;border:0;font-weight:850;cursor:pointer}.meta{color:#657a96}.actions{display:flex;gap:8px;flex-wrap:wrap}.publish{background:#168052}.reject{background:#b23a3a}.changes{background:#a56c12}.tag{font-weight:900;text-transform:uppercase;font-size:11px;color:#1768e6}</style></head><body><header><b>Oportunidades recebidas</b><a href="/admin">← Painel</a></header><main><div class="toolbar"><select id="filter"><option value="">Todos</option><option value="pending">Pendentes</option><option value="changes_requested">Correção solicitada</option><option value="published">Publicadas</option><option value="rejected">Rejeitadas</option></select><button id="refresh">Atualizar</button></div><div id="items"></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function json(url,opt){const r=await fetch(url,opt),d=await r.json();if(r.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-oportunidades.html';throw new Error('Entre como administrador.')}if(!r.ok)throw new Error(d.error||'Falha');return d}async function load(){const q=document.querySelector('#filter').value,box=document.querySelector('#items');try{const d=await json('/api/admin/opportunities'+(q?'?status='+encodeURIComponent(q):''));box.innerHTML=d.items.length?d.items.map(x=>`<article data-id="${x.id}"><span class="tag">${esc(x.kind)} · ${esc(x.status)}</span><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p><p class="meta">${esc(x.business_name)} · ${esc(x.city)} · ${esc(x.contact_email)} · <a href="${esc(x.contact_url)}" target="_blank" rel="noopener">contato</a>${x.expires_on?' · validade '+esc(x.expires_on):''}</p><textarea placeholder="Motivo ou observação">${esc(x.review_note)}</textarea><div class="actions"><button class="publish" data-status="published">Publicar</button><button class="changes" data-status="changes_requested">Pedir correção</button><button class="reject" data-status="rejected">Rejeitar</button><button data-status="expired">Encerrar</button></div></article>`).join(''):'<article>Nenhum item nesta fila.</article>'}catch(e){box.innerHTML='<article>'+esc(e.message)+'</article>'}}document.querySelector('#items').addEventListener('click',async e=>{const status=e.target.dataset.status;if(!status)return;const card=e.target.closest('article');e.target.disabled=true;try{await json('/api/admin/opportunities/'+card.dataset.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status,reviewNote:card.querySelector('textarea').value})});await load()}catch(error){alert(error.message);e.target.disabled=false}});document.querySelector('#refresh').onclick=load;document.querySelector('#filter').onchange=load;load();</script></body></html>
