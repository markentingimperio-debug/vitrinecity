<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Descubra pessoas, cidades, hashtags, lojas e publicações em destaque na Vitriny Social."><link rel="canonical" href="https://vitrinecity.com/descobrir"><meta property="og:type" content="website"><meta property="og:title" content="Descobrir pessoas e negócios — Vitriny Social"><meta property="og:description" content="Explore pessoas, cidades, hashtags, lojas e conteúdos populares na Vitriny Social."><meta property="og:url" content="https://vitrinecity.com/descobrir"><meta property="og:image" content="https://vitrinecity.com/assets/vitriny-city-master.jpg"><meta property="og:image:alt" content="Descobrir pessoas e negócios na Vitriny Social"><title>Descobrir pessoas e negócios — Vitriny Social</title><style>
:root{--blue:#1768e6;--yellow:#ffc628;--bg:#050a13;--panel:#101a2d;--line:#293750;--text:#f7faff;--muted:#aebbd0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.top{height:68px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,4vw);background:#07101df2;border-bottom:1px solid #ffffff18}.brand{font-size:24px;font-weight:950}.brand span{color:var(--yellow)}.back{padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-weight:850}.wrap{width:min(980px,100%);margin:auto;padding:28px 18px 80px}.search{display:flex;gap:9px}.search input{flex:1;min-width:0;padding:15px 17px;border:1px solid #384965;border-radius:15px;background:#0b1526;color:#fff;font:inherit}.btn{border:0;border-radius:13px;background:var(--blue);color:#fff;padding:0 19px;font-weight:900;cursor:pointer}h1{margin:0 0 17px}h2{margin:30px 0 13px}.tags{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.tag{white-space:nowrap;border:1px solid var(--line);background:#101a2d;color:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.person{display:flex;align-items:center;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.avatar{width:50px;height:50px;flex:0 0 auto;border-radius:50%;object-fit:cover;background:linear-gradient(145deg,var(--blue),#764cff);display:grid;place-items:center;font-weight:950}.person b,.person small{display:block;overflow:hidden;text-overflow:ellipsis}.person small{color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.post{position:relative;aspect-ratio:9/16;border:0;padding:0;background:#111b2c;overflow:hidden;border-radius:12px;cursor:pointer}.post img,.post iframe{width:100%;height:100%;object-fit:cover;border:0;pointer-events:none}.post span{position:absolute;inset:auto 8px 8px;text-align:left;font-size:12px;font-weight:900;text-shadow:0 1px 5px #000}.empty{grid-column:1/-1;padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}@media(max-width:720px){.top{height:60px}.wrap{padding:18px 10px 60px}.people{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr);gap:2px}.post{border-radius:3px}.search .btn{padding:0 14px}}
</style><script src="/openai-ads.js" defer></script></head><body><header class="top"><a class="brand" href="/social">Vitriny <span>Social</span></a><a class="back" href="/social">← Feed</a></header><main class="wrap"><h1>Descobrir</h1><form class="search" id="search"><input id="q" maxlength="60" placeholder="Pessoas, cidade, assunto ou #hashtag" aria-label="Pesquisar"><button class="btn">Buscar</button></form><section><h2>Em alta</h2><div class="tags" id="tags"></div></section><section><h2>Pessoas</h2><div class="people" id="people"></div></section><section><h2>Publicações</h2><div class="grid" id="posts"></div></section></main><div id="viewer" style="display:none;position:fixed;inset:0;z-index:20;background:#000e;padding:14px;place-items:center"><button id="close" aria-label="Fechar" style="position:absolute;right:18px;top:15px;z-index:2;border:0;border-radius:50%;width:44px;height:44px;font-size:26px">×</button><iframe id="frame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:min(460px,100%);height:min(90dvh,820px);border:0;border-radius:16px;background:#000"></iframe></div><script src="/discover-renderer.js"></script><script>
const {element,empty,safeImageUrl,safePlayerUrl}=window.VitrineDiscoverRenderer;const q=document.getElementById('q');let loadController;q.value=new URLSearchParams(location.search).get('q')||'';
async function load(){
  loadController?.abort();const controller=new AbortController();loadController=controller;const query=q.value.trim();
  let r,d;try{r=await fetch('/api/social/discover?q='+encodeURIComponent(query),{signal:controller.signal});d=await r.json()}catch(error){if(error.name==='AbortError')return;throw error}
  if(controller.signal.aborted)return;
  const tags=(d.hashtags||[]).map(x=>element('button',{className:'tag',text:`#${x.tag} · ${Number(x.count)}`,attributes:{type:'button','data-tag':x.tag}}));
  document.getElementById('tags').replaceChildren(...(tags.length?tags:[empty('span','empty','As hashtags aparecerão conforme a comunidade publicar.')]));
  const people=(d.profiles||[]).map(p=>{
    const avatarUrl=safeImageUrl(p.avatarUrl);
    const avatar=avatarUrl?element('img',{className:'avatar',attributes:{src:avatarUrl,alt:''}}):element('span',{className:'avatar',text:String(p.name||'').slice(0,1)});
    return element('a',{className:'person',attributes:{href:`/perfil/${encodeURIComponent(p.handle)}`}},[avatar,element('span',{},[
      element('b',{text:p.name}),element('small',{text:`@${p.handle} · ${Number(p.followers)} seguidores`}),element('small',{text:p.city||'Vitriny City'})
    ])]);
  });
  document.getElementById('people').replaceChildren(...(people.length?people:[empty('div','empty','Nenhuma pessoa encontrada.')]));
  const posts=(d.posts||[]).map(p=>{
    const playerUrl=safePlayerUrl(p.playerUrl),imageUrl=safeImageUrl(p.imageUrl);
    const media=p.mediaType==='image'&&imageUrl?element('img',{attributes:{src:imageUrl,alt:p.caption||''}}):playerUrl?element('iframe',{attributes:{src:playerUrl,title:p.caption||''}}):null;
    return element('button',{className:'post',attributes:{type:'button','data-player':playerUrl,'data-post-id':Number(p.id)}},[media,element('span',{},[
      document.createTextNode(`@${p.author?.handle||''}`),document.createElement('br'),document.createTextNode(p.caption||'Publicação')
    ])]);
  });
  document.getElementById('posts').replaceChildren(...(posts.length?posts:[empty('div','empty','Nenhuma publicação encontrada.')]));
}
document.getElementById('search').onsubmit=e=>{e.preventDefault();history.replaceState(null,'','?q='+encodeURIComponent(q.value.trim()));load()};document.getElementById('tags').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;q.value='#'+b.dataset.tag;history.replaceState(null,'','?q='+encodeURIComponent(b.dataset.tag));load()};document.getElementById('posts').onclick=e=>{const b=e.target.closest('.post');if(!b)return;if(b.dataset.player){document.getElementById('frame').src=b.dataset.player+'&autoplay=true';document.getElementById('viewer').style.display='grid'}else b.querySelector('img')?.requestFullscreen?.()};function closeViewer(){document.getElementById('viewer').style.display='none';document.getElementById('frame').src=''}document.getElementById('close').onclick=closeViewer;load();
</script></body></html>
