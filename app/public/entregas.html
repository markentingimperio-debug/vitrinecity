<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Escolha uma loja aberta, veja os produtos e peça pelo VC Entregas."><title>VC Entregas — lojas</title><style>
:root{--navy:#071f4b;--blue:#1768e6;--yellow:#ffc628;--line:#d7e5f5;--muted:#60738f;--green:#087443}*{box-sizing:border-box}body{margin:0;background:#f4f8fd;color:var(--navy);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:14px max(18px,5vw);background:#071f4bf2;color:#fff;box-shadow:0 4px 20px #071f4b22}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}nav{display:flex;gap:8px;margin-left:auto}.button,button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.alt{background:#ffffff18}.hero{padding:54px max(18px,5vw) 36px;background:linear-gradient(135deg,#071f4b,#1268df);color:#fff}.hero h1{font-size:clamp(36px,7vw,66px);line-height:1;margin:0 0 14px}.hero p{max-width:650px;color:#d8e8ff;font-size:18px}.search{display:flex;gap:9px;max-width:720px;margin-top:22px}.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:14px;font:inherit}.shell{max-width:1180px;margin:auto;padding:32px 18px 90px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:17px}.section-head h2{font-size:28px;margin:0}.section-head p{margin:3px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.store{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 34px #173d700c;transition:.18s}.store:hover{transform:translateY(-3px);box-shadow:0 18px 40px #173d701b}.store img{width:100%;height:175px;object-fit:cover;background:#e8f0fa}.copy{padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.top h3{font-size:20px;line-height:1.2;margin:0}.status{white-space:nowrap;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:#e7f7ef;color:var(--green)}.status.closed{background:#f2f3f5;color:#6a7280}.description{color:var(--muted);min-height:45px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.meta span{background:#edf4fd;border-radius:8px;padding:6px 8px;font-size:12px}.store .button{width:100%}.empty{grid-column:1/-1;padding:50px;text-align:center;background:#fff;border:1px dashed #9eb5d2;border-radius:18px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding-top:38px}nav .optional{display:none}.store img{height:155px}}
</style></head><body><header><a class="brand" href="/entregas">VC <span>Entregas</span></a><nav><a class="button alt optional" href="/entrar.html">Entrar</a><a class="button alt" href="/pedidos.html">Meus pedidos</a></nav></header><section class="hero"><h1>O que você quer pedir?</h1><p>Veja as lojas disponíveis, escolha os produtos e acompanhe a entrega pelo celular.</p><div class="search"><input id="search" type="search" placeholder="Buscar loja ou tipo de produto"><button id="searchButton">Buscar</button></div></section><main class="shell"><div class="section-head"><div><h2>Lojas</h2><p id="summary">Carregando lojas próximas…</p></div><a href="/loja">Ver todos os produtos →</a></div><section class="grid" id="stores"><div class="empty">Carregando…</div></section></main><script>
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),money=cents=>(Number(cents||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),typeLabel={food:'Restaurante e alimentação',hybrid:'Alimentos e produtos',retail:'Loja e produtos'};async function load(){const q=search.value.trim();stores.innerHTML='<div class="empty">Buscando lojas…</div>';try{const response=await fetch('/api/marketplace/stores?q='+encodeURIComponent(q)),data=await response.json();if(!response.ok)throw Error();const items=data.stores||[],open=items.filter(store=>store.open).length;summary.textContent=`${items.length} loja${items.length===1?'':'s'} · ${open} aberta${open===1?'':'s'} agora`;stores.innerHTML=items.map(store=>`<a class="store" href="${esc(store.path)}"><img src="${esc(store.image_url)}" alt="${esc(store.business_name)}" onerror="this.onerror=null;this.src='/assets/store-seed/utilidades.svg'"><div class="copy"><div class="top"><h3>${esc(store.business_name)}</h3><span class="status ${store.open?'':'closed'}">${store.open?'Aberta':'Fechada'}</span></div><p class="description">${esc(store.description||typeLabel[store.business_type]||'Produtos disponíveis na VitrineCity.')}</p><div class="meta"><span>${esc(typeLabel[store.business_type]||'Loja')}</span><span>${store.product_count} ${store.product_count===1?'item':'itens'}</span>${store.starting_price_cents?`<span>A partir de ${money(store.starting_price_cents)}</span>`:''}${store.rating_count?`<span>★ ${Number(store.rating_average).toFixed(1)}</span>`:''}${store.preparation_max_minutes?`<span>${store.preparation_min_minutes}–${store.preparation_max_minutes} min</span>`:''}</div><span class="button">${store.open?'Ver produtos e comprar':'Ver loja'}</span></div></a>`).join('')||'<div class="empty"><h3>Nenhuma loja encontrada.</h3><p>Tente buscar por outro nome ou produto.</p></div>'}catch{summary.textContent='Não foi possível carregar agora.';stores.innerHTML='<div class="empty">Tente novamente em alguns instantes.</div>'}}searchButton.onclick=load;search.onkeydown=event=>{if(event.key==='Enter')load()};load();
</script></body></html>
