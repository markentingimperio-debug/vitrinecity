<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel da minha loja — VitrineCity</title><style>
:root{--navy:#071f4b;--blue:#1768e6;--gold:#ffc628;--muted:#64748b;--line:#d9e5f4;--green:#168052}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--navy);background:linear-gradient(145deg,#e9f5ff,#fff)}header{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:950;color:var(--navy);text-decoration:none}.brand:before{content:"";display:inline-block;width:27px;height:27px;background:var(--blue);border-radius:9px 9px 3px 3px;margin-right:8px;vertical-align:-5px}main{max-width:1050px;margin:36px auto;padding:0 20px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 18px 55px #103b7013}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,43px)}.hero p{margin:0;color:var(--muted)}.status{padding:9px 13px;border-radius:99px;background:#e8f2ff;color:#1458b7;font-weight:900;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{display:block;font-weight:850;font-size:13px;margin-bottom:6px}input,textarea{width:100%;border:1px solid #bfd3ec;border-radius:11px;padding:12px;font:inherit;background:#fff}textarea{min-height:105px;resize:vertical}.hint{display:block;color:var(--muted);font-size:11px;margin-top:5px}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:16px}.upload{border:1px dashed #9db8d8;background:#f6faff;border-radius:16px;padding:16px}.preview{width:100%;height:150px;object-fit:cover;border-radius:11px;background:#eaf1f8;margin-top:10px;display:none}.checks{display:flex;gap:12px;flex-wrap:wrap}.check{display:flex;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}.check input{width:auto}.button{border:0;border-radius:12px;padding:15px 21px;background:var(--gold);color:var(--navy);font-weight:950;font-size:16px;cursor:pointer}.message{min-height:22px;margin-top:12px;font-weight:800}.notes{display:none;background:#fff7df;border:1px solid #f1d077;border-radius:12px;padding:13px;margin-top:12px}.notes.show{display:block}@media(max-width:700px){.grid,.uploads{grid-template-columns:1fr}.wide{grid-column:auto}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body><header><a class="brand" href="/">VitrineCity</a><a href="/cidade-25d-demo.html">Ver cidade</a></header><main>
<section class="hero"><div><h1>Configure sua loja</h1><p id="plan">Carregando seu prédio digital...</p></div><span class="status" id="status">Verificando</span></section>
<form class="card" id="form" hidden><div class="grid"><div class="wide"><label for="businessName">Nome da loja *</label><input id="businessName" maxlength="100" required></div><div class="wide"><label for="description">Descrição da loja</label><textarea id="description" maxlength="1200" placeholder="Conte o que sua empresa vende e por que o cliente deve conhecê-la."></textarea></div><div class="wide uploads"><div class="upload"><label for="logo">Logo ou marca</label><input id="logo" type="file" accept="image/png,image/jpeg,image/webp"><span class="hint">JPG, PNG ou WebP. A imagem será otimizada.</span><img class="preview" id="logoPreview" alt="Prévia da logo"></div><div class="upload"><label for="facade">Foto da fachada</label><input id="facade" type="file" accept="image/png,image/jpeg,image/webp"><span class="hint">Use uma foto clara e de frente.</span><img class="preview" id="facadePreview" alt="Prévia da fachada"></div></div><div><label for="whatsapp">WhatsApp</label><input id="whatsapp" inputmode="tel"></div><div><label for="promotionText">Letreiro promocional</label><input id="promotionText" maxlength="120" placeholder="Ex.: Toda a loja com 50% OFF"></div><div><label for="websiteUrl">Site</label><input id="websiteUrl" type="url" placeholder="https://..."></div><div><label for="instagramUrl">Instagram</label><input id="instagramUrl" type="url" placeholder="https://instagram.com/..."></div><div><label for="tiktokUrl">TikTok</label><input id="tiktokUrl" type="url" placeholder="https://tiktok.com/@..."></div><div><label for="googleMapsUrl">Google Maps</label><input id="googleMapsUrl" type="url" placeholder="https://maps.app.goo.gl/..."></div><div class="wide checks"><label class="check"><input id="wantsWebsite" type="checkbox"> Quero orçamento para criação de site/landing page</label><label class="check"><input id="wantsBrandArt" type="checkbox"> Quero criação de logo ou arte da fachada</label></div><div class="wide"><button class="button" id="submit" type="submit">Enviar para aprovação</button><div class="message" id="message"></div><div class="notes" id="notes"></div></div></div></form>
</main><script>
const q=new URLSearchParams(location.search),ref=q.get('ref')||'',token=q.get('token')||localStorage.getItem('vc_store_'+ref)||'';if(ref&&token)localStorage.setItem('vc_store_'+ref,token);
const form=document.getElementById('form'),message=document.getElementById('message'),statusEl=document.getElementById('status'),notes=document.getElementById('notes');let existing={};
const fields=['businessName','description','whatsapp','websiteUrl','instagramUrl','tiktokUrl','googleMapsUrl','promotionText'];
function label(status){return({draft:'Rascunho',pending:'Aguardando aprovação',approved:'Aprovada',changes_requested:'Ajustes solicitados',published:'Publicada'})[status]||status||'Pronta para configurar'}
function showImage(id,url){if(!url)return;const img=document.getElementById(id);img.src=url;img.style.display='block'}
async function load(){if(!ref||!token){message.textContent='O link do painel está incompleto. Abra o link recebido após a compra.';form.hidden=false;return}try{const r=await fetch(`/api/store-portal/${encodeURIComponent(ref)}?token=${encodeURIComponent(token)}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error);existing=d.profile||{};document.getElementById('plan').textContent=`${d.order.businessName||'Sua loja'} · ${d.order.lotCode} · ${d.order.billingType==='recurring'?'Plano mensal':'Plano fundador'}`;statusEl.textContent=label(existing.reviewStatus);for(const id of fields)document.getElementById(id).value=existing[id]|| (id==='businessName'?d.order.businessName||'':'');document.getElementById('wantsWebsite').checked=!!existing.wantsWebsite;document.getElementById('wantsBrandArt').checked=!!existing.wantsBrandArt;showImage('logoPreview',existing.logoUrl);showImage('facadePreview',existing.facadeUrl);if(existing.adminNotes){notes.textContent='Observação da equipe: '+existing.adminNotes;notes.classList.add('show')}form.hidden=false}catch(e){form.hidden=false;message.textContent=e.message}}
async function imageData(input,preview){const file=input.files[0];if(!file)return '';if(file.size>8e6)throw new Error('A imagem original deve ter no máximo 8 MB.');const bitmap=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/webp',.82);preview.src=data;preview.style.display='block';return data}
for(const pair of [['logo','logoPreview'],['facade','facadePreview']])document.getElementById(pair[0]).addEventListener('change',()=>imageData(document.getElementById(pair[0]),document.getElementById(pair[1])).catch(e=>message.textContent=e.message));
form.addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;message.textContent='Enviando dados...';try{const body={token};for(const id of fields)body[id]=document.getElementById(id).value.trim();body.wantsWebsite=document.getElementById('wantsWebsite').checked;body.wantsBrandArt=document.getElementById('wantsBrandArt').checked;body.logo=await imageData(document.getElementById('logo'),document.getElementById('logoPreview'));body.facade=await imageData(document.getElementById('facade'),document.getElementById('facadePreview'));const r=await fetch(`/api/store-portal/${encodeURIComponent(ref)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error);statusEl.textContent='Aguardando aprovação';message.textContent='Dados enviados! Nossa equipe fará a revisão antes da publicação.'}catch(err){message.textContent=err.message}finally{button.disabled=false}});load();
</script><script>
(async()=>{try{const r=await fetch(`/api/store-portal/${encodeURIComponent(ref)}?token=${encodeURIComponent(token)}`,{cache:'no-store'}),d=await r.json();if(d.order?.billingType==='recurring'){const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancelar assinatura mensal';cancel.style.cssText='margin-top:18px;border:0;background:transparent;color:#a53131;text-decoration:underline;cursor:pointer';cancel.onclick=async()=>{if(!confirm('Deseja cancelar a renovação mensal? A loja deixará de permanecer ativa conforme os termos do plano.'))return;const response=await fetch(`/api/store-portal/${encodeURIComponent(ref)}/cancel-subscription`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}),data=await response.json();alert(data.message||data.error);if(response.ok)location.reload()};form.append(cancel)}}catch{}})();
</script></body></html>
