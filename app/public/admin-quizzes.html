<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Biblioteca de Quizzes | VitrineCity</title>
<style>:root{--navy:#071f4b;--blue:#1768e6;--bg:#eef5fc;--line:#d6e4f3;--text:#10264a;--muted:#657a96;--ok:#16804c;--warn:#a65e00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui}header{display:flex;justify-content:space-between;gap:20px;padding:17px 4%;background:var(--navy);color:white}header a{color:white}.wrap{width:min(1240px,94%);margin:28px auto}.hero,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px}.hero h1{margin:0;font-size:34px}.hero p,.muted{color:var(--muted)}.tools{display:flex;gap:9px;flex-wrap:wrap}input,select,button,.button{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid #b9cce1}input{min-width:0;width:250px;max-width:100%}button,.button{min-height:44px;display:inline-flex;align-items:center}button:disabled{opacity:.65;cursor:wait}.publication{padding:14px;border:1px solid var(--line);border-radius:12px;margin:14px 0;background:#f6faff;overflow-wrap:anywhere}.publication p{margin:6px 0}.publication .tools{margin-top:10px}.receipt{font-size:12px}.card{min-width:0;overflow-wrap:anywhere}button,.button{background:var(--blue);color:white;border:0;font-weight:800;cursor:pointer;text-decoration:none}.grid{display:grid;gap:15px;margin-top:16px}.quiz-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.quiz-head h2{margin:0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8f1ff;color:#1253a8;font-size:11px;font-weight:900}.score.ok{color:var(--ok)}.score.warn{color:var(--warn)}details{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:850}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}pre{white-space:pre-wrap;background:#f5f8fc;padding:13px;border-radius:10px;font:12px/1.55 system-ui}.scene-grid,.network-grid{display:flex;gap:7px;flex-wrap:wrap}.scene,.network{padding:7px 9px;background:#f1f5fa;border-radius:8px;font-size:11px}.scene.done,.network.published{background:#e4f7ec;color:#12683c}.scene.failed,.network.failed{background:#ffe9e9;color:#9a2525}video{width:100%;max-height:620px;background:#07101d;border-radius:12px;margin-top:12px}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:760px){.hero,.quiz-head{display:block}.tools{margin-top:14px}.columns{grid-template-columns:1fr}}</style></head>
<body><header><strong>VitrineCity · Biblioteca de Quizzes</strong><nav><a href="/admin">Central de gestão</a> · <a href="/admin-agentes.html#fabrica-neural">Criar quiz</a></nav></header>
<main class="wrap"><section class="hero"><div><span class="pill">HISTÓRICO PERMANENTE</span><h1>Biblioteca de Quizzes</h1><p>Revise consistência, cenas, vídeo final e publicação em cada rede.</p></div><div class="tools"><input id="search" aria-label="Buscar tema ou roteiro" type="search" placeholder="Buscar tema ou roteiro…"><select id="status" aria-label="Filtrar por situação"><option value="">Todos os estados</option><option value="awaiting_approval">Aguardando aprovação</option><option value="in_production">Em produção</option><option value="approved">Montagem concluída</option><option value="publication:processing">Processando vídeo</option><option value="publication:unknown">Envio sem confirmação</option><option value="published">Publicado</option></select><button id="reload">Atualizar</button></div></section><section class="grid" id="list"><div class="empty">Carregando quizzes…</div></section></main>
<script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let quizzes=[];const labels={awaiting_approval:'Aguardando aprovação',in_production:'Gerando e editando',approved:'Montagem concluída',published:'Publicado',cancelled:'Cancelado'};function consistency(q){const checks=[];checks.push([(q.questions||[]).length===3,'3 perguntas']);checks.push([(q.questions||[]).every(x=>Array.isArray(x.options)&&x.options.length===3),'3 alternativas por pergunta']);checks.push([(q.questions||[]).every(x=>Number.isInteger(x.answer)&&x.answer>=0&&x.answer<3),'respostas válidas']);checks.push([!q.scenes?.length||q.scenes.length===9,'9 cenas']);checks.push([!q.scenes?.length||q.scenes.reduce((n,s)=>n+Number(s.duration_seconds||0),0)===68,'68 s brutos / 65 s finais']);const passed=checks.filter(x=>x[0]).length;return {passed,total:checks.length,text:checks.map(x=>(x[0]?'✓ ':'⚠ ')+x[1]).join(' · ')}}const publicationLabels={not_started:'Ainda não enviado',submitting:'Enviando vídeo',processing:'Processando vídeo',pending_review:'Aguardando moderação',published:'Publicado na Vitrine Social',unknown:'Envio sem confirmação',error:'Falha no processamento',blocked:'Publicação bloqueada',paused:'Publicação pausada',source_changed:'Publicação bloqueada'};
function publicationState(q){return q.publication?.status||'not_started'}
function quizStatus(q){const state=publicationState(q);return q.status==='cancelled'?'Cancelado':state!=='not_started'?(publicationLabels[state]||'Conferência necessária'):(q.status==='published'?'Publicação sem confirmação':labels[q.status]||q.status)}
function publicationCard(q){const p=q.publication;if(!p)return q.status==='published'?'<section class="publication"><strong>Publicação sem confirmação</strong><p>Aguarde a conferência do comprovante antes de considerar este quiz publicado.</p></section>':'';
  const receipt=/^[a-f0-9]{32}$/i.test(String(p.receiptId||''))?`<p class="receipt">Comprovante do vídeo: ${esc(p.receiptId)}</p>`:'';
  const projectId=Number(q.media_project_id),canCheck=p.canReconcile&&Number.isSafeInteger(projectId)&&projectId>0;
  const link=p.status==='published'&&p.postId?`<a class="button" href="/social/post/${encodeURIComponent(String(p.postId))}" target="_blank" rel="noopener">Ver publicação</a>`:'';
  return `<section class="publication"><strong>${esc(publicationLabels[p.status]||'Conferência necessária')}</strong><p role="status">${esc(p.message||'Situação indisponível.')}</p>${receipt}${canCheck||link?`<div class="tools">${canCheck?`<button data-check-publication="${projectId}">Conferir envio</button>`:''}${link}</div>`:''}${canCheck?'<p class="muted">A conferência usa o vídeo já enviado; não cria outra publicação.</p>':''}</section>`}
function distributionStatus(d){return d.publication?(publicationLabels[d.publication.status]||'Conferência necessária'):({pending:'Aguardando envio',awaiting_connection:'Aguardando conexão',published:'Publicado',failed:'Falha no envio'}[d.status]||'Conferência necessária')}
function render(){const term=$('#search').value.toLowerCase(),status=$('#status').value,items=quizzes.filter(q=>(!status||(status.startsWith('publication:')?publicationState(q)===status.slice(12):status==='published'?publicationState(q)==='published':q.status===status))&&(!term||`${q.theme} ${q.script}`.toLowerCase().includes(term)));$('#list').innerHTML=items.length?items.map(q=>{const c=consistency(q),done=(q.scenes||[]).filter(s=>s.status==='downloaded').length;return `<article class="card"><div class="quiz-head"><div><span class="pill">#${q.id} · ${esc(q.category)}</span><h2>${esc(q.theme)}</h2><div class="muted">${esc(quizStatus(q))} · ${done}/${q.scenes?.length||9} cenas · voz ${esc(q.voice)}</div></div><strong class="score ${c.passed===c.total?'ok':'warn'}">Consistência ${c.passed}/${c.total}</strong></div><p>${esc(c.text)}</p>${publicationCard(q)}<div class="scene-grid">${(q.scenes||[]).map(s=>`<span class="scene ${s.status==='downloaded'?'done':s.status==='failed'?'failed':''}" title="${esc(s.error_message||'')}">Cena ${s.scene_number}: ${esc(s.status)}</span>`).join('')||'<span class="muted">Cenas ainda não iniciadas</span>'}</div>${q.media?.output_url?`<video controls preload="metadata" src="${esc(q.media.output_url)}"></video>`:''}<details><summary>Analisar conteúdo completo</summary><div class="columns"><div><h3>Perguntas e respostas</h3>${(q.questions||[]).map((x,i)=>`<p><strong>${i+1}. ${esc(x.question)}</strong><br>${x.options.map((o,j)=>`${j===x.answer?'✓':'○'} ${'ABC'[j]}) ${esc(o)}`).join('<br>')}</p>`).join('')}</div><div><h3>Roteiro</h3><pre>${esc(q.script)}</pre><p><strong>Destino:</strong> ${esc(q.destination_label)} · ${esc(q.destination_url)}</p></div></div><h3>Distribuição</h3><div class="network-grid">${(q.distribution||[]).map(d=>`<span class="network ${esc(d.status)}">${esc(({vitrine_social:"Vitrine Social",instagram:"Instagram",facebook:"Facebook",tiktok:"TikTok",youtube:"YouTube",kwai:"Kwai",bilibili:"Bilibili"})[d.provider]||d.provider)}: ${esc(distributionStatus(d))}</span>`).join('')||'<span class="muted">Distribuição ainda não iniciada</span>'}</div></details></article>`}).join(''):'<div class="card empty">Nenhum quiz corresponde aos filtros.</div>'}async function load(){const r=await fetch('/api/admin/viral-quizzes'),d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/admin-login.html?returnTo=%2Fadmin-quizzes.html';return}if(!r.ok)throw Error(d.error||'Falha ao carregar.');quizzes=d.quizzes||[];render()}$('#search').oninput=render;$('#status').onchange=render;$('#reload').onclick=()=>load().catch(e=>$('#list').innerHTML=`<div class="card empty">${esc(e.message)}</div>`);
$('#list').onclick=async event=>{const button=event.target.closest('[data-check-publication]');if(!button||button.disabled)return;button.disabled=true;const box=button.closest('.publication'),status=box.querySelector('[role="status"]');status.textContent='Conferindo o vídeo existente…';try{const response=await fetch(`/api/admin/media-projects/${button.dataset.checkPublication}/sync-publication`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Não foi possível conferir agora. Nenhum novo envio foi feito.');await load()}catch(error){status.textContent=error.message}finally{button.disabled=false}};load().catch(e=>$('#list').innerHTML=`<div class="card empty">${esc(e.message)}</div>`);</script></body></html>
