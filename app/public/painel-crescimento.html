<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do assinante | VitrineCity</title><style>body{margin:0;background:#f2f6fb;color:#10254a;font-family:Arial,sans-serif}header{background:#071f4d;color:#fff;padding:20px max(24px,calc((100% - 900px)/2))}main{max-width:900px;margin:auto;padding:40px 24px}.card{background:#fff;border:1px solid #d9e4f2;border-radius:20px;padding:26px;margin-bottom:18px}.status{display:inline-block;padding:7px 12px;border-radius:999px;background:#e5efff;color:#075bc4;font-weight:800}button,a.button{display:inline-block;border:0;border-radius:10px;padding:13px 16px;background:#1769e8;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.danger{background:#b73a35}.hidden{display:none}</style><script src="/openai-ads.js" defer></script></head><body><header><strong>▰ VitrineCity · Área do assinante</strong></header><main><div id="message" class="card">Carregando sua assinatura…</div><section id="panel" class="hidden"><div class="card"><span id="status" class="status"></span><h1 id="plan"></h1><p id="company"></p><p id="site"></p></div><div class="card"><h2>Suas entregas</h2><ul id="features"></ul><a class="button" href="/contato.html">Solicitar atendimento</a></div><div class="card"><h2>Gerenciar assinatura</h2><p>O cancelamento interrompe as próximas renovações.</p><button id="cancel" class="danger">Cancelar assinatura</button></div></section></main><script>
async function load(){const m=document.querySelector('#message');try{const r=await fetch('/api/growth/subscription'),d=await r.json();if(r.status===401){m.innerHTML='Entre na sua conta para acessar. <a class="button" href="/minha-conta.html">Entrar</a>';return}if(!d.subscription){m.innerHTML='Você ainda não possui uma assinatura. <a class="button" href="/fabrica-crescimento.html">Conhecer planos</a>';return}const s=d.subscription,p=d.plan;m.classList.add('hidden');document.querySelector('#panel').classList.remove('hidden');document.querySelector('#status').textContent=s.status==='approved'?'ATIVA':s.status.toUpperCase();document.querySelector('#plan').textContent=p?.name||s.plan_code;document.querySelector('#company').textContent=s.business_name;document.querySelector('#site').textContent=s.website_url||'Site ainda não informado';document.querySelector('#features').innerHTML=(p?.features||[]).map(x=>`<li>${x}</li>`).join('');if(!['approved','pending','paused'].includes(s.status))document.querySelector('#cancel').classList.add('hidden')}catch{m.textContent='Não foi possível carregar a assinatura.'}}document.querySelector('#cancel').onclick=async()=>{if(!confirm('Deseja realmente cancelar as próximas cobranças?'))return;const r=await fetch('/api/growth/subscription/cancel',{method:'POST',headers:{'content-type':'application/json'}}),d=await r.json();if(!r.ok)return alert(d.error||'Falha ao cancelar.');location.reload()};load();
</script></body></html>
