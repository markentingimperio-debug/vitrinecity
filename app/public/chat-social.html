<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mensagens — Vitriny Social</title><style>
:root{--blue:#1768e6;--yellow:#ffc628;--bg:#050a13;--panel:#101a2d;--panel2:#162238;--line:#293750;--text:#f7faff;--muted:#aebbd0}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#07101d;border-bottom:1px solid var(--line)}.brand{color:#fff;text-decoration:none;font-size:22px;font-weight:950}.brand span{color:var(--yellow)}.back{color:#dce8ff;text-decoration:none;font-weight:850}.app{height:calc(100dvh - 64px);display:grid;grid-template-columns:340px 1fr;max-width:1180px;margin:auto;border-inline:1px solid var(--line)}.sidebar{border-right:1px solid var(--line);overflow:auto;background:#08111f}.sidebar h1{font-size:21px;margin:0;padding:18px}.conversation{width:100%;border:0;border-top:1px solid #ffffff0e;background:none;color:#fff;padding:13px 15px;display:grid;grid-template-columns:48px 1fr auto;gap:10px;text-align:left;cursor:pointer}.conversation:hover,.conversation.active{background:var(--panel2)}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:linear-gradient(145deg,var(--blue),#7b4cff);display:grid;place-items:center;font-weight:950}.conversation strong,.conversation small{display:block}.conversation small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}.unread{background:#ff315d;border-radius:99px;min-width:21px;padding:3px 6px;text-align:center;font-size:11px;font-weight:900}.chat{min-width:0;display:grid;grid-template-rows:64px 1fr auto;background:#050a13}.chat-head{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line)}.chat-head a{color:#fff;text-decoration:none}.messages{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.bubble{max-width:min(72%,620px);padding:10px 13px;border-radius:17px;background:var(--panel2);align-self:flex-start;line-height:1.4;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#155bc8}.bubble time{display:block;margin-top:4px;color:#d4deed;font-size:10px;text-align:right}.bubble img,.bubble video{display:block;max-width:100%;max-height:430px;border-radius:11px}.bubble audio{display:block;max-width:100%}.file{color:#fff;font-weight:850}.composer{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:end;background:#08111f}.icon,.send{border:0;border-radius:12px;min-width:45px;height:45px;background:var(--panel2);color:#fff;font-weight:900;cursor:pointer}.send{background:var(--blue);padding:0 17px}.composer textarea{height:45px;max-height:120px;resize:none;padding:11px 12px;border:1px solid #384965;border-radius:13px;background:#0c1627;color:#fff}.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}.recording{background:#c82f55!important;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}.upload-status{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:#111d31;border:1px solid var(--line);border-radius:99px;padding:8px 14px;color:#fff;font-size:12px;display:none}@media(max-width:720px){.top{height:58px}.app{height:calc(100dvh - 58px);display:block;border:0}.sidebar{height:100%}.chat{display:none;height:100%}.app.chat-open .sidebar{display:none}.app.chat-open .chat{display:grid}.chat-back{display:inline-grid!important}.bubble{max-width:86%}.composer{grid-template-columns:auto auto 1fr auto;padding-bottom:max(10px,env(safe-area-inset-bottom))}.send{padding:0 12px}.messages{padding:12px}}.chat-back{display:none;border:0;background:none;color:#fff;font-size:25px}
</style></head><body><header class="top"><a class="brand" href="/social">Vitriny <span>Chat</span></a><a class="back" href="/social">Voltar ao feed</a></header><main class="app" id="app"><aside class="sidebar"><h1>Conversas</h1><div id="conversations"><div class="empty">Carregando…</div></div></aside><section class="chat"><header class="chat-head" id="chat-head"><button class="chat-back" id="chat-back">‹</button><div>Selecione uma conversa</div></header><div class="messages" id="messages"><div class="empty">Converse com pessoas da Vitriny Social pelo perfil delas.</div></div><form class="composer" id="composer" hidden><button class="icon" type="button" id="attach" title="Enviar arquivo">＋</button><button class="icon" type="button" id="record" title="Gravar áudio">●</button><textarea name="body" maxlength="2000" placeholder="Mensagem…"></textarea><button class="send">Enviar</button><input type="file" id="file" hidden accept="image/*,video/mp4,video/webm,audio/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip"></form></section></main><div class="upload-status" id="upload-status"></div><script>
const app=document.getElementById('app'),list=document.getElementById('conversations'),messages=document.getElementById('messages'),composer=document.getElementById('composer'),statusBox=document.getElementById('upload-status');let active='',poller=null,recorder=null,chunks=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function requireLogin(){location.href='/entrar.html?returnTo='+encodeURIComponent(location.pathname+location.search)}async function api(url,options){const r=await fetch(url,options),d=await r.json();if(r.status===401){requireLogin();throw new Error('Entre na conta.')}if(!r.ok)throw new Error(d.error||'Não foi possível concluir.');return d}
async function loadConversations(){const d=await api('/api/social/chat/conversations');list.innerHTML=d.items.map(c=>`<button class="conversation ${c.id===active?'active':''}" data-id="${c.id}">${c.other.avatarUrl?`<img class="avatar" src="${esc(c.other.avatarUrl)}" alt="">`:`<span class="avatar">${esc(c.other.name.slice(0,1))}</span>`}<span><strong>${esc(c.other.name)}</strong><small>@${esc(c.other.handle)} · ${esc(c.lastMessage)}</small></span>${c.unread?`<b class="unread">${c.unread}</b>`:''}</button>`).join('')||'<div class="empty">Nenhuma conversa ainda.<br>Abra um perfil e toque em Mensagem.</div>'}
async function openConversation(id){active=id;app.classList.add('chat-open');composer.hidden=false;const d=await api('/api/social/chat/conversations/'+encodeURIComponent(id)+'/messages');const o=d.conversation.other;document.getElementById('chat-head').innerHTML=`<button class="chat-back" id="chat-back">‹</button>${o.avatar_url?`<img class="avatar" src="${esc(o.avatar_url)}" alt="">`:`<span class="avatar">${esc(o.name.slice(0,1))}</span>`}<a href="/perfil/${encodeURIComponent(o.handle)}"><strong>${esc(o.name)}</strong><small style="display:block;color:var(--muted)">@${esc(o.handle)}</small></a>`;document.getElementById('chat-back').onclick=()=>app.classList.remove('chat-open');renderMessages(d.items);await loadConversations();clearInterval(poller);poller=setInterval(()=>refreshMessages(),3000)}
function media(m){if(m.kind==='image')return `<a href="${m.fileUrl}" target="_blank"><img src="${m.fileUrl}" alt="${esc(m.fileName)}"></a>`;if(m.kind==='video')return `<video src="${m.fileUrl}" controls playsinline></video>`;if(m.kind==='audio')return `<audio src="${m.fileUrl}" controls></audio>`;if(m.kind==='file')return `<a class="file" href="${m.fileUrl}" download>📎 ${esc(m.fileName)}</a>`;return esc(m.body)}function renderMessages(items){messages.innerHTML=items.map(m=>`<div class="bubble ${m.mine?'mine':''}">${media(m)}<time>${new Date(m.createdAt+'Z').toLocaleString('pt-BR',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}</time></div>`).join('')||'<div class="empty">Envie a primeira mensagem.</div>';messages.scrollTop=messages.scrollHeight}async function refreshMessages(){if(!active)return;try{const d=await api('/api/social/chat/conversations/'+encodeURIComponent(active)+'/messages');const nearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<100;renderMessages(d.items);if(!nearBottom)messages.scrollTop=Math.max(0,messages.scrollHeight-messages.clientHeight-110)}catch{}}
list.onclick=e=>{const b=e.target.closest('.conversation');if(b)openConversation(b.dataset.id)};composer.onsubmit=async e=>{e.preventDefault();const input=e.currentTarget.body,body=input.value.trim();if(!body||!active)return;input.value='';await api('/api/social/chat/conversations/'+encodeURIComponent(active)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});refreshMessages();loadConversations()};
function showStatus(text){statusBox.textContent=text;statusBox.style.display='block';clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>statusBox.style.display='none',2500)}async function sendFile(file,name=file.name){if(!active||!file)return;if(file.size>25*1024*1024)return showStatus('O arquivo ultrapassa 25 MB.');showStatus('Enviando…');const r=await fetch('/api/social/chat/conversations/'+encodeURIComponent(active)+'/files',{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','X-File-Name':encodeURIComponent(name)},body:file}),d=await r.json();if(r.status===401)return requireLogin();if(!r.ok)return showStatus(d.error||'Falha no envio.');showStatus('Enviado!');refreshMessages();loadConversations()}document.getElementById('attach').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{sendFile(e.target.files[0]);e.target.value=''};
document.getElementById('record').onclick=async e=>{const button=e.currentTarget;if(recorder&&recorder.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=x=>{if(x.data.size)chunks.push(x.data)};recorder.onstop=()=>{button.classList.remove('recording');stream.getTracks().forEach(t=>t.stop());const type=recorder.mimeType||'audio/webm';sendFile(new Blob(chunks,{type}),'audio-'+Date.now()+'.webm')};recorder.start();button.classList.add('recording');showStatus('Gravando… toque novamente para enviar.')}catch{showStatus('Permita o acesso ao microfone.')}};
async function start(){const handle=new URLSearchParams(location.search).get('usuario');if(handle){const c=await api('/api/social/chat/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle})});await loadConversations();await openConversation(c.id)}else await loadConversations()}document.getElementById('chat-back').onclick=()=>app.classList.remove('chat-open');start().catch(error=>{if(error.message!=='Entre na conta.')list.innerHTML='<div class="empty">Não foi possível carregar as conversas agora.</div>'});
</script></body></html>
