<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suas preferências · VitrineCity</title><link rel="stylesheet" href="/vitriny-member.css"></head><body><header><a href="/minha-conta.html">← Minha conta</a><span>VITRINECITY</span></header><main class="preference-page"><h1>Novidades do<br><em>seu jeito.</em></h1><p>Escolha se deseja receber campanhas e promoções da VitrineCity. Seu acesso à cidade e aos jogos continua disponível mesmo com os dois canais desmarcados.</p><form id="preferences" class="card"><label class="check"><input name="email" type="checkbox" disabled><span>Quero receber campanhas e promoções por e-mail.</span></label><label class="check"><input name="whatsapp" type="checkbox" disabled><span>Quero receber campanhas e promoções por WhatsApp.</span></label><p id="phoneHint" class="hint"></p><button class="primary" type="submit" disabled>Salvar preferências</button><p id="memberMessage" role="status" aria-live="polite">Carregando suas escolhas…</p></form><nav><a href="/vitriny-multiverse-worlds.html">Conhecer cidades</a><a href="/privacy.html">Privacidade</a></nav></main><script type="module">
const form=document.getElementById('preferences'),message=document.getElementById('memberMessage');let saving=false;
async function api(options){const response=await fetch('/api/privacy/communications',options);if(response.status===401){location.assign('/entrar.html?returnTo=%2Fpreferencias-comunicacao.html');throw Error('Entre na sua conta para continuar.');}const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível salvar suas escolhas.');return data;}
try{const data=await api();form.elements.email.checked=data.preferences.email;form.elements.whatsapp.checked=data.preferences.whatsapp;form.elements.email.disabled=false;form.elements.whatsapp.disabled=!data.hasWhatsapp;form.querySelector('button').disabled=false;document.getElementById('phoneHint').textContent=data.hasWhatsapp?'Para cancelar um canal, desmarque a opção e salve.':'Para autorizar o WhatsApp, cadastre seu número em Minha conta.';message.textContent='Suas preferências atuais estão acima.';}catch(error){message.textContent=error.message;}
form.addEventListener('submit',async event=>{event.preventDefault();if(saving)return;saving=true;const button=form.querySelector('button');button.disabled=true;try{await api({method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.elements.email.checked,whatsapp:form.elements.whatsapp.checked})});message.textContent='Preferências salvas. Você pode alterá-las quando quiser.';}catch(error){message.textContent=error.message;}finally{saving=false;button.disabled=false;}});
</script></body></html>
