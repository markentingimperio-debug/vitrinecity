<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buscar na VitrineCity</title>
  <style>
    :root{--navy:#071f4b;--blue:#1768e6;--bg:#f4f9ff;--line:#d8e7f7;--muted:#5b7192}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,6vw);gap:24px}.brand{font-size:25px;font-weight:900;text-decoration:none}.account{margin-left:auto;color:var(--blue);font-weight:800;text-decoration:none}main{max-width:1050px;margin:auto;padding:48px 20px}.intro{text-align:center}.intro h1{font-size:clamp(34px,5vw,54px);margin:0 0 10px}.intro p{color:var(--muted)}.search{position:relative;max-width:760px;margin:26px auto}.row{display:flex;background:#fff;border:2px solid #b9d5f7;border-radius:18px;overflow:hidden;box-shadow:0 18px 45px #1768e61a}.row input{border:0;outline:0;padding:18px;width:100%;font-size:18px}.row button{border:0;background:var(--blue);color:#fff;padding:0 25px;font-weight:900;cursor:pointer}.suggestions{position:absolute;top:64px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 45px #071f4b24;overflow:hidden;z-index:5}.suggestions:empty{display:none}.suggestions button{width:100%;border:0;border-bottom:1px solid #edf3fa;background:#fff;text-align:left;padding:13px 16px;cursor:pointer}.suggestions button:hover{background:#f0f6ff}.suggestions small{display:block;color:var(--muted);margin-top:3px}.section{margin-top:38px}.section h2{font-size:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card img{width:100%;height:145px;object-fit:cover;border-radius:12px;background:#e8f0fa}.card h3{margin:13px 0 7px}.card p{color:var(--muted);line-height:1.45}.card a{color:var(--blue);font-weight:850}.sponsored{border:2px solid #f0c247;background:linear-gradient(145deg,#fffdf5,#fff)}.sponsored-tag{display:inline-block;background:#fff2bd;color:#755400;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:900;letter-spacing:.04em}.empty{text-align:center;color:var(--muted);padding:45px;background:#fff;border-radius:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.row button{padding:0 16px}}
  </style>
</head>
<body>
  <header><a class="brand" href="/">▣ VitrineCity</a><a class="account" href="/minha-conta.html">Minha conta e endereços</a></header>
  <main><section class="intro"><h1>O que você procura?</h1><p>Encontre lojas, produtos e serviços dentro da cidade digital.</p><form class="search" id="search-form"><div class="row"><input id="q" autocomplete="off" maxlength="80" placeholder="Ex.: carro, adubo, moda, oficina"><button>Buscar</button></div><div class="suggestions" id="suggestions"></div></form></section><div id="results"></div></main>
  <script>
    const q=document.getElementById('q'),suggestions=document.getElementById('suggestions'),results=document.getElementById('results');let timer;
    const STORE_FALLBACK='/assets/vitriny-city-base.jpg',PRODUCT_FALLBACK='/assets/store-seed/utilidades.svg';
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const image=(src,fallback,alt)=>`<img src="${esc(src||fallback)}" data-fallback="${fallback}" alt="${esc(alt)}">`;
    document.addEventListener('error',event=>{const img=event.target;if(!(img instanceof HTMLImageElement)||!img.dataset.fallback||img.dataset.fallbackApplied)return;img.dataset.fallbackApplied='1';img.src=img.dataset.fallback},true);
    function choose(value){q.value=value;suggestions.innerHTML='';search(value)}
    q.addEventListener('input',()=>{clearTimeout(timer);const value=q.value.trim();if(value.length<2){suggestions.innerHTML='';return}timer=setTimeout(async()=>{const response=await fetch('/api/search/suggestions?q='+encodeURIComponent(value)),data=await response.json();suggestions.innerHTML=data.suggestions.map(item=>`<button type="button" data-label="${esc(item.label)}"><b>${esc(item.label)}</b><small>${item.type==='store'?'Loja':'Produto'}${item.category?' · '+esc(item.category):''}</small></button>`).join('');suggestions.querySelectorAll('button').forEach(button=>button.onclick=()=>choose(button.dataset.label))},220)});
    document.getElementById('search-form').onsubmit=event=>{event.preventDefault();search(q.value)};
    async function search(value){
      value=value.trim();if(value.length<2)return;history.replaceState(null,'','?q='+encodeURIComponent(value));results.innerHTML='<p class="empty">Buscando…</p>';
      try{
        const [organicResponse,adsResponse]=await Promise.all([fetch('/api/search?q='+encodeURIComponent(value)),fetch('/api/ads/serve?q='+encodeURIComponent(value))]);
        const [data,adData]=await Promise.all([organicResponse.json(),adsResponse.json()]);
        const sponsored=(adData.ads||[]).map(item=>`<article class="card sponsored"><span class="sponsored-tag">PATROCINADO</span>${item.imageUrl?`<img src="${esc(item.imageUrl)}" alt="" style="margin-top:12px">`:''}<h3>${esc(item.title)}</h3><p>${esc(item.text)}</p><a href="${esc(item.clickUrl)}" rel="nofollow sponsored">Ver oferta</a></article>`).join('');
        const stores=data.stores.map(item=>`<article class="card">${image(item.facadeUrl||item.logoUrl,STORE_FALLBACK,'Fachada de '+item.name)}<h3>${esc(item.name)}</h3><p>${esc(item.description||item.segment||'Loja da VitrineCity')}</p><a href="${item.websiteUrl?esc(item.websiteUrl):'/cidade?lote='+encodeURIComponent(item.lotCode||'')}">Visitar loja</a></article>`).join('');
        const products=data.products.map(item=>`<article class="card">${image(item.imageUrl,PRODUCT_FALLBACK,item.name)}<h3>${esc(item.name)}</h3><p>${esc(item.storeName)}${item.priceCents!=null?' · '+(item.priceCents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):''}</p><a href="${esc(item.productUrl||'#')}">Ver produto</a></article>`).join('');
        results.innerHTML=(sponsored?`<section class="section"><h2>Ofertas em destaque</h2><div class="grid">${sponsored}</div></section>`:'')+(stores?`<section class="section"><h2>Lojas</h2><div class="grid">${stores}</div></section>`:'')+(products?`<section class="section"><h2>Produtos</h2><div class="grid">${products}</div></section>`:'')||'<p class="empty">Nenhum resultado encontrado. Tente outra palavra.</p>';
      }catch(_){results.innerHTML='<p class="empty">Não foi possível concluir a busca agora. Tente novamente.</p>'}
    }
    const initial=new URLSearchParams(location.search).get('q');if(initial){q.value=initial;search(initial)}
  </script>
</body>
</html>
