<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderação — Vitriny Social</title>
<style>:root{--blue:#1768e6;--bg:#07101d;--panel:#101a2d;--line:#2b3952;--text:#f5f8ff;--muted:#aebbd0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}header{padding:18px max(18px,5vw);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}a{color:#9bc1ff}.wrap{width:min(1120px,92%);margin:28px auto}.head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:20px}h1{margin:0 0 6px}.muted{color:var(--muted)}button,input{font:inherit}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:10px 13px;font-weight:900;cursor:pointer}.reject{background:#b62d47}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}.video{aspect-ratio:9/16;max-height:430px;background:#03070d}.video iframe{width:100%;height:100%;border:0}.info{padding:14px}.info h2{font-size:16px;margin:0 0 6px}.badge{display:inline-block;border-radius:99px;background:#594719;color:#ffe28c;padding:5px 8px;font-size:11px;font-weight:900}.stats{font-size:12px;color:var(--muted);margin:9px 0}.note{width:100%;border:1px solid var(--line);background:#07101d;color:white;border-radius:9px;padding:10px;margin:8px 0}.actions{display:flex;gap:8px}.empty{padding:50px;text-align:center;border:1px dashed var(--line);border-radius:16px}</style></head>
<body><header><strong>Vitriny Social · Moderação</strong><nav><a href="/admin.html">Voltar ao painel</a> · <a href="/social.html">Ver feed</a></nav></header><main class="wrap"><div class="head"><div><h1>Vídeos aguardando análise</h1><div class="muted">Aprove somente conteúdo seguro e autorizado. Pornografia, nudez sexual e violência gráfica devem ser rejeitadas.</div></div><button class="btn" id="refresh">Atualizar</button></div><div id="message" class="muted"></div><section class="grid" id="queue"></section></main>
<script>const q=document.getElementById('queue'),msg=document.getElementById('message');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,o){const r=await fetch(url,o),d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/carteira.html?admin=1';throw Error('Acesso administrativo necessário.')}if(!r.ok)throw Error(d.error||'Falha na operação.');return d}function card(p){return `<article class="card" data-id="${p.id}"><div class="video"><iframe src="https://iframe.videodelivery.net/${encodeURIComponent(p.video_uid)}?muted=true&controls=true" allow="encrypted-media;picture-in-picture" allowfullscreen></iframe></div><div class="info"><span class="badge">${esc(p.moderation_status)}</span><h2>${esc(p.name)} · ${esc(p.email)}</h2><p>${esc(p.caption||'Sem legenda')}</p><div class="stats">Categoria: ${esc(p.category)} · Cidade: ${esc(p.city||'—')} · Denúncias: ${Number(p.reports||0)}${p.cta_url?`<br>Link comercial: <a href="${esc(p.cta_url)}" target="_blank" rel="noopener">ver destino</a> · ${Number(p.cta_charge_units||0)/100} moedas`:''}${p.moderation_reason?`<br>Alerta automático: ${esc(p.moderation_reason)}`:''}</div><input class="note" maxlength="500" placeholder="Motivo ou observação"><div class="actions"><button class="btn approve">Aprovar</button><button class="btn reject">Rejeitar e bloquear</button></div></div></article>`}async function load(){msg.textContent='Carregando...';try{const d=await api('/api/admin/social/moderation');q.innerHTML=d.items?.map(card).join('')||'<div class="empty">Nenhum vídeo aguardando análise.</div>';msg.textContent=`${d.items?.length||0} vídeo(s) na fila.`}catch(e){msg.textContent=e.message}}q.onclick=async e=>{const b=e.target.closest('.approve,.reject');if(!b)return;const c=b.closest('.card'),action=b.classList.contains('approve')?'approve':'reject',note=c.querySelector('.note').value.trim();if(action==='reject'&&!note){alert('Informe o motivo da rejeição.');return}b.disabled=true;try{await api('/api/admin/social/posts/'+c.dataset.id+'/moderation',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,note})});c.remove();msg.textContent='Decisão salva.'}catch(err){alert(err.message);b.disabled=false}};document.getElementById('refresh').onclick=load;load();</script></body></html>
