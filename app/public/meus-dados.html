<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privacidade e meus dados — VitrineCity</title><meta name="robots" content="noindex,nofollow">
<style>body{max-width:760px;margin:40px auto;padding:0 20px;font:16px/1.55 Arial;color:#102b60;background:#f4f9ff}main{background:#fff;padding:28px;border:1px solid #d8e7f7;border-radius:20px}label{display:block;font-weight:700;margin:14px 0 6px}select,textarea{width:100%;padding:12px;border:1px solid #bfd2e8;border-radius:10px;font:inherit}textarea{min-height:110px}button,.button{display:inline-block;margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:#1768e6;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.item{margin-top:12px;padding:13px;border:1px solid #d8e7f7;border-radius:12px}.muted{color:#5b7192}.error{color:#a51f1f}</style><script src="/openai-ads.js" defer></script></head>
<body><main><a href="/minha-conta.html">← Minha conta</a><h1>Privacidade e meus dados</h1><p>Baixe uma cópia dos dados ligados à sua conta ou exerça seus direitos de acesso, correção, portabilidade, exclusão e revogação de consentimento.</p><a class="button" href="/api/privacy/export">Baixar meus dados</a><form id="form"><label for="type">Direito que deseja exercer</label><select id="type" name="requestType"><option value="access">Acesso aos dados</option><option value="correction">Correção</option><option value="portability">Portabilidade</option><option value="deletion">Exclusão</option><option value="consent_revocation">Revogar consentimento de comunicações</option></select><label for="details">Detalhes</label><textarea id="details" name="details" maxlength="1000" placeholder="Explique o pedido quando necessário."></textarea><button>Enviar solicitação</button><p id="message" class="muted"></p></form><h2>Consentimentos registrados</h2><div id="consents" class="muted">Carregando…</div><h2>Protocolos</h2><div id="items" class="muted">Carregando…</div></main><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options){const r=await fetch(url,options);if(r.status===401){location.href='/entrar.html?returnTo='+encodeURIComponent(location.pathname);throw Error('Acesso necessário.')}const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível concluir.');return d}
async function load(){const [d,c]=await Promise.all([api('/api/privacy/requests'),api('/api/privacy/consents')]);document.getElementById('items').innerHTML=d.items.length?d.items.map(i=>`<div class="item"><b>${esc(i.protocol)}</b><br><span>${esc(i.requestType)} · ${esc(i.status)} · ${new Date(i.createdAt+'Z').toLocaleDateString('pt-BR')}</span></div>`).join(''):'Nenhuma solicitação.';document.getElementById('consents').innerHTML=c.items.length?c.items.map(i=>`<div class="item"><b>${esc(i.purpose)}</b><br><span>${i.granted?'Aceito':'Revogado'} · versão ${esc(i.documentVersion)} · ${new Date(i.createdAt+'Z').toLocaleString('pt-BR')}</span></div>`).join(''):'Nenhum consentimento registrado.'}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const message=document.getElementById('message'),body=Object.fromEntries(new FormData(e.target));try{const d=await api('/api/privacy/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(body.requestType==='consent_revocation')localStorage.removeItem('vc_analytics_consent');message.className='muted';message.textContent='Solicitação registrada: '+d.protocol;e.target.reset();load()}catch(error){message.className='error';message.textContent=error.message}};load();
</script></body></html>
