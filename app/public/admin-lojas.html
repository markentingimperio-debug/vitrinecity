<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de lojas — VitrineCity</title><style>
:root{--navy:#071f4b;--blue:#1768e6;--green:#188459;--orange:#b26a15;--line:#d8e6f7;--muted:#607393;--bg:#f2f7fd}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}header{padding:20px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:38px}.toolbar{display:flex;gap:10px;margin-bottom:18px}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:11px;border:1px solid #bfd3ec;border-radius:10px;background:#fff}textarea{min-height:105px;resize:vertical}button{padding:10px 13px;border-radius:10px;border:0;cursor:pointer;background:var(--blue);color:#fff;font-weight:850}.grid{display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:170px 1fr auto;gap:20px}.images{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}.images img{width:100%;height:82px;object-fit:cover;border-radius:9px;background:#edf3f9}.meta p{color:var(--muted);line-height:1.5}.links a{margin-right:10px}.status{display:inline-block;padding:6px 9px;border-radius:99px;background:#e6f1ff;font-weight:850}.actions{display:flex;flex-direction:column;gap:8px;min-width:140px}.actions .publish{background:var(--green)}.actions .changes{background:var(--orange)}.actions .edit{background:#6546c7}.empty{background:#fff;padding:30px;border-radius:16px;text-align:center}.modal{position:fixed;z-index:50;inset:0;background:#06142bdc;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(920px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px;padding:25px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.dialog-head h2{margin:0}.close{background:#eef3fa;color:var(--navy);font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.field{display:grid;gap:6px;font-size:13px;font-weight:850}.wide{grid-column:1/-1}.uploads{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.upload{padding:10px;border:1px dashed #9eb6d5;border-radius:12px}.upload img{width:100%;height:95px;object-fit:cover;background:#edf3f9;border-radius:8px;margin:7px 0}.remove{display:flex;gap:6px;align-items:center;font-weight:500;font-size:11px}.remove input,.checks input{width:auto}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{display:flex;gap:6px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:9px;font-weight:500}.save-row{display:flex;align-items:center;gap:13px}.message{font-weight:800}.ok{color:var(--green)}@media(max-width:800px){.card{grid-template-columns:1fr}.actions{flex-direction:row;flex-wrap:wrap}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.uploads{grid-template-columns:1fr 1fr}}@media(max-width:480px){.uploads{grid-template-columns:1fr}}
</style></head><body><header><strong>VitrineCity · Gestão de lojas</strong><a href="/admin.html">← Painel de gestão</a></header><main><h1>Aprovação, edição e publicação</h1><div class="toolbar"><select id="filter"><option value="">Todas</option><option value="pending">Pendentes</option><option value="approved">Aprovadas</option><option value="changes_requested">Aguardando ajustes</option><option value="published">Publicadas</option></select><button id="reload">Atualizar</button></div><div class="grid" id="list"></div></main>
<div class="modal" id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title"><form class="dialog" id="edit-form"><div class="dialog-head"><div><h2 id="editor-title">Editar loja</h2><small id="editor-ref"></small></div><button class="close" type="button" aria-label="Fechar">×</button></div><div class="form-grid"><label class="field">Nome da loja<input id="businessName" required maxlength="100"></label><label class="field">WhatsApp<input id="whatsapp" maxlength="30"></label><label class="field wide">Descrição<textarea id="description" required minlength="20" maxlength="1200"></textarea></label><div class="wide uploads" id="uploads"></div><label class="field wide">Vídeo da loja<input id="videoUrl" type="url" placeholder="YouTube, Vimeo, Instagram, TikTok ou arquivo MP4 público"><small>Vídeos do YouTube/Vimeo aparecem incorporados. Outros links abrem em uma nova página.</small></label><label class="field">Site<input id="websiteUrl" type="url" placeholder="https://..."></label><label class="field">Instagram<input id="instagramUrl" type="url" placeholder="https://instagram.com/..."></label><label class="field">TikTok<input id="tiktokUrl" type="url" placeholder="https://tiktok.com/@..."></label><label class="field">Google Maps<input id="googleMapsUrl" type="url" placeholder="https://maps.app.goo.gl/..."></label><label class="field wide">Endereço<input id="address" maxlength="240"></label><label class="field">Cidade<input id="city" maxlength="100"></label><label class="field">UF<input id="state" maxlength="2"></label><label class="field">CEP<input id="postalCode" maxlength="9"></label><label class="field">Letreiro promocional<input id="promotionText" maxlength="120"></label><label class="field wide">Informações de localização<textarea id="locationNotes" maxlength="500"></textarea></label><div class="wide checks"><label><input id="wantsWebsite" type="checkbox"> Solicita site/landing page</label><label><input id="wantsBrandArt" type="checkbox"> Solicita logo/fachada</label><label><input id="wantsGoogleProfile" type="checkbox"> Solicita Google/Maps</label></div><label class="field wide">Anotações administrativas<textarea id="adminNotes" maxlength="1200"></textarea></label><div class="wide save-row"><button type="submit">Salvar alterações</button><span class="message" id="edit-message" role="status"></span></div></div></form></div>
<script>
const list=document.getElementById('list'),editor=document.getElementById('editor'),form=document.getElementById('edit-form'),msg=document.getElementById('edit-message'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let submissions=[],current=null;
const textFields=['businessName','description','whatsapp','websiteUrl','instagramUrl','tiktokUrl','googleMapsUrl','videoUrl','address','city','state','postalCode','promotionText','locationNotes','adminNotes'],checkFields=['wantsWebsite','wantsBrandArt','wantsGoogleProfile'],media=[['logo','Logo','logo_url'],['facade','Fachada','facade_url'],['gallery1','Foto 1','gallery_1_url'],['gallery2','Foto 2','gallery_2_url'],['gallery3','Foto 3','gallery_3_url']];
async function api(url,options){const r=await fetch(url,options);if(r.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-lojas.html';throw Error('Entre como administrador.')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Falha na operação.');return d}
function render(){list.innerHTML=submissions.length?submissions.map(x=>`<article class="card"><div class="images">${[x.logo_url,x.facade_url,x.gallery_1_url,x.gallery_2_url,x.gallery_3_url].filter(Boolean).map((url,i)=>`<a href="${esc(url)}" target="_blank"><img src="${esc(url)}" alt="Imagem ${i+1} da loja"></a>`).join('')||'<img alt="Sem imagens">'}</div><div class="meta"><span class="status">${esc(x.review_status)}</span><h2>${esc(x.business_name)}</h2><p>${esc(x.description||'Sem descrição')}</p><p><b>${esc(x.lot_code)}</b> · ${esc(x.customer_name)} · ${esc(x.email)} · ${esc(x.whatsapp||'')}</p><p><b>Local:</b> ${esc([x.address,x.city,x.state,x.postal_code].filter(Boolean).join(' · ')||'Não informado')}</p><div class="links">${[['Site',x.website_url],['Instagram',x.instagram_url],['TikTok',x.tiktok_url],['Vídeo',x.video_url],['Maps',x.google_maps_url]].filter(a=>a[1]).map(a=>`<a href="${esc(a[1])}" target="_blank" rel="noopener">${a[0]}</a>`).join('')}</div><p><b>Letreiro:</b> ${esc(x.promotion_text||'—')}<br><b>Serviços:</b> ${x.wants_website?'Site · ':''}${x.wants_brand_art?'Logo/fachada · ':''}${x.wants_google_profile?'Google/Maps':''}</p></div><div class="actions"><button class="edit" data-edit="${esc(x.order_reference)}">Editar loja</button><button data-action="approve" data-ref="${esc(x.order_reference)}">Aprovar</button><button class="changes" data-action="request_changes" data-ref="${esc(x.order_reference)}">Pedir ajustes</button><button class="publish" data-action="publish" data-ref="${esc(x.order_reference)}">Publicar</button></div></article>`).join(''):'<div class="empty">Nenhuma loja encontrada.</div>'}
async function load(){list.innerHTML='<div class="empty">Carregando...</div>';try{const status=document.getElementById('filter').value,d=await api('/api/admin/store-submissions'+(status?'?status='+encodeURIComponent(status):''));submissions=d.submissions;render()}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function openEditor(ref){current=submissions.find(x=>x.order_reference===ref);if(!current)return;document.getElementById('editor-ref').textContent=current.order_reference;for(const id of textFields){const key={businessName:'business_name',websiteUrl:'website_url',instagramUrl:'instagram_url',tiktokUrl:'tiktok_url',googleMapsUrl:'google_maps_url',videoUrl:'video_url',postalCode:'postal_code',promotionText:'promotion_text',locationNotes:'location_notes',adminNotes:'admin_notes'}[id]||id;document.getElementById(id).value=current[key]||''}for(const id of checkFields){const key={wantsWebsite:'wants_website',wantsBrandArt:'wants_brand_art',wantsGoogleProfile:'wants_google_profile'}[id];document.getElementById(id).checked=!!current[key]}document.getElementById('uploads').innerHTML=media.map(([id,label,key])=>`<div class="upload"><b>${label}</b><img id="${id}Preview" src="${esc(current[key]||'')}" alt="${label}"><input id="${id}" type="file" accept="image/png,image/jpeg,image/webp"><label class="remove"><input id="remove${id[0].toUpperCase()+id.slice(1)}" type="checkbox"> Remover atual</label></div>`).join('');for(const [id] of media)document.getElementById(id).onchange=()=>previewFile(id);msg.textContent='';msg.className='message';editor.classList.add('open');document.body.style.overflow='hidden'}
async function imageData(id){const input=document.getElementById(id),file=input.files[0];if(!file)return '';if(file.size>8e6)throw Error('Cada imagem deve ter no máximo 8 MB.');const bitmap=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/webp',.82)}
async function previewFile(id){try{document.getElementById(id+'Preview').src=await imageData(id)}catch(e){msg.textContent=e.message}}
function closeEditor(){editor.classList.remove('open');document.body.style.overflow=''}document.querySelector('.close').onclick=closeEditor;editor.addEventListener('click',e=>{if(e.target===editor)closeEditor()});
form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button[type="submit"]');button.disabled=true;msg.textContent='Salvando imagens e dados...';try{const body={};for(const id of textFields)body[id]=document.getElementById(id).value.trim();for(const id of checkFields)body[id]=document.getElementById(id).checked;for(const [id] of media){body[id]=await imageData(id);body['remove'+id[0].toUpperCase()+id.slice(1)]=document.getElementById('remove'+id[0].toUpperCase()+id.slice(1)).checked}const d=await api('/api/admin/store-submissions/'+encodeURIComponent(current.order_reference)+'/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const index=submissions.findIndex(x=>x.order_reference===current.order_reference);submissions[index]=d.submission;current=d.submission;render();msg.className='message ok';msg.textContent='Loja atualizada. Agora você pode aprovar ou publicar.'}catch(error){msg.className='message';msg.textContent=error.message}finally{button.disabled=false}});
async function decide(ref,action){const notes=prompt(action==='request_changes'?'Informe claramente o que deve ser corrigido:':'Observação opcional:','');if(notes===null)return;try{await api('/api/admin/store-submissions/'+encodeURIComponent(ref),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,notes})});await load()}catch(e){alert(e.message)}}
list.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]');if(edit)return openEditor(edit.dataset.edit);const action=e.target.closest('[data-action]');if(action)decide(action.dataset.ref,action.dataset.action)});document.getElementById('reload').onclick=load;document.getElementById('filter').onchange=load;load();
</script></body></html>
