<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovação de lojas — VitrineCity</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f2f7fd;color:#09275d}header{padding:20px 5%;background:#071f4b;color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:38px}.toolbar{display:flex;gap:10px;margin-bottom:18px}select,button{padding:10px 13px;border-radius:10px;border:1px solid #ccdcef;font:inherit}button{cursor:pointer;background:#1768e6;color:#fff;font-weight:800}.grid{display:grid;gap:16px}.card{background:#fff;border:1px solid #d8e6f7;border-radius:18px;padding:20px;display:grid;grid-template-columns:150px 1fr auto;gap:20px}.images{display:grid;gap:8px}.images img{width:150px;height:95px;object-fit:cover;border-radius:10px;background:#edf3f9}.meta p{color:#607393;line-height:1.5}.links a{margin-right:10px}.status{display:inline-block;padding:6px 9px;border-radius:99px;background:#e6f1ff;font-weight:850}.actions{display:flex;flex-direction:column;gap:8px}.actions .publish{background:#188459}.actions .changes{background:#b26a15}.empty{background:#fff;padding:30px;border-radius:16px;text-align:center}@media(max-width:760px){.card{grid-template-columns:1fr}.images{grid-template-columns:1fr 1fr}.images img{width:100%}.actions{flex-direction:row;flex-wrap:wrap}}</style></head><body><header><strong>VitrineCity · Gestão de lojas</strong><a href="/admin.html">← Painel de gestão</a></header><main><h1>Aprovação e publicação</h1><div class="toolbar"><select id="filter"><option value="">Todas</option><option value="pending">Pendentes</option><option value="approved">Aprovadas</option><option value="changes_requested">Aguardando ajustes</option><option value="published">Publicadas</option></select><button id="reload">Atualizar</button></div><div class="grid" id="list"></div></main><script>
const list=document.getElementById('list'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,options){const r=await fetch(url,options);if(r.status===401){location.href='/carteira.html?admin=1';throw Error('Entre como administrador.')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Falha na operação.');return d}async function load(){list.innerHTML='<div class="empty">Carregando...</div>';try{const status=document.getElementById('filter').value,d=await api('/api/admin/store-submissions'+(status?'?status='+encodeURIComponent(status):''));list.innerHTML=d.submissions.length?d.submissions.map(x=>`<article class="card"><div class="images">${x.logo_url?`<a href="${esc(x.logo_url)}" target="_blank"><img src="${esc(x.logo_url)}" alt="Logo"></a>`:'<img alt="Sem logo">'}${x.facade_url?`<a href="${esc(x.facade_url)}" target="_blank"><img src="${esc(x.facade_url)}" alt="Fachada"></a>`:'<img alt="Sem fachada">'}</div><div class="meta"><span class="status">${esc(x.review_status)}</span><h2>${esc(x.business_name)}</h2><p>${esc(x.description||'Sem descrição')}</p><p><b>${esc(x.lot_code)}</b> · ${esc(x.customer_name)} · ${esc(x.email)} · ${esc(x.whatsapp||'')}</p><div class="links">${[['Site',x.website_url],['Instagram',x.instagram_url],['TikTok',x.tiktok_url],['Maps',x.google_maps_url]].filter(a=>a[1]).map(a=>`<a href="${esc(a[1])}" target="_blank" rel="noopener">${a[0]}</a>`).join('')}</div><p><b>Letreiro:</b> ${esc(x.promotion_text||'—')}<br><b>Serviços:</b> ${x.wants_website?'Criação de site · ':''}${x.wants_brand_art?'Logo/arte de fachada':''}</p>${x.admin_notes?`<p><b>Observação anterior:</b> ${esc(x.admin_notes)}</p>`:''}</div><div class="actions"><button onclick="decide('${esc(x.order_reference)}','approve')">Aprovar</button><button class="changes" onclick="decide('${esc(x.order_reference)}','request_changes')">Pedir ajustes</button><button class="publish" onclick="decide('${esc(x.order_reference)}','publish')">Publicar</button></div></article>`).join(''):'<div class="empty">Nenhuma loja encontrada.</div>'}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function decide(ref,action){const notes=prompt(action==='request_changes'?'Informe claramente o que deve ser corrigido:':'Observação opcional:','');if(notes===null)return;try{await api('/api/admin/store-submissions/'+encodeURIComponent(ref),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,notes})});load()}catch(e){alert(e.message)}}document.getElementById('reload').onclick=load;document.getElementById('filter').onchange=load;load();
</script></body></html>
