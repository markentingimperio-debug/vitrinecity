<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Integrações | VitrineCity</title><style>:root{--navy:#071f4b;--blue:#1768e6;--line:#d8e5f4;--muted:#617590}*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:var(--navy);font:15px/1.5 system-ui}header{padding:18px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{max-width:1050px;margin:32px auto;padding:0 20px}.summary,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}.head{display:flex;justify-content:space-between;gap:12px}.badge{height:max-content;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900}.ok{background:#def6e9;color:#11653d}.pending{background:#fff1d3;color:#805600}.missing{color:var(--muted);min-height:45px}code{display:block;overflow-wrap:anywhere;background:#f2f6fb;padding:8px;border-radius:8px}.button{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:800}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><script src="/openai-ads.js" defer></script></head><body><header><b>Prontidão das integrações</b><a href="/admin">← Painel</a></header><main><section class="summary"><h1>Conexões oficiais</h1><p id="summary">Consultando configurações…</p><p>Este painel mostra apenas a presença das configurações. Nenhum segredo ou token é exibido.</p></section><section id="items" class="grid"></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/admin/integrations/readiness');if(r.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-integracoes.html';return}const d=await r.json();document.querySelector('#summary').textContent=`${d.ready} de ${d.total} integrações prontas.`;document.querySelector('#items').innerHTML=d.integrations.map(x=>`<article class="card"><div class="head"><h2>${esc(x.name)}</h2><span class="badge ${x.ready?'ok':'pending'}">${x.ready?'PRONTA':'PENDENTE'}</span></div><p class="missing">${x.missing.length?'Falta: '+x.missing.map(esc).join(' · '):'Configuração disponível.'}</p>${x.callback?`<small>Endereço de retorno</small><code>${esc(x.callback)}</code>`:''}${x.action&&!x.ready?`<p><a class="button" href="${esc(x.action)}">Conectar</a></p>`:''}</article>`).join('')}load();</script></body></html>
