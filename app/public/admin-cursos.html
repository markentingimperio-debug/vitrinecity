<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursos | VitrineCity Administração</title><style>
:root{--navy:#07162e;--panel:#101f39;--line:#263a59;--text:#f6f8fc;--muted:#a8b7ce;--blue:#3987ff;--green:#28b77a}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:#9ac4ff;text-decoration:none}header{padding:18px max(20px,3vw);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.wrap{width:min(1220px,94%);margin:28px auto 70px}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}h1{margin:4px 0;font-size:clamp(28px,4vw,44px)}p{color:var(--muted)}button,input,textarea,select{font:inherit}.btn{display:inline-flex;border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.secondary{background:#233653}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.cover{height:145px;background:linear-gradient(135deg,#17478c,#431f86);display:grid;place-items:center;font-size:50px;background-size:cover;background-position:center}.body{padding:19px}.card h2{margin:0 0 8px;font-size:19px}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.pill{padding:6px 9px;border-radius:999px;background:#1b3152;font-size:12px}.status{color:#86efbd;font-weight:900;text-transform:uppercase;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#020814dd;display:none;place-items:center;padding:20px;overflow:auto}.modal.open{display:grid}.form{width:min(780px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#08152a;color:#fff;border-radius:10px;padding:11px}textarea{min-height:90px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.msg{min-height:24px;color:#ffbdc6}.students{margin-top:22px;overflow:auto}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}@media(max-width:650px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:start;flex-direction:column}}</style><script src="/openai-ads.js" defer></script></head>
<body><header><strong>VitrineCity · Administração</strong><nav><a href="/admin.html">← Painel</a> · <a href="/centro-educacional.html">Ver catálogo</a></nav></header><main class="wrap"><div class="head"><div><small>Educação e vendas</small><h1>Gestão de cursos</h1><p>Edite catálogo, mídias, materiais, preços e acompanhe alunos e vendas.</p></div><button class="btn" id="newCourse">+ Adicionar curso</button></div><div id="message" class="msg"></div><section id="courses" class="grid"></section><section id="studentBox" class="students"></section></main>
<div class="modal" id="modal"><form class="form" id="courseForm"><h2 id="formTitle">Adicionar curso</h2><input type="hidden" id="editingSlug"><div class="fields"><div class="field"><label>Título</label><input id="title" required maxlength="140"></div><div class="field"><label>Identificador (slug)</label><input id="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="nome-do-curso"></div><div class="field full"><label>Descrição</label><textarea id="description"></textarea></div><div class="field full"><label>Público-alvo</label><input id="audience"></div><div class="field"><label>Valor (R$)</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Módulos</label><input id="modules" type="number" min="1" max="200" required></div><div class="field full"><label>Foto de capa (URL pública)</label><input id="coverUrl" type="url" placeholder="https://..."></div><div class="field full"><label>Vídeo/aula (URL pública)</label><input id="videoUrl" placeholder="https://... ou /uploads/..."></div><div class="field full"><label>Arquivo/material do curso (URL)</label><input id="materialUrl" placeholder="https://... ou /arquivo.pdf"></div><div class="field"><label>Status</label><select id="status"><option value="draft">Rascunho</option><option value="active">Publicado</option><option value="paused">Pausado</option></select></div></div><div class="form-actions"><button type="button" class="btn secondary" id="cancel">Cancelar</button><button class="btn">Salvar curso</button></div></form></div>
<script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let data=[];async function api(u,o){const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/carteira.html?admin=1';throw Error('Acesso administrativo necessário.')}if(!r.ok)throw Error(d.error||'Falha na operação.');return d}function render(){courses.innerHTML=data.map(c=>`<article class="card"><div class="cover" ${c.coverUrl?`style="background-image:url('${esc(c.coverUrl)}')"`:''}>${c.coverUrl?'':'🎓'}</div><div class="body"><span class="status">${esc(c.status)}</span><h2>${esc(c.title)}</h2><p>${esc(c.description||'Sem descrição')}</p><div class="stats"><span class="pill">${money(c.priceCents)}</span><span class="pill">${c.modules} módulos</span><span class="pill">${c.students||0} alunos</span><span class="pill">${c.sales||0} vendas</span><span class="pill">${money(c.revenue_cents)} faturado</span></div><div class="actions"><a class="btn" href="/admin-curso-preview.html?slug=${encodeURIComponent(c.slug)}">Visualizar como aluno</a><button class="btn secondary edit" data-slug="${esc(c.slug)}">Editar</button><button class="btn secondary roster" data-slug="${esc(c.slug)}">Ver alunos</button></div></div></article>`).join('')||'<p>Nenhum curso cadastrado.</p>'}async function load(){message.textContent='Carregando…';try{data=(await api('/api/admin/courses')).items;render();message.textContent=''}catch(e){message.textContent=e.message}}function openForm(c={}){formTitle.textContent=c.slug?'Editar curso':'Adicionar curso';editingSlug.value=c.slug||'';title.value=c.title||'';slug.value=c.slug||'';slug.disabled=!!c.slug;description.value=c.description||'';audience.value=c.audience||'';price.value=((c.priceCents??2399)/100).toFixed(2);modules.value=c.modules||1;coverUrl.value=c.coverUrl||'';videoUrl.value=c.videoUrl||'';materialUrl.value=c.materialUrl||'';status.value=c.status||'draft';modal.classList.add('open')}newCourse.onclick=()=>openForm();cancel.onclick=()=>modal.classList.remove('open');courses.onclick=async e=>{const edit=e.target.closest('.edit'),roster=e.target.closest('.roster');if(edit)openForm(data.find(c=>c.slug===edit.dataset.slug));if(roster){try{const rows=(await api('/api/admin/courses/'+encodeURIComponent(roster.dataset.slug)+'/students')).items;studentBox.innerHTML=`<h2>Alunos inscritos</h2><table><thead><tr><th>Aluno</th><th>E-mail</th><th>Pagamento</th><th>Valor</th><th>Inscrição</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.payment_status)}</td><td>${money(r.amount_cents)}</td><td>${esc(r.created_at)}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum aluno inscrito.</td></tr>'}</tbody></table>`;studentBox.scrollIntoView({behavior:'smooth'})}catch(err){message.textContent=err.message}}};courseForm.onsubmit=async e=>{e.preventDefault();const old=editingSlug.value,payload={slug:slug.value,title:title.value,description:description.value,audience:audience.value,priceCents:Math.round(Number(price.value)*100),modules:Number(modules.value),coverUrl:coverUrl.value,videoUrl:videoUrl.value,materialUrl:materialUrl.value,status:status.value};try{await api(old?'/api/admin/courses/'+encodeURIComponent(old):'/api/admin/courses',{method:old?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});modal.classList.remove('open');message.textContent='Curso salvo com sucesso.';await load()}catch(err){message.textContent=err.message}};load();</script></body></html>
