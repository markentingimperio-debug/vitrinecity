<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorar VitrineCity</title>
<style>
:root{--blue:#1768e6;--navy:#09275d;--gold:#ffbd16}*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#081b36;color:#fff;touch-action:none}header{height:70px;position:fixed;z-index:9;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#ffffffef;color:var(--navy);box-shadow:0 1px 14px #00112b26}.brand{font-size:24px;font-weight:900}.brand i{display:inline-block;width:26px;height:26px;margin-right:7px;border-radius:8px 8px 3px 3px;background:var(--blue);vertical-align:-5px}.back{color:var(--blue);font-size:14px;font-weight:900;text-decoration:none}.viewport{position:fixed;inset:70px 0 0;overflow:hidden;cursor:grab;background:#0a1930}.viewport.drag{cursor:grabbing}.world{position:absolute;width:2000px;height:1125px;transform-origin:0 0;background:url('/assets/mapa-mestre.jpg') center/100% 100% no-repeat;will-change:transform}.pin{position:absolute;z-index:2;border:2px solid #fff;border-radius:99px;color:#fff;padding:10px 13px;background:#1768e6eF;font-weight:900;font-size:15px;white-space:nowrap;cursor:pointer;box-shadow:0 7px 18px #06152d99;transition:transform .15s}.pin:hover{transform:scale(1.07)}.pin:after{content:'';position:absolute;top:100%;left:50%;height:30px;border-left:3px dotted #fff}.country{left:28%;top:58%;background:#82502e}.praca{left:48%;top:43%}.moda{left:29%;top:20%;background:#7e51b5}.agro{left:68%;top:24%;background:#4c975b}.food{left:69%;top:67%;background:#d88400}.services{left:78%;top:44%}.lot1{left:14%;top:70%;background:#d89000}.lot2{left:86%;top:25%;background:#d89000}.lot3{left:80%;top:73%;background:#d89000}.outdoor{left:11%;top:37%;background:#b14872}.hint{position:fixed;z-index:7;top:86px;left:18px;max-width:310px;background:#fffffff0;color:var(--navy);border-radius:17px;padding:15px;box-shadow:0 13px 35px #01142a55}.hint b{font-size:17px}.hint p{margin:6px 0 0;font-size:12px;line-height:1.45;color:#597292}.tools{position:fixed;z-index:8;right:18px;bottom:18px;display:grid;gap:8px}.tools button{width:48px;height:48px;border:0;border-radius:13px;background:#fffffff0;color:var(--navy);font-weight:900;font-size:22px;box-shadow:0 10px 25px #01142a4d;cursor:pointer}.legend{position:fixed;z-index:7;left:18px;bottom:18px;background:#071d42df;padding:10px 13px;border-radius:12px;font-size:12px;line-height:1.5}.legend b{color:#ffca28}.panel{display:none;position:fixed;z-index:12;right:20px;top:86px;width:min(360px,calc(100vw - 40px));background:#fff;color:var(--navy);padding:21px;border-radius:19px;box-shadow:0 22px 60px #0011267c}.panel.show{display:block}.shop-image{display:none;width:100%;max-height:210px;object-fit:cover;border-radius:13px;margin:0 0 13px}.panel button{float:right;border:0;width:30px;height:30px;border-radius:8px;background:#eaf3ff;font-size:18px;cursor:pointer}.panel small{font-weight:900;color:var(--blue)}.panel h2{font-size:27px;margin:10px 0}.panel p{font-size:14px;color:#557093;line-height:1.5}.panel a{display:block;background:var(--blue);padding:13px;border-radius:11px;color:#fff;text-align:center;font-weight:900;text-decoration:none;margin-top:15px}.panel .maps{display:none;background:#e9f3ff;color:#1359bb;margin-top:9px}@media(max-width:700px){header{height:64px;padding:0 16px}.brand{font-size:21px}.viewport{inset:64px 0 0}.hint{top:77px;left:12px;max-width:240px;padding:12px}.hint b{font-size:14px}.hint p{font-size:11px}.legend{left:12px;bottom:14px;font-size:10px}.tools{right:12px;bottom:13px}.tools button{width:44px;height:44px}.pin{font-size:12px;padding:8px 10px}.panel{top:auto;bottom:12px;right:12px}}
</style><script src="/analytics.js" defer></script></head>
<body><header><div class="brand"><i></i>VitrineCity <small style="font-size:11px;color:#1768e6">MAPA AO VIVO</small></div><a class="back" href="/">← Página inicial</a></header>
<div class="hint"><b>Explore a cidade inteira</b><p>Arraste para navegar pelas ruas. Dê zoom usando + e −, a roda do mouse ou a pinça do celular. Toque nos pontos para conhecer lojas e lotes.</p></div>
<main class="viewport" id="viewport"><div class="world" id="world">
<button class="pin country" data-tag="LOJA MODELO" data-name="Sertaneja Moda Country" data-desc="A primeira loja real da VitrineCity. Moda country, roupas e acessórios. A fachada oficial tem o símbolo do peão sobre o touro." data-image="/assets/sertaneja-moda-country.jpg" data-maps="https://maps.app.goo.gl/Dytp5Axq93xRtnXLA" >★ Sertaneja Moda Country</button>
<button class="pin praca" data-tag="PRAÇA CENTRAL" data-name="Praça VitrineCity" data-desc="O coração da cidade: eventos, fonte, campanhas e alto fluxo de visitantes.">Praça Central</button>
<button class="pin moda" data-tag="BAIRRO DA MODA" data-name="Avenida da Moda" data-desc="Vitrines para roupas, acessórios, beleza e calçados.">Moda</button>
<button class="pin agro" data-tag="DISTRITO AGRO" data-name="Agro & Garden" data-desc="Espaço para jardinagem, agro, pets e produtos rurais.">Agro & Garden</button>
<button class="pin food" data-tag="GASTRONOMIA" data-name="Praça de Alimentação" data-desc="Restaurantes, cafés, confeitaria, receitas e experiências gastronômicas.">Alimentação</button>
<button class="pin services" data-tag="SERVIÇOS" data-name="Centro de Serviços" data-desc="Profissionais, empresas e serviços locais em destaque.">Serviços</button>
<button class="pin lot1" data-tag="LOTE DISPONÍVEL" data-name="Lote Country 041" data-desc="Lote disponível em avenida de acesso, ideal para marca com grande visibilidade.">Lote disponível</button>
<button class="pin lot2" data-tag="LOTE PREMIUM" data-name="Lote Parque 118" data-desc="Espaço reservado em área verde premium e de alto potencial.">Lote premium</button>
<button class="pin lot3" data-tag="LOTE DISPONÍVEL" data-name="Lote Sul 203" data-desc="Lote em expansão, próximo a comércio e estacionamento.">Lote disponível</button>
<button class="pin outdoor" data-tag="MÍDIA DIGITAL" data-name="Outdoor Avenida Norte" data-desc="Anuncie campanhas e promoções para visitantes da cidade.">Outdoor</button>
</div></main>
<div class="tools"><button id="zoomIn">+</button><button id="home">⌂</button><button id="zoomOut">−</button></div><div class="legend"><b>●</b> Loja modelo &nbsp; <b>●</b> Praça / bairro &nbsp; <b>●</b> Lote disponível</div>
<aside class="panel" id="panel"><button id="close">×</button><img id="shopImage" class="shop-image" alt="Fachada da loja"><small id="tag"></small><h2 id="name"></h2><p id="desc"></p><a id="primaryAction" href="/#cadastro">Quero este espaço</a><a id="mapsAction" class="maps" target="_blank" rel="noopener">📍 Como chegar</a></aside>
<script>
const v=document.getElementById('viewport'),w=document.getElementById('world'),p=document.getElementById('panel');let s=.72,x=0,y=0,drag=false,start,initial,dist=0;function bounds(){const vw=v.clientWidth,vh=v.clientHeight,ww=2000*s,wh=1125*s;x=Math.min(40,Math.max(vw-ww-40,x));y=Math.min(40,Math.max(vh-wh-40,y))}function draw(){bounds();w.style.transform='translate('+x+'px,'+y+'px) scale('+s+')'}function center(){s=Math.max(.48,Math.min(.95,Math.min(v.clientWidth/2000,v.clientHeight/1125)*1.2));x=(v.clientWidth-2000*s)/2;y=(v.clientHeight-1125*s)/2;draw()}function zoom(n,cx=v.clientWidth/2,cy=v.clientHeight/2){const old=s;s=Math.max(.42,Math.min(1.6,s+n));x=cx-(cx-x)*s/old;y=cy-(cy-y)*s/old;draw()}v.addEventListener('pointerdown',e=>{drag=true;v.classList.add('drag');start={x:e.clientX,y:e.clientY};initial={x,y};v.setPointerCapture(e.pointerId)});v.addEventListener('pointermove',e=>{if(!drag)return;x=initial.x+e.clientX-start.x;y=initial.y+e.clientY-start.y;draw()});v.addEventListener('pointerup',e=>{drag=false;v.classList.remove('drag')});v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();zoom(e.deltaY>0?-.09:.09,e.clientX-r.left,e.clientY-r.top)},{passive:false});v.addEventListener('touchstart',e=>{if(e.touches.length===2)dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:false});v.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom((n-dist)/260);dist=n}},{passive:false});zoomIn.onclick=()=>zoom(.14);zoomOut.onclick=()=>zoom(-.14);home.onclick=center;addEventListener('resize',center);document.querySelectorAll('.pin').forEach(b=>b.onclick=e=>{e.stopPropagation();tag.textContent=b.dataset.tag;name.textContent=b.dataset.name;desc.textContent=b.dataset.desc;document.getElementById('shopImage').style.display=b.dataset.image?'block':'none';document.getElementById('shopImage').src=b.dataset.image||'';const m=document.getElementById('mapsAction');m.style.display=b.dataset.maps?'block':'none';m.href=b.dataset.maps||'#';p.classList.add('show')});close.onclick=()=>p.classList.remove('show');center();
</script></body></html>
