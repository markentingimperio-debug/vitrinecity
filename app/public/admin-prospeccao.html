<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Buscar empresas | VitrineCity</title><style>:root{--navy:#071f4b;--blue:#1768e6;--line:#d8e5f4;--muted:#617590;--bg:#f3f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.5 system-ui}header{padding:18px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between;gap:12px}header a{color:#fff}main{max-width:1180px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.search{display:grid;grid-template-columns:1fr auto;gap:10px}input,textarea,select,button{font:inherit;border:1px solid #b8cae0;border-radius:9px;padding:10px}button{border:0;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.note{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.result h2{font-size:17px;margin:0 0 5px}.links{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.links a{color:var(--blue);font-weight:700}.save{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}.save input,.save textarea{width:100%;margin:5px 0}.saved{width:100%;margin-top:5px;background:#0b8550}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;vertical-align:top}small{color:var(--muted)}.error{color:#a01717;font-weight:700}@media(max-width:620px){.search{grid-template-columns:1fr}header{font-size:13px}}</style></head><body><header><b>Prospecção de empresas</b><a href="/admin">← Painel</a></header><main><section class="card"><h1>Encontre empresas para convidar</h1><p class="note">Use dados comerciais públicos do Google. O e-mail e WhatsApp são registrados manualmente, apenas quando publicados pela empresa ou fornecidos com autorização. O envio do convite continua manual.</p><form id="search" class="search"><input id="query" required minlength="3" placeholder="Ex.: pet shops em Anápolis, GO"><button>Buscar no Google Maps</button></form><p id="state" class="note"></p></section><section><div id="results" class="grid"></div></section><section class="card"><h2>Empresas salvas</h2><div id="leads" class="table"><p class="note">Carregando…</p></div></section></main><script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(u,o)=>{const r=await fetch(u,o);if(r.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-prospeccao.html';throw Error('Acesso administrativo necessário.')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível concluir.');return d};function result(p){return `<article class="result"><h2>${esc(p.name)}</h2><small>${esc(p.category||'Empresa')} · ${esc(p.address)}</small><p>${p.phonePublic?`Telefone público: <b>${esc(p.phonePublic)}</b>`:'Sem telefone público'}${p.rating?`<br>Avaliação: ${esc(p.rating)} (${esc(p.reviews)} avaliações)`:''}</p><div class="links">${p.mapsUrl?`<a target="_blank" rel="noopener" href="${esc(p.mapsUrl)}">Abrir no Maps</a>`:''}${p.websiteUrl?`<a target="_blank" rel="noopener" href="${esc(p.websiteUrl)}">Site oficial</a>`:''}</div><details class="save"><summary><b>Salvar para convite</b></summary><input class="email" type="email" placeholder="E-mail comercial publicado (opcional)"><input class="whatsapp" inputmode="tel" placeholder="WhatsApp autorizado/publicado (opcional)"><textarea class="notes" maxlength="1200" placeholder="Observação ou próxima ação"></textarea><button class="saved" type="button">Salvar empresa</button></details></article>`}function draw(items){$('#results').innerHTML=items.length?items.map(result).join(''):'<p class="note">Nenhuma empresa encontrada.</p>';[...document.querySelectorAll('.result')].forEach((el,i)=>el.querySelector('.saved')?.addEventListener('click',async e=>{const b=e.currentTarget;b.disabled=true;try{await api('/api/admin/prospecting/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...items[i],email:el.querySelector('.email').value,whatsapp:el.querySelector('.whatsapp').value,notes:el.querySelector('.notes').value})});b.textContent='Empresa salva';await loadLeads()}catch(err){alert(err.message);b.disabled=false}}))}async function loadLeads(){const d=await api('/api/admin/prospecting/leads');$('#leads').innerHTML=d.items.length?`<table><thead><tr><th>Empresa</th><th>Contato</th><th>Status</th><th>Ação</th></tr></thead><tbody>${d.items.map(x=>`<tr data-id="${x.id}"><td><b>${esc(x.name)}</b><br><small>${esc(x.address)}</small></td><td>${esc(x.whatsapp||x.phone_public||'—')}<br><small>${esc(x.email||'')}</small></td><td><select>${['new','reviewed','contacted','interested','registered','discarded'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button>Atualizar</button></td></tr>`).join('')}</tbody></table>`:'<p class="note">Nenhuma empresa salva ainda.</p>';[...document.querySelectorAll('#leads tr[data-id]')].forEach(row=>row.querySelector('button').onclick=async()=>{await api('/api/admin/prospecting/leads/'+row.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:row.querySelector('select').value,notes:''})});await loadLeads()})}$('#search').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;$('#state').className='note';$('#state').textContent='Buscando empresas…';try{const d=await api('/api/admin/prospecting/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('#query').value})});draw(d.items);$('#state').textContent=`${d.items.length} empresas encontradas.`}catch(err){$('#state').className='error';$('#state').textContent=err.message}finally{b.disabled=false}};(async()=>{try{const s=await api('/api/admin/prospecting/status');if(!s.configured)$('#state').textContent='Integração pronta; falta cadastrar GOOGLE_PLACES_API_KEY no servidor.';await loadLeads()}catch(e){$('#state').textContent=e.message}})();</script></body></html>
