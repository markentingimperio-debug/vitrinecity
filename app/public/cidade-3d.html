<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VitrineCity 3D</title><style>:root{--blue:#1768e6;--navy:#09275d}*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial;background:#c9e8ff;color:var(--navy)}canvas{display:block}header{position:fixed;inset:0 0 auto;z-index:4;height:68px;background:#fffffff0;display:flex;align-items:center;justify-content:space-between;padding:0 5%;backdrop-filter:blur(8px)}.brand{font-size:24px;font-weight:900}.brand i{display:inline-block;width:25px;height:25px;background:var(--blue);border-radius:8px 8px 3px 3px;vertical-align:-4px;margin-right:7px}a{color:var(--blue);font-weight:800;text-decoration:none;font-size:14px}.panel{position:fixed;z-index:4;left:20px;top:86px;background:#fffffff0;border-radius:17px;padding:16px;max-width:265px;box-shadow:0 12px 30px #173a6535}.panel h1{font-size:20px;margin:0 0 7px}.panel p{font-size:13px;line-height:1.45;color:#547091;margin:0}.controls{position:fixed;right:19px;bottom:20px;z-index:4;background:#fffffff0;padding:8px;border-radius:14px;display:flex;gap:7px;box-shadow:0 12px 30px #173a6535}.controls button{border:0;background:#eaf3ff;color:var(--navy);font-weight:900;width:39px;height:39px;border-radius:9px;font-size:17px;cursor:pointer}.card{display:none;position:fixed;z-index:5;right:20px;top:86px;background:#fff;border-radius:18px;padding:19px;width:min(330px,calc(100vw - 40px));box-shadow:0 20px 45px #173a6555}.card.show{display:block}.card b{font-size:12px;color:#1768e6}.card h2{font-size:24px;margin:9px 0}.card p{font-size:14px;line-height:1.45;color:#547091}.card a{display:block;background:#1768e6;color:#fff;padding:12px;text-align:center;border-radius:10px;margin-top:14px}.close{float:right;border:0;border-radius:8px;background:#eaf3ff;font-size:18px;width:30px;height:30px;cursor:pointer}@media(max-width:700px){.panel{max-width:210px;left:12px;top:79px;padding:12px}.panel h1{font- import * as THREE from '/vendor/three/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfe6ff);scene.fog=new THREE.Fog(0xbfe6ff,110,270);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(70,100,35);sun.castShadow=true;scene.add(sun,new THREE.HemisphereLight(0xdff3ff,0x5a864b,1.9));const ground=new THREE.Mesh(new THREE.PlaneGeometry(380,310),new THREE.MeshStandardMaterial({color:0xa8d69b}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const clickable=[];function box(x,z,w,d,h,color,name,tag,description){const base=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.72}));base.position.set(x,h/2,z);base.castShadow=true;base.receiveShadow=true;base.userData={name,tag,description};scene.add(base);const roof=new THREE.Mesh(new THREE.BoxGeometry(w+1,2,d+1),new THREE.MeshStandardMaterial({color:0xffffff}));roof.position.set(x,h+1,z);scene.add(roof);clickable.push(base);return base}function road(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.22,d),new THREE.MeshStandardMaterial({color:0x57697d}));m.position.set(x,.1,z);scene.add(m);const marks=new THREE.Mesh(new THREE.BoxGeometry(w*.78,.05,.6),new THREE.MeshBasicMaterial({color:0xffe87c}));marks.position.set(x,.24,z);scene.add(marks)}road(0,-55,360,18);road(0,0,360,18);road(0,55,360,18);road(-100,0,18,260);road(-35,0,18,260);road(35,0,18,260);road(105,0,18,260);const plaza=new THREE.Mesh(new THREE.CylinderGeometry(27,27,1,48),new THREE.MeshStandardMaterial({color:0xf5f1df}));plaza.position.y=.5;scene.add(plaza);const fountain=new THREE.Mesh(new THREE.CylinderGeometry(7,9,6,32),new THREE.MeshStandardMaterial({color:0x5daeea,metalness:.2}));fountain.position.y=4;scene.add(fountain);function tree(x,z){const t=new THREE.Mesh(new THREE.SphereGeometry(3.5,10,8),new THREE.MeshStandardMaterial({color:0x4f944d}));t.position.set(x,5,z);t.castShadow=true;scene.add(t);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,5,8),new THREE.MeshStandardMaterial({color:0x795231}));trunk.position.set(x,2.5,z);scene.add(trunk)}for(let x=-155;x<170;x+=16)for(let z=-120;z<125;z+=18)if(Math.random()>.62&&Math.abs(x)>45)tree(x,z);box(-70,-28,25,22,18,0x80502f,'Sertaneja Moda Country','LOJA EM DESTAQUE','Moda country, acessórios e uma promoção ativa: até 50% OFF.');box(75,-27,24,20,19,0x7655af,'Avenida da Moda','MODA','Boutiques, roupas, calçados e acessórios.');box(138,25,24,22,17,0x4c955b,'Agro Vitrine','AGRO','Produtos para jardinagem, agricultura e animais.');box(-140,28,23,21,16,0x2169aa,'Centro de Serviços','SERVIÇOS','Profissionais e empresas para sua cidade.');box(80,82,25,21,18,0xc46d2a,'Praça da Alimentação','ALIMENTAÇÃO','Restaurantes, receitas e delivery.');box(-65,83,24,20,14,0x4e8d90,'Mercado Vitrine','COMÉRCIO','Vitrine para todos os segmentos.');for(let i=0;i<75;i++){const x=-160+(i%15)*22,z=-110+Math.floor(i/15)*49;if(Math.abs(x)<45&&Math.abs(z)<35)continue;const lot=new THREE.Mesh(new THREE.BoxGeometry(12,.2,12),new THREE.MeshStandardMaterial({color:0xd9ead2}));lot.position.set(x,.15,z);scene.add(lot)}let target=new THREE.Vector3(0,0,0),radius=185,theta=.72,phi=1.05;function placeCamera(){phi=Math.max(.42,Math.min(1.38,phi));camera.position.set(target.x+radius*Math.sin(phi)*Math.cos(theta),radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.sin(theta));camera.lookAt(target)}placeCamera();let drag=false,last;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;last={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-last.x)*.008;phi+=(e.clientY-last.y)*.008;last={x:e.clientX,y:e.clientY};placeCamera()});renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(70,Math.min(250,radius+e.deltaY*.12));placeCamera()},{passive:true});document.getElementById('plus').onclick=()=>{radius=Math.max(70,radius-15);placeCamera()};document.getElementById('minus').onclick=()=>{radius=Math.min(250,radius+15);placeCamera()};document.getElementById('home').onclick=()=>{radius=185;theta=.72;phi=1.05;placeCamera()};const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(clickable)[0];if(hit){const d=hit.object.userData;document.getElementById('tag').textContent=d.tag;document.getElementById('name').textContent=d.name;document.getElementById('description').textContent=d.description;document.getElementById('card').classList.add('show')}});document.getElementById('close').onclick=()=>document.getElementById('card').classList.remove('show');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);fountain.rotation.y+=.006;renderer.render(scene,camera)}loop();
