<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta — VitrineCity</title><style>:root{--navy:#071f4b;--blue:#1768e6;--bg:#f4f9ff;--line:#d8e7f7;--muted:#5b7192}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,6vw)}header a{font-size:24px;font-weight:900;text-decoration:none}main{max-width:900px;margin:auto;padding:42px 20px}h1{font-size:38px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:800}input{width:100%;padding:12px;border:1px solid #bfd2e8;border-radius:10px;margin-top:5px;font:inherit}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.button{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:13px 17px;font-weight:900;cursor:pointer}.addresses{display:grid;gap:12px}.address{border:1px solid var(--line);border-radius:14px;padding:16px}.address b{display:block}.address small{color:var(--muted)}.address button{margin:10px 8px 0 0}.secondary{background:#fff;color:var(--blue);border:1px solid #aacbf5}.danger{background:#fff;color:#b42424;border:1px solid #efb7b7}.message{min-height:20px;margin-top:10px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><a href="/">▣ VitrineCity</a></header><main><h1>Minha conta</h1><p>Seus dados serão preenchidos automaticamente no checkout. Você sempre confirmará antes de comprar.</p><div id="content"><p>Carregando…</p></div></main><script>const content=document.getElementById('content'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/customer/profile');if(r.status===401){location.href='/entrar.html?returnTo='+encodeURIComponent(location.pathname);return}const d=await r.json();content.innerHTML=`<section class="panel"><h2>Dados pessoais</h2><form id="profile" class="grid"><label>Nome<input name="name" value="${esc(d.customer.name)}" required></label><label>WhatsApp<input name="whatsapp" value="${esc(d.customer.whatsapp)}"></label><label class="wide">E-mail<input value="${esc(d.customer.email)}" disabled></label><div class="wide"><button class="button">Salvar dados</button></div></form></section><section class="panel"><h2>Endereços salvos</h2><div class="addresses">${d.addresses.map(a=>`<div class="address"><b>${esc(a.label)}${a.isDefault?' · padrão':''}</b><span>${esc(a.street)}, ${esc(a.number)}${a.complement?' · '+esc(a.complement):''}</span><small>${esc(a.neighborhood)} · ${esc(a.city)}/${esc(a.state)} · CEP ${esc(a.postalCode)}</small>${a.isDefault?'':`<button class="button secondary" onclick="makeDefault(${a.id})">Usar como padrão</button>`}<button class="button danger" onclick="removeAddress(${a.id})">Excluir</button></div>`).join('')||'<p>Nenhum endereço cadastrado.</p>'}</div></section><section class="panel"><h2>Adicionar endereço</h2><form id="address" class="grid"><label>Identificação<input name="label" placeholder="Casa ou trabalho"></label><label>Nome de quem recebe<input name="recipientName" required></label><label>CEP<input name="postalCode" inputmode="numeric" maxlength="9" required></label><label>Rua ou avenida<input name="street" required></label><label>Número<input name="number" required></label><label>Complemento<input name="complement"></label><label>Bairro<input name="neighborhood" required></label><label>Cidade<input name="city" required></label><label>Estado (UF)<input name="state" maxlength="2" required></label><label class="check"><input type="checkbox" name="isDefault"> Usar como padrão</label><div class="wide"><button class="button">Salvar endereço</button><div class="message" id="message"></div></div></form></section>`;document.getElementById('profile').onsubmit=saveProfile;document.getElementById('address').onsubmit=saveAddress}async function request(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível concluir.');return d}async function saveProfile(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));await request('/api/customer/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});load()}async function saveAddress(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.isDefault=Boolean(b.isDefault);const m=document.getElementById('message');try{await request('/api/customer/addresses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});load()}catch(err){m.textContent=err.message;m.style.color='#b42424'}}async function makeDefault(id){await request('/api/customer/addresses/'+id+'/default',{method:'PATCH'});load()}async function removeAddress(id){if(!confirm('Excluir este endereço?'))return;await request('/api/customer/addresses/'+id,{method:'DELETE'});load()}load()</script></body></html>
