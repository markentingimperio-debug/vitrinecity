<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praça Central — VitrineCity</title><style>:root{--blue:#1768e6;--navy:#09275d;--yellow:#ffca28}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#102039;color:var(--navy)}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#fffffff0;position:fixed;z-index:5;inset:0 0 auto;backdrop-filter:blur(8px)}.brand{font-weight:900;font-size:25px}.brand i{display:inline-block;width:26px;height:26px;background:var(--blue);border-radius:8px 8px 3px 3px;vertical-align:-4px;margin-right:7px}header a{font-size:14px;font-weight:800;color:var(--blue);text-decoration:none}.stage{height:100vh;min-height:620px;padding-top:70px;background:linear-gradient(#071c3740,#071c3711),url('/assets/praca-central-premium.jpg') center/cover no-repeat;position:relative;overflow:hidden}.intro{position:absolute;z-index:2;top:95px;left:5%;max-width:355px;background:#fffffff0;border-radius:20px;padding:23px;box-shadow:0 18px 45px #091b3844}.intro b{display:inline-block;background:#dcecff;color:#1554b4;padding:7px 9px;border-radius:99px;font-size:12px}.intro h1{font-size:34px;line-height:1.02;margin:12px 0}.intro p{font-size:14px;color:#526e90;line-height:1.45}.hotspot{position:absolute;z-index:3;border:0;color:#fff;background:#1768e6e8;border:2px solid #fff;border-radius:99px;padding:10px 14px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px #09275d55;animation:breathe 2.4s infinite}.hotspot:after{content:"";position:absolute;left:50%;top:100%;border:10px solid transparent;border-top-color:#fff;transform:translateX(-50%)}.hotspot:hover{transform:scale(1.07)}.country{left:26%;top:67%;background:#84512f}.plaza{left:49%;top:46%;background:#1768e6}.agro{left:67%;top:35%;background:#4e965b}.lot{left:84%;top:48%;background:#d89100}.lot2{left:72%;top:17%;background:#d8910 ÇA CENTRAL" data-name="Praça VitrineCity" data-desc="O ponto principal de encontro da cidade. Espaço para eventos, lives e campanhas especiais.">Praça Central</button><button class="hotspot agro" data-type="AGRO" data-name="Agro Vitrine" data-desc="Espaço reservado para produtos de jardinagem, agro e animais.">Agro Vitrine</button><button class="hotspot lot" data-type="LOTE PREMIUM DISPONÍVEL" data-name="Lote Avenida 021" data-desc="Posição de alta visibilidade na Avenida Principal. Ideal para uma loja premium.">Lote Premium</button><button class="hotspot lot2" data-type="LOTE DISPONÍVEL" data-name="Lote Praça 014" data-desc="Lote com vista para a Praça Central e grande circulação de visitantes.">Lote Praça</button><button class="hotspot outdoor" data-type="OUTDOOR DIGITAL" data-name="Outdoor Avenida Principal" data-desc="Espaço publicitário para campanhas e promoções patrocinadas.">Outdoor</button><div class="tip">Toque nos pontos da cidade para explorar lojas e espaços disponíveis.</div></main><aside class="panel" id="panel"><button id="close">×</button><small id="type"></small><h2 id="name"></h2><p id="desc"></p><a href="/#cadastro">Quero este espaço</a></aside><script>const p=document.getElementById('panel');document.querySelectorAll('.hotspot').forEach(b=>b.onclick=()=>{document.getElementById('type').textContent=b.dataset.type;document.getElementById('name').textContent=b.dataset.name;document.getElementById('desc').textContent=b.dataset.desc;p.classList.add('show')});document.getElementById('close').onclick=()=>p.classList.remove('show');</script></body></html>
