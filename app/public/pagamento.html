<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pagamento — VitrineCity</title>
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef7ff;font-family:Arial,Helvetica,sans-serif;color:#09275d;padding:22px}.card{max-width:570px;background:#fff;border:1px solid #d8e6f7;border-radius:25px;padding:38px;text-align:center;box-shadow:0 25px 60px #123b7018}.icon{font-size:55px}.card h1{font-size:34px;margin:14px 0}.card p{color:#607393;line-height:1.55}.button{display:inline-block;background:#1768e6;color:#fff;text-decoration:none;font-weight:900;padding:14px 19px;border-radius:12px;margin-top:15px}</style>
</head>
<body><main class="card"><div class="icon" id="icon">⏳</div><h1 id="title">Verificando pagamento</h1><p id="text">Aguarde enquanto consultamos a situação do seu lote fundador.</p><a class="button" href="/">Voltar para a VitrineCity</a></main>
<script>
  const query=new URLSearchParams(location.search),result=query.get('resultado'),reference=query.get('external_reference');
  const title=document.getElementById('title'),text=document.getElementById('text'),icon=document.getElementById('icon');
  const show=(kind)=>{if(kind==='sucesso'){icon.textContent='✅';title.textContent='Pagamento recebido!';text.textContent='Seu pedido foi registrado. Nossa equipe entrará em contato para montar sua vitrine.'}else if(kind==='pendente'){icon.textContent='⏳';title.textContent='Pagamento pendente';text.textContent='O Mercado Pago ainda está processando o pagamento. Você receberá a confirmação após a aprovação.'}else{icon.textContent='⚠️';title.textContent='Pagamento não concluído';text.textContent='O pagamento não foi aprovado. Você pode voltar e tentar novamente.'}};
  if(reference){fetch('/api/orders/'+encodeURIComponent(reference)).then(r=>r.ok?r.json():null).then(order=>{if(order?.status==='approved')show('sucesso');else if(order)show('pendente');else show(result)}).catch(()=>show(result))}else show(result);
</script></body></html>
