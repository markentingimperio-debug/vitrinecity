<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Logística | Administração VitrineCity</title><style>body{margin:0;background:#f3f7fc;color:#0b2855;font:15px/1.5 system-ui}header{padding:18px 5%;background:#071f4b;color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{max-width:760px;margin:35px auto;padding:0 20px}.card{background:#fff;border:1px solid #d8e5f4;border-radius:16px;padding:24px}.status{padding:12px;border-radius:10px;background:#edf4ff;margin:16px 0}.ok{background:#e7f7ee;color:#17623a}.warn{background:#fff4d8;color:#75500a}button,.button{display:inline-block;font:inherit;padding:11px 16px;border:0;border-radius:9px;background:#1768e6;color:#fff;font-weight:850;cursor:pointer;text-decoration:none}.secondary{background:#b23a3a}code{overflow-wrap:anywhere}</style></head><body><header><b>Logística e frete</b><a href="/admin">← Painel</a></header><main><section class="card"><h1>Melhor Envio</h1><p>Conecte a conta para usar preço e prazo oficiais no checkout. A Vitriny City solicita somente permissões de cálculo e consulta de transportadoras.</p><div id="status" class="status">Consultando a conexão…</div><p><b>Endereço de retorno cadastrado no aplicativo:</b><br><code id="callback">—</code></p><p><a id="connect" class="button" href="/api/admin/marketplace/shipping/connect">Conectar Melhor Envio</a> <button id="disconnect" class="secondary" hidden>Desconectar</button></p></section></main><script>const box=document.querySelector('#status'),connect=document.querySelector('#connect'),disconnect=document.querySelector('#disconnect');async function load(){const r=await fetch('/api/admin/marketplace/shipping/status');if(r.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-logistica.html';return}const d=await r.json();document.querySelector('#callback').textContent=d.callback||'—';if(d.connected){box.className='status ok';box.textContent='Conta conectada. A renovação do acesso é automática.';connect.textContent='Reconectar conta';disconnect.hidden=false}else if(!d.appConfigured||!d.originConfigured){box.className='status warn';box.textContent='Antes de conectar, configure o aplicativo e o CEP de origem no servidor.'}else{box.className='status warn';box.textContent='Conta ainda não conectada.'}}disconnect.onclick=async()=>{if(!confirm('Desconectar o Melhor Envio?'))return;const r=await fetch('/api/admin/marketplace/shipping/disconnect',{method:'POST'});if(r.ok)load()};const p=new URLSearchParams(location.search).get('status');if(p==='connected')box.textContent='Conexão concluída.';if(p==='failed'||p==='invalid')box.textContent='Não foi possível concluir a conexão. Tente novamente.';load();</script></body></html>
