<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos de serviços — VitrineCity</title><style>:root{--navy:#071f4b;--blue:#1768e6;--line:#d8e6f7;--muted:#607393}*{box-sizing:border-box}body{margin:0;background:#f2f7fd;color:var(--navy);font-family:Inter,Arial,sans-serif}header{padding:20px 5%;background:var(--navy);color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{width:min(1150px,92%);margin:32px auto}h1{font-size:38px}.summary{padding:16px;background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:18px}.grid{display:grid;gap:13px}.order{display:grid;grid-template-columns:1fr auto;gap:18px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px}.order h2{margin:5px 0}.order p{color:var(--muted);line-height:1.5}.badge{display:inline-flex;padding:6px 9px;border-radius:99px;background:#e8f2ff;color:#1458b7;font-size:11px;font-weight:900}.paid{background:#e8f8ef;color:#16734b}.controls{display:grid;gap:8px;align-content:center}select,button{padding:10px;border:1px solid #bfd3ec;border-radius:10px;background:#fff;font:inherit}button{background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.empty{padding:45px;text-align:center;background:#fff;border-radius:17px}@media(max-width:700px){.order{grid-template-columns:1fr}}</style></head><body><header><strong>VitrineCity · Serviços digitais</strong><a href="/admin.html">← Painel administrativo</a></header><main><h1>Pedidos pagos e produção</h1><div class="summary" id="summary">Carregando pedidos…</div><section class="grid" id="list"></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),labels={'10-videos-loja':'Pacote de 10 vídeos','google-maps-essencial':'Google & Maps Essencial','pagina-empresa':'Página profissional da empresa'},steps={awaiting_payment:'Aguardando pagamento',awaiting_brief:'Pendente — solicitar briefing',brief_received:'Briefing recebido',in_production:'Em produção',awaiting_approval:'Aguardando aprovação do cliente',delivered:'Entregue',cancelled:'Cancelado'};async function api(url,opt){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin-login.html?returnTo=%2Fadmin-servicos.html';throw Error('Entre como administrador.')}if(!r.ok)throw Error(d.error||'Falha na operação.');return d}async function update(ref,value){await api('/api/admin/service-orders/'+encodeURIComponent(ref),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({deliveryStatus:value})});load()}async function load(){try{const d=await api('/api/admin/service-orders'),paid=d.orders.filter(x=>x.status==='approved');summary.textContent=`${d.orders.length} pedidos · ${paid.length} pagamentos aprovados · ${paid.filter(x=>!['delivered','cancelled'].includes(x.delivery_status)).length} aguardando atendimento`;list.innerHTML=d.orders.map(x=>`<article class="order"><div><span class="badge ${x.status==='approved'?'paid':''}">${esc(x.status)}</span><h2>${esc(labels[x.service_slug]||x.service_slug)} · ${money(x.amount_cents)}</h2><p><b>${esc(x.name)}</b> · ${esc(x.email)} · ${esc(x.whatsapp||'sem WhatsApp')}<br>Referência: ${esc(x.reference)}<br>Criado em ${new Date(x.created_at+'Z').toLocaleString('pt-BR')}</p></div><div class="controls"><select aria-label="Etapa do pedido">${Object.entries(steps).map(([key,label])=>`<option value="${key}" ${x.delivery_status===key?'selected':''}>${label}</option>`).join('')}</select><button type="button">Salvar etapa</button></div></article>`).join('')||'<div class="empty">Nenhum serviço comprado ainda.</div>';list.querySelectorAll('.order').forEach((card,i)=>card.querySelector('button').onclick=()=>update(d.orders[i].reference,card.querySelector('select').value))}catch(error){list.innerHTML='<div class="empty">'+esc(error.message)+'</div>'}}load();</script></body></html>
