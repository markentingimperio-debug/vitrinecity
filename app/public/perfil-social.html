<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Perfil público na Vitriny Social">
  <title>Perfil — Vitriny Social</title>
  <style>
    :root{--blue:#1768e6;--yellow:#ffc628;--bg:#050a13;--panel:#101a2d;--line:#293750;--text:#f7faff;--muted:#aebbd0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}.top{height:68px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,4vw);background:#07101df2;border-bottom:1px solid #ffffff18}.brand{color:#fff;text-decoration:none;font-size:24px;font-weight:950}.brand span{color:var(--yellow)}.top nav{display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.btn.alt{background:#162238;border:1px solid #ffffff24}.wrap{width:min(940px,100%);margin:auto;padding:32px 18px 80px}.profile{display:grid;grid-template-columns:150px 1fr;gap:28px;align-items:center;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:24px}.avatar{width:140px;height:140px;border-radius:50%;object-fit:cover;background:linear-gradient(145deg,var(--blue),#7b4cff);border:4px solid #fff;display:grid;place-items:center;font-size:52px;font-weight:950}.identity h1{margin:0 0 3px;font-size:30px}.handle{color:var(--muted);font-weight:800}.bio{line-height:1.5;margin:13px 0 6px}.city{color:var(--muted);font-size:14px}.counts{display:flex;gap:24px;margin:17px 0}.counts b{display:block;font-size:20px}.counts span{color:var(--muted);font-size:12px}.actions{display:flex;gap:9px;flex-wrap:wrap}.videos-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 13px}.videos-title h2{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tile{position:relative;aspect-ratio:9/16;background:#0a1220;border:1px solid var(--line);overflow:hidden;border-radius:12px;cursor:pointer}.tile iframe,.tile img{width:100%;height:100%;border:0;object-fit:cover;pointer-events:none}.tile span{position:absolute;left:9px;bottom:9px;font-size:12px;font-weight:900;text-shadow:0 2px 6px #000}.empty{padding:50px 20px;text-align:center;background:var(--panel);border:1px dashed #40516f;border-radius:20px;color:var(--muted)}.modal{position:fixed;z-index:50;inset:0;background:#02050be8;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--panel);border:1px solid #ffffff25;border-radius:22px;padding:22px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{margin:0}.close{border:0;background:none;color:#fff;font-size:29px;cursor:pointer}.field{display:block;margin:14px 0;font-weight:850;font-size:13px}.field input,.field textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #384965;border-radius:11px;background:#08111f;color:#fff}.field textarea{min-height:90px;resize:vertical}.status{min-height:20px;color:var(--muted);margin-top:10px}.viewer-stage{width:min(460px,100%);height:min(90dvh,820px);position:relative;background:#000;border-radius:18px;overflow:hidden}.viewer-stage iframe{width:100%;height:100%;border:0}.viewer-stage .close{position:absolute;z-index:2;right:12px;top:10px;width:44px;height:44px;border-radius:50%;background:#07101ddd}@media(max-width:640px){.top{height:60px}.top .alt{display:none}.brand{font-size:21px}.wrap{padding:14px 0 76px}.profile{grid-template-columns:82px 1fr;gap:14px;border-radius:0;padding:17px}.avatar{width:80px;height:80px;font-size:30px}.identity h1{font-size:22px}.counts{grid-column:1/-1;justify-content:space-around;margin:4px 0}.actions{grid-column:1/-1}.actions .btn{flex:1}.videos-title{padding:0 12px}.grid{gap:2px}.tile{border-radius:0;border:0}.modal{padding:0}.viewer-stage{width:100%;height:100dvh;border-radius:0}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/social.html">Vitriny <span>Social</span></a><nav><a class="btn alt" href="/social.html">Para você</a><a class="btn" id="post-top" href="/social.html?publicar=1">＋ Postar</a></nav></header>
  <main class="wrap"><section class="profile" id="profile"><div class="avatar">V</div><div class="identity"><h1>Carregando…</h1></div></section><div class="videos-title"><h2>Publicações</h2><span id="video-count"></span></div><section class="grid" id="videos"></section></main>
  <div class="modal" id="edit-modal" role="dialog" aria-modal="true"><form class="dialog" id="edit-form"><div class="head"><h2>Editar perfil</h2><button class="close" type="button" aria-label="Fechar">×</button></div><label class="field">Foto do perfil<input type="file" name="avatar" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG ou WebP.</small></label><label class="field">Nome de usuário<input name="handle" minlength="3" maxlength="24" required></label><label class="field">Biografia<textarea name="bio" maxlength="240" placeholder="Conte quem você é e o que publica"></textarea></label><label class="field">Cidade<input name="city" maxlength="80" placeholder="Ex.: Anápolis, GO"></label><button class="btn" style="width:100%">Salvar perfil</button><div class="status" id="edit-status"></div></form></div>
  <div class="modal" id="viewer" role="dialog" aria-modal="true"><div class="viewer-stage"><button class="close" id="viewer-close" aria-label="Fechar">×</button><iframe id="viewer-frame" title="Publicação" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div></div>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const query=new URLSearchParams(location.search),requested=query.get('usuario')||'';let current=null;
    async function load(){const url=requested?'/api/social/profile/'+encodeURIComponent(requested):'/api/social/profile/me';const r=await fetch(url),d=await r.json();if(r.status===401){location.href='/carteira.html?redirect='+encodeURIComponent(location.pathname+location.search);return}if(!r.ok){document.getElementById('profile').innerHTML='<div class="empty">'+esc(d.error||'Perfil não encontrado.')+'</div>';return}current=d.profile;document.title='@'+current.handle+' — Vitriny Social';const avatar=current.avatarUrl?`<img class="avatar" src="${esc(current.avatarUrl)}" alt="Foto de ${esc(current.name)}">`:`<div class="avatar">${esc(current.name.slice(0,1).toUpperCase())}</div>`;const action=current.mine?`<button class="btn alt" id="edit">Editar perfil</button><a class="btn" href="/social.html?publicar=1">＋ Postar</a><a class="btn alt" href="/chat-social.html">Mensagens</a>`:`<button class="btn" id="follow">${current.followedByMe?'Seguindo':'Seguir'}</button><a class="btn alt" href="/chat-social.html?usuario=${encodeURIComponent(current.handle)}">Mensagem</a><button class="btn alt" id="mute">${current.mutedByMe?'Reativar':'Silenciar'}</button><button class="btn alt" id="block">Bloquear</button>`;document.getElementById('profile').innerHTML=`${avatar}<div class="identity"><h1>${esc(current.name)}</h1><div class="handle">@${esc(current.handle)}</div><p class="bio">${esc(current.bio||'Perfil na Vitriny Social')}</p><div class="city">${esc(current.city||'Vitriny City')}</div></div><div class="counts"><div><b>${current.posts}</b><span>publicações</span></div><div><b id="followers">${current.followers}</b><span>seguidores</span></div><div><b>${current.following}</b><span>seguindo</span></div></div><div class="actions">${action}</div>`;document.getElementById('video-count').textContent=current.posts+' vídeos';render(d.items||[]);document.getElementById('edit')?.addEventListener('click',openEdit);document.getElementById('follow')?.addEventListener('click',follow);document.getElementById('mute')?.addEventListener('click',mute);document.getElementById('block')?.addEventListener('click',block)}
    function render(items){const box=document.getElementById('videos');box.innerHTML=items.map(p=>{const media=p.mediaType==='image'?`<img src="${esc(p.imageUrl)}" alt="">`:`<iframe src="${esc(p.playerUrl)}" title="${esc(p.caption)}"></iframe>`;return `<button class="tile" data-player="${esc(p.playerUrl||'')}" aria-label="Abrir publicação">${media}<span>▶ ${p.views}</span></button>`}).join('')||'<div class="empty" style="grid-column:1/-1">Nenhuma publicação aprovada ainda.</div>'}
    function openEdit(){const form=document.getElementById('edit-form');form.handle.value=current.handle;form.bio.value=current.bio||'';form.city.value=current.city||'';document.getElementById('edit-modal').classList.add('open')}
    document.querySelector('#edit-modal .close').onclick=()=>document.getElementById('edit-modal').classList.remove('open');document.getElementById('edit-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,status=document.getElementById('edit-status');status.textContent='Salvando…';let avatarUrl=current.avatarUrl||'';const file=form.avatar.files[0];if(file){const up=await fetch('/api/social/media/photo',{method:'POST',headers:{'Content-Type':file.type},body:file}),ud=await up.json();if(!up.ok){status.textContent=ud.error||'Não foi possível enviar a foto.';return}avatarUrl=ud.url}const r=await fetch('/api/social/profile/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:form.handle.value,bio:form.bio.value,city:form.city.value,avatarUrl})}),d=await r.json();if(!r.ok){status.textContent=d.error||'Não foi possível salvar.';return}location.href='/perfil-social.html?usuario='+encodeURIComponent(form.handle.value)};
    async function follow(){const r=await fetch('/api/social/users/'+current.id+'/follow',{method:'POST'}),d=await r.json();if(r.status===401){location.href='/carteira.html?redirect='+encodeURIComponent(location.href);return}if(r.ok){current.followedByMe=d.following;current.followers=Math.max(0,Number(current.followers)+(d.following?1:-1));document.getElementById('follow').textContent=d.following?'Seguindo':'Seguir';document.getElementById('followers').textContent=current.followers}}
    async function mute(){const r=await fetch('/api/social/users/'+current.id+'/mute',{method:'POST'}),d=await r.json();if(r.ok){current.mutedByMe=d.muted;document.getElementById('mute').textContent=d.muted?'Reativar':'Silenciar'}}
    async function block(){if(!confirm('Bloquear @'+current.handle+'? Vocês deixarão de se seguir e não poderão conversar.'))return;const r=await fetch('/api/social/users/'+current.id+'/block',{method:'POST'});if(r.ok)location.href='/social.html'}
    document.getElementById('videos').onclick=e=>{const tile=e.target.closest('.tile');if(!tile||!tile.dataset.player)return;document.getElementById('viewer-frame').src=tile.dataset.player+(tile.dataset.player.includes('?')?'&':'?')+'autoplay=true';document.getElementById('viewer').classList.add('open')};function closeViewer(){document.getElementById('viewer').classList.remove('open');document.getElementById('viewer-frame').src=''}document.getElementById('viewer-close').onclick=closeViewer;document.getElementById('viewer').onclick=e=>{if(e.target.id==='viewer')closeViewer()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});load();
  </script>
</body>
</html>
