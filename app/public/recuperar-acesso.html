<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar acesso — VitrineCity</title><style>:root{--navy:#071f4b;--blue:#1768e6;--line:#d6e5f7;--muted:#60738f}*{box-sizing:border-box}body{margin:0;background:#f2f7fd;color:var(--navy);font:15px/1.5 Inter,Arial,sans-serif}header{padding:20px max(20px,6vw);background:#fff;border-bottom:1px solid var(--line)}header a{color:inherit;text-decoration:none;font-size:23px;font-weight:950}main{max-width:560px;margin:60px auto;padding:0 18px}.card{padding:28px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 18px 44px #071f4b13}h1{margin-top:0;font-size:34px}p{color:var(--muted)}label{display:grid;gap:6px;margin:14px 0;font-weight:850}input{width:100%;padding:13px;border:1px solid #b9cfe9;border-radius:10px;font:inherit}button{display:inline-flex;padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.message{min-height:24px;margin-top:14px;color:#137c55}</style></head><body><header><a href="/acessos.html">← VitrineCity</a></header><main><section class="card"><div id="requestPanel"><h1>Recuperar senha</h1><p>Informe o e-mail da sua conta de cliente. O link terá validade de 30 minutos.</p><form id="requestForm"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><button>Enviar link seguro</button></form></div><div id="resetPanel" hidden><h1>Criar nova senha</h1><p>Use pelo menos 10 caracteres e não reutilize senhas de outros serviços.</p><form id="resetForm"><label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirmar senha<input name="confirm" type="password" autocomplete="new-password" minlength="10" required></label><button>Atualizar senha</button></form></div><p class="message" id="message" role="status"></p></section></main><script>const token=new URLSearchParams(location.search).get('token')||'',message=document.getElementById('message'),requestPanel=document.getElementById('requestPanel'),resetPanel=document.getElementById('resetPanel'),requestForm=document.getElementById('requestForm'),resetForm=document.getElementById('resetForm');if(token){requestPanel.hidden=true;resetPanel.hidden=false}requestForm.onsubmit=async event=>{event.preventDefault();message.textContent='Enviando…';const response=await fetch('/api/auth/password-reset/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:new FormData(requestForm).get('email')})}),data=await response.json();message.textContent=data.message};resetForm.onsubmit=async event=>{event.preventDefault();const form=new FormData(resetForm);if(form.get('password')!==form.get('confirm')){message.textContent='As senhas não são iguais.';return}message.textContent='Atualizando…';const response=await fetch('/api/auth/password-reset/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:form.get('password')})}),data=await response.json().catch(()=>({}));message.textContent=data.message||data.error||'Não foi possível atualizar.';if(response.ok)setTimeout(()=>location.href='/entrar.html',1200)}</script></body></html>
