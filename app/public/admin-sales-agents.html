<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Agentes de Vendas | VitrineCity</title><style>body{margin:0;background:#eef5fc;color:#10264a;font:14px/1.5 system-ui}header{padding:18px 4%;background:#071f4b;color:#fff;display:flex;justify-content:space-between}header a{color:#fff}main{width:min(1180px,94%);margin:28px auto}.hero,.card{background:#fff;border:1px solid #d6e4f3;border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:15px}.card h2{margin:5px 0}.pill{padding:4px 8px;border-radius:99px;background:#e6f7ed;color:#176b42;font-weight:800;font-size:11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metrics div{background:#f3f7fc;padding:9px;border-radius:9px}.muted{color:#667b97}pre{white-space:pre-wrap;font-size:11px;background:#081a31;color:#cce7ff;padding:10px;border-radius:9px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>VitrineCity · Agentes de Vendas</strong><a href="/admin">Central de gestão</a></header><main><section class="hero"><h1>Equipe autônoma de vendas</h1><p>Multiplicação baseada somente em vendas pagas, lucrativas e não estornadas. Limite inicial: 10 agentes.</p></section><section class="grid" id="list"></section></main><script>const money=n=>(Number(n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));fetch('/api/admin/sales-agents').then(async r=>{if(r.status===401||r.status===403)return location.href='/admin-login.html?returnTo=%2Fadmin-sales-agents.html';const d=await r.json();document.querySelector('#list').innerHTML=d.agents.map(a=>`<article class="card"><span class="pill">${a.tier==='super'?'SUPER AGENTE':'GERAÇÃO '+a.generation} · ${esc(a.status)}</span><h2>${esc(a.name)}</h2><p class="muted">Algoritmo v${a.algorithm_version} · ${a.children} descendentes</p><div class="metrics"><div><b>${a.sales_count}</b><br>vendas</div><div><b>${money(a.revenue_cents)}</b><br>receita</div><div><b>${money(a.profit_cents)}</b><br>lucro</div><div><b>${a.last_sale_at||'—'}</b><br>última venda</div></div><details><summary>Algoritmo salvo</summary><pre>${esc(JSON.stringify(a.algorithm,null,2))}</pre></details></article>`).join('')}).catch(e=>document.querySelector('#list').textContent=e.message);</script></body></html>
