<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Matriz de Vendas | VitrineCity</title><style>
:root{--bg:#020807;--panel:#07130f;--line:#153c2b;--green:#35ff8a;--dim:#5d9473;--amber:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0b2d20,transparent 38%),var(--bg);color:#d9ffe7;font:14px/1.5 ui-monospace,Consolas,monospace}header{display:flex;justify-content:space-between;padding:16px 4%;border-bottom:1px solid var(--line);background:#020a07dd}a{color:var(--green)}main{width:min(1300px,94%);margin:22px auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h1{margin:0;color:var(--green);font-size:clamp(26px,4vw,46px);text-shadow:0 0 24px #35ff8a55}.live{padding:7px 12px;border:1px solid var(--green);border-radius:99px;color:var(--green)}.live:before{content:'●';margin-right:7px;animation:pulse 1.4s infinite}.matrix{position:relative;min-height:390px;margin-top:18px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(#35ff8a08 1px,transparent 1px),linear-gradient(90deg,#35ff8a08 1px,transparent 1px),#030c09;background-size:34px 34px}.rain{position:absolute;inset:0;opacity:.18;overflow:hidden;word-break:break-all;color:var(--green);font-size:11px;line-height:14px;animation:drift 18s linear infinite}.network{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:55px;padding:85px 35px}.node{width:190px;min-height:125px;padding:15px;border:1px solid var(--green);border-radius:14px;background:#07140ff2;box-shadow:0 0 25px #35ff8a1f;position:relative;animation:nodeIn .35s ease}.node:after{content:'';position:absolute;width:55px;height:1px;background:linear-gradient(90deg,var(--green),transparent);right:-56px;top:50%;animation:signal 1.8s infinite}.node:last-child:after{display:none}.node.super{border-color:var(--amber)}.node strong{display:block;font-size:16px}.node small,.muted{color:var(--dim)}.status{color:var(--green);margin-top:10px}.dashboard{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.stream{height:270px;overflow:auto}.event{padding:8px 0;border-bottom:1px solid var(--line);color:#a8d8b8}.event b{color:var(--green)}.agents{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid var(--line);padding:14px;border-radius:12px;background:#04100b}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.metrics span{padding:7px;background:#0a1d14;border-radius:7px}.code{white-space:pre-wrap;color:#7cf5a9;font-size:10px;max-height:160px;overflow:auto}.locked{opacity:.55}@keyframes pulse{50%{opacity:.25}}@keyframes drift{to{transform:translateY(28px)}}@keyframes signal{0%{opacity:0;transform:scaleX(.1)}50%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:translateX(30px)}}@keyframes nodeIn{from{opacity:0;transform:scale(.92)}}@media(max-width:850px){.dashboard{grid-template-columns:1fr}.agents{grid-template-columns:1fr}.node:after{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><header><strong>VITRINECITY // SALES MATRIX</strong><nav><a href="/admin">Central</a> · <a href="/admin-quizzes.html">Quizzes</a></nav></header><main><section class="hero"><div><div class="muted">ALGORITMO COMERCIAL AUTÔNOMO</div><h1>Matriz de Agentes</h1><p>Visualização baseada em dados reais. Nenhuma venda ou multiplicação é simulada.</p></div><span class="live" id="live">SINCRONIZANDO</span></section><section class="matrix"><div class="rain" aria-hidden="true" id="rain"></div><div class="network" id="network"></div></section><section class="dashboard"><div class="panel"><h2>Desempenho por agente</h2><div class="agents" id="agents"></div></div><aside class="panel"><h2>Fluxo do algoritmo</h2><div class="stream" id="stream" aria-live="polite"></div></aside></section></main><script>
const $=s=>document.querySelector(s),money=n=>(Number(n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));$('#rain').textContent=Array(90).fill('01001101 10100110 VENDAS LUCRO APRENDER VALIDAR ').join('');function render(d){const a=d.agents||[],active=a.filter(x=>x.status==='active');$('#live').textContent=`ONLINE · ${active.length} ATIVOS`;$('#network').innerHTML=active.map(x=>`<div class="node ${x.tier}"><small>G${x.generation} / ALG v${x.algorithm_version}</small><strong>${esc(x.name)}</strong><div class="status">● ${x.sales_count?'OTIMIZANDO':'ANALISANDO OFERTAS'}</div><small>${x.children} descendentes</small></div>`).join('')+`<div class="node locked"><small>REGRA DE EXPANSÃO</small><strong>SUPER AGENTES</strong><div class="status">${a.filter(x=>x.tier==='standard'&&x.revenue_cents>=1000000).length}/10 QUALIFICADOS</div><small>R$ 10 mil por agente</small></div>`;$('#agents').innerHTML=a.map(x=>`<article class="card"><b>${esc(x.name)}</b><div class="muted">${x.tier.toUpperCase()} · G${x.generation} · algoritmo v${x.algorithm_version}</div><div class="metrics"><span>${x.sales_count}<br><small>vendas</small></span><span>${money(x.revenue_cents)}<br><small>receita</small></span><span>${money(x.profit_cents)}<br><small>lucro</small></span></div><details><summary>Ver algoritmo persistido</summary><pre class="code">${esc(JSON.stringify(x.algorithm,null,2))}</pre></details></article>`).join('');const e=[`Ciclo verificado às ${new Date().toLocaleTimeString('pt-BR')}`,`${a.length} algoritmo(s) persistido(s)`,`${active.length} agente(s) no limite operacional`,a.some(x=>x.sales_count)?'Aprendizado atualizado com vendas confirmadas':'Aguardando primeira venda paga e lucrativa','Canais desconectados bloqueados','Política anti-spam ativa'];$('#stream').innerHTML=e.map((x,i)=>`<div class="event"><b>${String(i+1).padStart(2,'0')} &gt;</b> ${x}</div>`).join('')}async function load(){const r=await fetch('/api/admin/sales-agents'),d=await r.json();if(r.status===401||r.status===403)return location.href='/admin-login.html?returnTo=%2Fadmin-sales-agents.html';if(!r.ok)throw Error(d.error||'Falha');render(d)}load().catch(e=>$('#stream').textContent=e.message);setInterval(()=>load().catch(()=>{}),5000);
</script></body></html>
