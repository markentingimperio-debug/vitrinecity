<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Entre ou crie sua conta VitrineCity para usar a rede social, loja, cursos e anúncios.">
  <link rel="canonical" href="https://vitrinecity.com/entrar.html">
  <title>Entrar ou criar conta — VitrineCity</title>
  <style>
    :root{--navy:#071f4b;--blue:#1768e6;--yellow:#ffc628;--bg:#f4f9ff;--line:#d8e7f7;--muted:#5b7192;--danger:#b42424}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 85% 0,#dcecff,transparent 30rem),var(--bg);color:var(--navy)}
    header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,6vw)}header a{text-decoration:none;font-weight:900;color:var(--navy)}.brand{font-size:25px}
    main{max-width:980px;margin:auto;padding:48px 20px}.intro{text-align:center;max-width:700px;margin:0 auto 30px}.intro h1{font-size:clamp(36px,6vw,58px);margin:10px 0}.intro p{color:var(--muted);line-height:1.6}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 16px 40px #173d7010}.card h2{margin-top:0}
    label{display:block;font-size:13px;font-weight:850;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #bfd2e8;border-radius:10px;font:inherit}.check{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.4}.check input{width:auto;margin-top:2px}
    button{width:100%;margin-top:15px;border:0;border-radius:11px;background:var(--blue);color:#fff;padding:13px 17px;font-weight:900;cursor:pointer}.secondary{background:var(--navy)}.message{min-height:22px;text-align:center;margin-top:15px;font-weight:800}.links{text-align:center;margin-top:22px}.links a{color:var(--blue);margin:0 8px}
    @media(max-width:720px){.grid{grid-template-columns:1fr}main{padding-top:30px}}
  </style>
</head>
<body>
<header><a class="brand" href="/">▣ VitrineCity</a><a href="/social.html">Vitriny Social</a></header>
<main>
  <div class="intro"><small>UMA CONTA PARA TODA A CIDADE</small><h1>Entre na VitrineCity</h1><p>A mesma conta dá acesso à Vitriny Social, loja, cursos, pedidos, perfil e VitrineCity Ads.</p></div>
  <div class="grid">
    <section class="card"><h2>Já tenho conta</h2><form id="login"><label for="login-email">E-mail</label><input id="login-email" name="email" type="email" autocomplete="email" required><label for="login-password">Senha</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><button class="secondary">Entrar</button></form></section>
    <section class="card"><h2>Criar conta gratuita</h2><form id="register"><label for="name">Nome</label><input id="name" name="name" autocomplete="name" required maxlength="100"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required><label for="whatsapp">WhatsApp (opcional)</label><input id="whatsapp" name="whatsapp" inputmode="tel" autocomplete="tel"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><label class="check"><input name="adult" type="checkbox" required><span>Confirmo que tenho 18 anos ou mais.</span></label><label class="check"><input name="terms" type="checkbox" required><span>Li e aceito os <a href="/termos-creditos.html">termos</a> e a <a href="/privacy.html">Política de Privacidade</a>.</span></label><button>Criar conta segura</button></form></section>
  </div>
  <div class="message" id="message" role="status" aria-live="polite"></div>
  <div class="links"><a href="/minha-conta.html">Minha conta</a><a href="/carteira.html">VitrineCity Ads</a><a href="/privacy.html">Privacidade</a></div>
</main>
<script>
  const message=document.getElementById('message');
  const params=new URLSearchParams(location.search);
  const requested=params.get('returnTo')||'/minha-conta.html';
  const destination=requested.startsWith('/')&&!requested.startsWith('//')?requested:'/minha-conta.html';
  async function api(url,options){const response=await fetch(url,options),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não foi possível concluir.');return data}
  function show(text,error=false){message.textContent=text;message.style.color=error?'var(--danger)':'#137c55'}
  document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget);try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.get('email'),password:form.get('password')})});show('Entrada realizada. Redirecionando…');location.href=destination}catch(error){show(error.message,true)}});
  document.getElementById('register').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget);try{await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.get('name'),email:form.get('email'),whatsapp:form.get('whatsapp'),password:form.get('password'),adultConfirmed:form.get('adult')==='on',termsAccepted:form.get('terms')==='on'})});show('Conta criada. Redirecionando…');location.href=destination}catch(error){show(error.message,true)}});
</script>
</body></html>
