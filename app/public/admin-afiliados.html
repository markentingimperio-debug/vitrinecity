<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campanhas de afiliados | VitrineCity</title><style>
:root{--navy:#07162e;--panel:#101f39;--line:#263a59;--text:#f6f8fc;--muted:#a8b7ce;--blue:#3987ff;--green:#28b77a;--red:#e85c70}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:#9ac4ff}.wrap{width:min(1180px,94%);margin:28px auto 70px}header{padding:18px max(20px,3vw);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}h1{margin:4px 0;font-size:clamp(28px,4vw,44px)}p{color:var(--muted)}button,input,textarea,select{font:inherit}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:white;font-weight:900;cursor:pointer}.secondary{background:#233653}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.card h2{margin:0 0 8px;font-size:19px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pill{padding:6px 9px;border-radius:999px;background:#1b3152;font-size:12px}.status{color:#86efbd;font-weight:900;text-transform:uppercase}.actions{display:flex;gap:8px}.modal{position:fixed;inset:0;background:#020814cc;display:none;place-items:center;padding:20px}.modal.open{display:grid}.form{width:min(680px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#08152a;color:white;border-radius:10px;padding:11px}textarea{min-height:100px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.msg{min-height:24px;color:#ffb3bd}@media(max-width:650px){.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.head{align-items:start;flex-direction:column}}</style></head>
<body><header><strong>VitrineCity · Administração</strong><nav><a href="/admin.html">Painel</a> · <a href="/admin-social-moderacao.html">Aprovações</a></nav></header><main class="wrap"><div class="head"><div><small>Criadores afiliados</small><h1>Campanhas de conteúdo</h1><p>Gerencie produtos, recompensas, comissão e disponibilidade.</p></div><button class="btn" id="newCampaign">+ Nova campanha</button></div><div id="message" class="msg"></div><section id="campaigns" class="grid"></section></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><form class="form" id="campaignForm"><h2 id="formTitle">Nova campanha</h2><input type="hidden" id="campaignId"><div class="fields"><div class="field"><label for="productName">Produto</label><input id="productName" required maxlength="120"></div><div class="field"><label for="productUrl">Link do produto</label><input id="productUrl" required placeholder="/loja.html"></div><div class="field"><label for="rewardCoins">VitrinyCoins por aprovação</label><input id="rewardCoins" type="number" min="0" step="1" required value="250"></div><div class="field"><label for="commissionPercent">Comissão por venda (%)</label><input id="commissionPercent" type="number" min="0" max="100" step="0.1" required value="10"></div><div class="field"><label for="maxVideos">Quantidade de vagas</label><input id="maxVideos" type="number" min="1" required value="100"></div><div class="field"><label for="status">Status</label><select id="status"><option value="draft">Rascunho</option><option value="active">Ativa</option><option value="paused">Pausada</option><option value="closed">Encerrada</option></select></div><div class="field full"><label for="requirements">Requisitos do vídeo</label><textarea id="requirements" required maxlength="1200"></textarea></div></div><div class="form-actions"><button type="button" class="btn secondary" id="cancel">Cancelar</button><button class="btn" type="submit">Salvar campanha</button></div></form></div>
<script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let data=[];async function api(u,o){const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/carteira.html?admin=1';throw Error('Acesso administrativo necessário.')}if(!r.ok)throw Error(d.error||'Falha na operação.');return d}function render(){campaigns.innerHTML=data.map(c=>`<article class="card"><span class="status">${esc(c.status)}</span><h2>${esc(c.product_name)}</h2><p>${esc(c.requirements)}</p><div class="stats"><span class="pill">${c.rewardCoins} moedas</span><span class="pill">${c.commissionPercent}% comissão</span><span class="pill">${c.submissions}/${c.max_videos} envios</span><span class="pill">${c.approved} aprovados</span></div><div class="actions"><button class="btn edit" data-id="${c.id}">Editar</button><a class="btn secondary" href="/admin-social-moderacao.html">Ver aprovações</a></div></article>`).join('')||'<p>Nenhuma campanha cadastrada.</p>'}async function load(){message.textContent='Carregando…';try{data=(await api('/api/admin/affiliates/campaigns')).items;render();message.textContent=''}catch(e){message.textContent=e.message}}function openForm(c={}){formTitle.textContent=c.id?'Editar campanha':'Nova campanha';campaignId.value=c.id||'';productName.value=c.product_name||'';productUrl.value=c.product_url||'/loja.html';rewardCoins.value=c.rewardCoins??250;commissionPercent.value=c.commissionPercent??10;maxVideos.value=c.max_videos??100;status.value=c.status||'draft';requirements.value=c.requirements||'Mostre o produto, explique como usar e mantenha a publicação pública por 30 dias.';modal.classList.add('open')}newCampaign.onclick=()=>openForm();cancel.onclick=()=>modal.classList.remove('open');campaigns.onclick=e=>{const b=e.target.closest('.edit');if(b)openForm(data.find(c=>c.id===Number(b.dataset.id)))};campaignForm.onsubmit=async e=>{e.preventDefault();const id=campaignId.value,payload={productName:productName.value,productUrl:productUrl.value,rewardCoins:rewardCoins.value,commissionPercent:commissionPercent.value,maxVideos:maxVideos.value,status:status.value,requirements:requirements.value};try{await api(id?'/api/admin/affiliates/campaigns/'+id:'/api/admin/affiliates/campaigns',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});modal.classList.remove('open');message.textContent='Campanha salva com sucesso.';await load()}catch(err){message.textContent=err.message}};load();</script></body></html>
