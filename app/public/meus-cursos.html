<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus cursos | VitrineCity</title><style>
:root{--navy:#08275c;--blue:#1268ed;--gold:#ffbd19;--line:#dbe5f3;--muted:#60728e;--green:#1d8b57}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui;color:#14294d;background:#f3f7fd}header{min-height:72px;padding:12px 6%;display:flex;gap:15px;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}a{color:var(--blue)}main{max-width:960px;margin:auto;padding:42px 20px}.card{margin:15px 0;padding:22px;background:#fff;border:1px solid var(--line);border-radius:18px}h1,h2,h3{color:var(--navy)}.muted{color:var(--muted)}.button{display:inline-block;padding:12px 15px;border:0;border-radius:11px;background:var(--blue);color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.materials{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}.lesson-row,.file{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #edf2f8}.lesson-row div{padding-right:12px}.lesson-row b{display:block}.lesson-row small{color:var(--muted)}.lesson-row button{white-space:nowrap}.file a{font-weight:750;text-decoration:none}.size{font-size:12px;color:var(--muted);white-space:nowrap}.progress{margin:10px 0 18px;padding:16px;background:#edf5ff;border-radius:14px}.bar{height:9px;margin:9px 0;background:#d6e3f4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.certificate{display:inline-block;margin-top:6px;padding:10px 13px;background:linear-gradient(135deg,#e6a900,#ffc936);color:#17345d;border-radius:10px;font-weight:900;text-decoration:none}.reader{display:none;margin-top:25px;padding:clamp(20px,4vw,40px);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px #15396f15}.reader.open{display:block}.reader-top{display:flex;gap:15px;justify-content:space-between;align-items:flex-start}.reader h2{font-size:clamp(28px,5vw,42px);line-height:1.12;margin:8px 0}.objective{padding:16px;border-left:5px solid var(--gold);background:#fff9e7;border-radius:0 12px 12px 0}.section{margin:30px 0}.section h3{font-size:23px;margin-bottom:8px}.section p{color:#405575}.checklist{padding:20px 20px 20px 40px;border-radius:15px;background:#edf6ff}.activity{padding:20px;border-radius:15px;background:#eaf8ef;color:#17613e}.done{background:var(--green)}.status{font-size:13px;color:#1d7c50;font-weight:800}.hidden{display:none}@media(max-width:650px){.lesson-row{align-items:flex-start;flex-direction:column}.lesson-row button{width:100%}.reader-top{flex-direction:column-reverse}.reader-top button{align-self:flex-end}}
.steps{display:grid;gap:12px;counter-reset:steps;margin:22px 0}.step{position:relative;padding:17px 18px 17px 58px;border:1px solid #cddff5;border-radius:14px;background:#f8fbff}.step:before{counter-increment:steps;content:counter(steps);position:absolute;left:17px;top:17px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:#fff;font-weight:900}.step b{display:block}.step small{color:var(--muted)}.criteria{padding:18px;border-radius:15px;background:#fff4d6;color:#674b00}
</style><script src="/analytics.js" defer></script><script src="/openai-ads.js" defer></script></head><body><header><b>VitrineCity Educação</b><div><a href="/centro-educacional.html">Catálogo</a> · <a href="/minha-conta.html">Minha conta</a></div></header><main>
<section id="library"><h1>Meus cursos</h1><p class="muted">Seu progresso fica salvo na conta. Ao concluir todas as aulas, você poderá emitir seu certificado nominal.</p><div id="list"><div class="card">Carregando…</div></div></section>
<article class="reader" id="reader" aria-live="polite"><div class="reader-top"><div><span class="status" id="course-name"></span><h2 id="lesson-title"></h2><p class="muted" id="lesson-duration"></p></div><button class="button" id="close-reader">Voltar às aulas</button></div><p class="objective" id="lesson-objective"></p><div id="lesson-content"></div><button class="button done" id="complete-lesson">Marcar aula como concluída</button></article>
</main><script>
const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const size=value=>value>1048576?`${(value/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(value/1024))} KB`;
const reader=document.querySelector('#reader'),library=document.querySelector('#library'),progressByCourse=new Map();let currentCourseSlug='',currentLessonSlug='';
function completed(courseSlug,lessonSlug){return(progressByCourse.get(courseSlug)?.completedLessonSlugs||[]).includes(lessonSlug)}
function updateComplete(){const done=completed(currentCourseSlug,currentLessonSlug);document.querySelector('#complete-lesson').textContent=done?'Aula concluída ✓':'Marcar aula como concluída'}
function progressBlock(slug,progress){const percent=progress.totalLessons?Math.round(progress.completedCount*100/progress.totalLessons):0;return `<div class="progress" data-progress="${escapeHtml(slug)}"><b>Progresso: ${progress.completedCount} de ${progress.totalLessons} aulas</b><div class="bar"><i style="width:${percent}%"></i></div>${progress.certificateEligible?`<a class="certificate" href="/certificado.html?curso=${encodeURIComponent(slug)}">🏅 Emitir certificado</a>`:'<small>Conclua todas as aulas para liberar o certificado.</small>'}</div>`}
async function saveCompletion(){const response=await fetch(`/api/my-courses/${encodeURIComponent(currentCourseSlug)}/progress`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lessonSlug:currentLessonSlug,completed:true})}),data=await response.json();if(!response.ok)throw new Error(data.error);progressByCourse.set(currentCourseSlug,data);updateComplete();document.querySelectorAll('[data-lesson]').forEach(button=>{if(button.dataset.lesson===currentCourseSlug+':'+currentLessonSlug)button.textContent='Rever aula ✓'});const box=document.querySelector(`[data-progress="${currentCourseSlug}"]`);if(box)box.outerHTML=progressBlock(currentCourseSlug,data)}
document.querySelector('#complete-lesson').onclick=async()=>{try{await saveCompletion()}catch(error){alert(error.message||'Não foi possível salvar o progresso.')}};
document.querySelector('#close-reader').onclick=()=>{reader.classList.remove('open');library.classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};
async function openLesson(courseSlug,lessonSlug){try{const response=await fetch(`/api/my-courses/${encodeURIComponent(courseSlug)}/lessons/${encodeURIComponent(lessonSlug)}`),data=await response.json();if(!response.ok)throw new Error(data.error);currentCourseSlug=courseSlug;currentLessonSlug=lessonSlug;document.querySelector('#course-name').textContent=data.course.title;document.querySelector('#lesson-title').textContent=data.lesson.title;document.querySelector('#lesson-duration').textContent=`Tempo estimado: ${data.lesson.duration}`;document.querySelector('#lesson-objective').innerHTML=`<b>Objetivo:</b> ${escapeHtml(data.lesson.objective)}`;const content=document.querySelector('#lesson-content');content.innerHTML='';data.lesson.sections.forEach(section=>{const box=document.createElement('section');box.className='section';const title=document.createElement('h3');title.textContent=section.title;box.append(title);section.paragraphs.forEach(value=>{const p=document.createElement('p');p.textContent=value;box.append(p)});content.append(box)});if(data.lesson.steps?.length){const steps=document.createElement('section');steps.innerHTML='<h3>Passo a passo</h3><div class="steps">'+data.lesson.steps.map(step=>`<div class="step"><b>${escapeHtml(step.instruction)}</b><small>${escapeHtml(step.evidence)}</small></div>`).join('')+'</div>';content.append(steps)}const checklist=document.createElement('section');checklist.className='checklist';checklist.innerHTML='<b>Lista de verificação</b>';const ul=document.createElement('ul');data.lesson.checklist.forEach(value=>{const li=document.createElement('li');li.textContent=value;ul.append(li)});checklist.append(ul);content.append(checklist);const activity=document.createElement('section');activity.className='activity';activity.innerHTML=`<b>Atividade prática</b><p>${escapeHtml(data.lesson.activity)}</p>${data.lesson.practicalExample?`<p><b>Modelo:</b> ${escapeHtml(data.lesson.practicalExample)}</p>`:''}`;content.append(activity);if(data.lesson.completionCriteria){const criteria=document.createElement('p');criteria.className='criteria';criteria.innerHTML=`<b>Critério de conclusão:</b> ${escapeHtml(data.lesson.completionCriteria)}`;content.append(criteria)}updateComplete();library.classList.add('hidden');reader.classList.add('open');scrollTo({top:0,behavior:'smooth'})}catch(error){alert(error.message||'Não foi possível abrir a aula.')}}
async function showMaterials(slug,target,button){button.disabled=true;button.textContent='Carregando…';try{const [materialsResponse,progressResponse]=await Promise.all([fetch(`/api/my-courses/${encodeURIComponent(slug)}/materials`),fetch(`/api/my-courses/${encodeURIComponent(slug)}/progress`)]),materials=await materialsResponse.json(),progress=await progressResponse.json();if(!materialsResponse.ok)throw new Error(materials.error);target.innerHTML='';if(progressResponse.ok){progressByCourse.set(slug,progress);target.innerHTML=progressBlock(slug,progress)}materials.lessons.forEach(item=>{const row=document.createElement('div');row.className='lesson-row';const info=document.createElement('div');const title=document.createElement('b');title.textContent=item.title;const details=document.createElement('small');details.textContent=`${item.duration} · ${item.objective}`;info.append(title,details);const open=document.createElement('button');open.className='button';open.dataset.lesson=`${slug}:${item.slug}`;open.textContent=completed(slug,item.slug)?'Rever aula ✓':'Abrir aula';open.onclick=()=>openLesson(slug,item.slug);row.append(info,open);target.append(row)});materials.files.forEach(file=>{const row=document.createElement('div');row.className='file';row.innerHTML=`<a target="_blank" rel="noopener" href="/api/my-courses/${encodeURIComponent(slug)}/material?path=${encodeURIComponent(file.path)}">${escapeHtml(file.name)}</a><span class="size">${size(file.size)}</span>`;target.append(row)});if(!materials.lessons.length&&!materials.files.length)target.innerHTML='<p class="muted">Os materiais ainda estão sendo preparados.</p>';button.remove()}catch(error){target.innerHTML=`<p class="muted">${escapeHtml(error.message||'Não foi possível carregar.')}</p>`;button.disabled=false;button.textContent='Tentar novamente'}}
async function load(){const list=document.querySelector('#list');try{const response=await fetch('/api/my-courses'),data=await response.json();if(!response.ok)throw new Error(data.error);list.innerHTML=data.courses.length?'':'<div class="card">Você ainda não possui cursos. <a href="/centro-educacional.html">Conheça o catálogo</a>.</div>';data.courses.forEach(course=>{const box=document.createElement('div');box.className='card';const title=document.createElement('h2');title.textContent=course.course_title;const status=document.createElement('p');status.textContent=course.contentReady?'Acesso ativo e protegido.':'Pagamento registrado; conteúdo em preparação segura.';box.append(title,status);if(course.contentReady){const button=document.createElement('button');button.className='button';button.textContent='Abrir aulas e materiais';const materials=document.createElement('div');materials.className='materials';button.onclick=()=>showMaterials(course.course_slug,materials,button);box.append(button,materials)}list.append(box)})}catch{list.innerHTML='<div class="card">Entre na sua conta para ver os cursos. <a class="button" href="/entrar.html?returnTo=%2Fmeus-cursos.html">Entrar ou criar conta</a></div>'}}load();
</script></body></html>
