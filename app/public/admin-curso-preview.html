<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia do curso | VitrineCity</title><style>:root{--navy:#07162e;--panel:#10203b;--line:#29405f;--text:#f7f9ff;--muted:#adbbcf;--blue:#3987ff}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:#9bc5ff;text-decoration:none}header{padding:18px max(20px,4vw);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.wrap{width:min(1040px,92%);margin:30px auto 70px}.notice{padding:12px 16px;border-radius:12px;background:#17365f;color:#cfe3ff;margin-bottom:20px}.hero{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}.cover{width:100%;height:280px;object-fit:cover;background:#17365f}.copy{padding:26px}h1{font-size:clamp(30px,5vw,54px);margin:4px 0 12px}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#1d385d}.video{width:100%;max-height:580px;margin-top:20px;border-radius:14px;background:#000}.lessons{display:grid;gap:12px;margin-top:24px}.lesson{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.lesson h3{margin:0 0 8px}.lesson p{color:var(--muted);line-height:1.55}.btn{display:inline-flex;padding:11px 15px;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;margin:8px 8px 0 0}</style></head><body><header><strong>Prévia administrativa</strong><a href="/admin-cursos.html">← Voltar aos cursos</a></header><main class="wrap"><div class="notice">Esta visualização é exclusiva do administrador e simula a experiência do aluno sem realizar uma compra.</div><div id="content">Carregando curso…</div></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),slug=new URLSearchParams(location.search).get('slug');async function load(){const r=await fetch('/api/admin/courses/'+encodeURIComponent(slug||'')+'/preview'),d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/carteira.html?admin=1';return}if(!r.ok){content.textContent=d.error||'Curso não encontrado.';return}const c=d.course;content.innerHTML=`<section class="hero">${c.coverUrl?`<img class="cover" src="${esc(c.coverUrl)}" alt="Capa do curso">`:''}<div class="copy"><small>${esc(c.status).toUpperCase()}</small><h1>${esc(c.title)}</h1><p>${esc(c.description||'Sem descrição cadastrada.')}</p><div class="meta"><span class="pill">${c.modules} módulos</span><span class="pill">${(c.priceCents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</span><span class="pill">${esc(c.audience||'Público não informado')}</span></div>${c.videoUrl?`<video class="video" src="${esc(c.videoUrl)}" controls></video>`:''}${c.materialUrl?`<a class="btn" href="${esc(c.materialUrl)}" target="_blank" rel="noopener">Abrir material do curso</a>`:''}</div></section><section class="lessons"><h2>Aulas como o aluno verá</h2>${d.lessons.map((l,i)=>`<article class="lesson"><small>AULA ${i+1} · ${esc(l.duration||'')}</small><h3>${esc(l.title)}</h3><p>${esc(l.objective||l.content||'Conteúdo cadastrado.')}</p></article>`).join('')||'<article class="lesson"><h3>Nenhuma aula detalhada cadastrada</h3><p>Adicione vídeo ou material na edição do curso.</p></article>'}</section>`}load();</script></body></html>
