<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia do curso | VitrineCity</title><style>
:root{--navy:#07162e;--panel:#10203b;--line:#29405f;--text:#f7f9ff;--muted:#adbbcf;--blue:#3987ff;--gold:#ffc848}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif}a{color:#9bc5ff;text-decoration:none}header{padding:18px max(20px,4vw);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.wrap{width:min(1080px,92%);margin:30px auto 70px}.notice{padding:12px 16px;border-radius:12px;background:#17365f;color:#cfe3ff;margin-bottom:20px}.hero,.lesson{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}.cover{width:100%;height:340px;object-fit:cover}.copy,.lesson{padding:26px}h1{font-size:clamp(30px,5vw,54px);margin:4px 0 12px;line-height:1.08}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#1d385d}.lessons{display:grid;gap:16px;margin-top:24px}.lesson h3{font-size:25px;margin:4px 0}.lesson h4{color:#a9d0ff;margin:22px 0 5px}.lesson p{color:var(--muted)}.objective{border-left:4px solid var(--gold);padding:10px 14px;background:#172c4b}.steps{display:grid;gap:9px;counter-reset:item}.step{position:relative;padding:13px 14px 13px 52px;background:#172c4b;border-radius:12px}.step:before{counter-increment:item;content:counter(item);position:absolute;left:14px;top:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--blue);font-weight:900}.activity{padding:15px;border-radius:12px;background:#143c35;color:#caffec}.btn{display:inline-flex;padding:11px 15px;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;margin-top:8px}
</style></head><body><header><strong>Prévia administrativa</strong><a href="/admin-cursos.html">← Voltar aos cursos</a></header>
<main class="wrap"><div class="notice">Esta visualização exclusiva simula a experiência completa do aluno, sem realizar compra.</div><div id="content">Carregando curso…</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const slug=new URLSearchParams(location.search).get('slug');
function lessonHtml(l,i){return `<article class="lesson"><small>AULA ${i+1} · ${esc(l.duration||'')}</small><h3>${esc(l.title)}</h3><p class="objective"><b>Objetivo:</b> ${esc(l.objective)}</p>${(l.sections||[]).map(s=>`<section><h4>${esc(s.title)}</h4>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</section>`).join('')}${l.steps?.length?`<h4>Passo a passo</h4><div class="steps">${l.steps.map(s=>`<div class="step"><b>${esc(s.instruction)}</b><br><small>${esc(s.evidence)}</small></div>`).join('')}</div>`:''}<h4>Lista de verificação</h4><ul>${(l.checklist||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="activity"><b>Atividade prática</b><br>${esc(l.activity)}</div><p><b>Critério de conclusão:</b> ${esc(l.completionCriteria||'Concluir a atividade prática.')}</p></article>`}
async function load(){const r=await fetch('/api/admin/courses/'+encodeURIComponent(slug||'')+'/preview'),d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/carteira.html?admin=1';return}if(!r.ok){content.textContent=d.error||'Curso não encontrado.';return}const c=d.course;content.innerHTML=`<section class="hero">${c.coverUrl?`<img class="cover" src="${esc(c.coverUrl)}" alt="Capa do curso">`:''}<div class="copy"><small>${esc(c.status).toUpperCase()}</small><h1>${esc(c.title)}</h1><p>${esc(c.description||'Sem descrição cadastrada.')}</p><div class="meta"><span class="pill">${c.modules} módulos</span><span class="pill">${(c.priceCents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</span><span class="pill">${esc(c.audience||'Público não informado')}</span></div><p><b>Metodologia:</b> ${esc(d.methodology)}</p>${c.videoUrl?`<video class="video" src="${esc(c.videoUrl)}" controls></video>`:''}${c.materialUrl?`<a class="btn" href="${esc(c.materialUrl)}" target="_blank" rel="noopener">Abrir material do curso</a>`:''}</div></section><section class="lessons"><h2>Aulas como o aluno verá</h2>${d.lessons.map(lessonHtml).join('')||'<article class="lesson">Nenhuma aula cadastrada.</article>'}</section>`}load();
</script></body></html>
