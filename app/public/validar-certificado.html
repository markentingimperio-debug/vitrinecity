<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validar certificado | VitrineCity</title><style>body{margin:0;background:#eef4fc;color:#102b5c;font:16px/1.5 system-ui}main{max-width:650px;margin:70px auto;padding:32px;background:#fff;border:1px solid #d9e5f5;border-radius:22px;box-shadow:0 20px 50px #15396f15}h1{font-size:36px}label{display:block;font-weight:800;margin-bottom:7px}.row{display:flex;gap:9px}input{flex:1;padding:13px;border:1px solid #bfcfe5;border-radius:10px;font:inherit;text-transform:uppercase}button{border:0;border-radius:10px;padding:13px 17px;background:#1268ed;color:#fff;font-weight:850}.result{margin-top:22px;padding:18px;border-radius:14px;background:#edf8f2}.bad{background:#fff0f0;color:#912c2c}a{color:#1268ed}@media(max-width:600px){main{margin:20px}.row{flex-direction:column}}</style><script src="/analytics.js" defer></script></head><body><main><a href="/">VitrineCity</a><h1>Validar certificado</h1><p>Digite o código impresso no certificado.</p><label for="code">Código de validação</label><div class="row"><input id="code" placeholder="VC-XXXXXXXXXXXX"><button id="check">Verificar</button></div><div id="result"></div></main><script>
const input=document.querySelector('#code'),result=document.querySelector('#result');input.value=new URLSearchParams(location.search).get('codigo')||'';
async function check(){const code=input.value.trim();if(!code)return;result.className='result';result.textContent='Verificando…';try{const r=await fetch(`/api/certificates/${encodeURIComponent(code)}`),d=await r.json();if(!r.ok)throw new Error(d.error||'Certificado não encontrado.');const date=new Date(`${d.issuedAt.replace(' ','T')}Z`).toLocaleDateString('pt-BR');result.replaceChildren();const title=document.createElement('b');title.textContent='✓ Certificado válido';result.append(title,document.createElement('br'),document.createTextNode(d.holderName),document.createElement('br'),document.createTextNode(d.courseTitle),document.createElement('br'),document.createTextNode(`Emitido em ${date}`),document.createElement('br'),document.createTextNode('Certificado de curso livre.'))}catch(e){result.className='result bad';result.textContent=e.message}}document.querySelector('#check').onclick=check;if(input.value)check();
</script></body></html>
