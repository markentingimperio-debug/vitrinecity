<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VitrineCity — Cidade Premium</title>
  <style>
    :root{--navy:#09275d;--blue:#1768e6;--gold:#ffc628}*{box-sizing:border-box}body{margin:0;background:#07182f;font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}header{height:72px;position:fixed;z-index:8;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#ffffffed;color:var(--navy);backdrop-filter:blur(12px)}.brand{font-size:25px;font-weight:900}.brand i{display:inline-block;width:26px;height:26px;margin-right:8px;vertical-align:-5px;border-radius:8px 8px 3px 3px;background:var(--blue)}header a{color:var(--blue);font-size:14px;font-weight:900;text-decoration:none}.city{height:100vh;min-height:630px;padding-top:72px;position:relative;background:linear-gradient(90deg,#07182f77,#07182f05 48%,#07182f22),url('/assets/cidade-premium.jpg') center/cover no-repeat}.intro{position:absolute;z-index:4;top:104px;left:5%;width:min(355px,calc(100vw - 32px));padding:23px;border-radius:20px;background:#fffffff0;color:var(--navy);box-shadow:0 20px 54px #03112666}.intro b{display:inline-block;padding:7px 10px;border-radius:99px;background:#dcecff;color:#1554b4;font-size:11px}.intro h1{margin:12px 0 8px;font-size:35px;line-height:1.02}.intro p{margin:0;color:#557093;font-size:14px;line-height:1.5}.hotspot{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;border:2px solid #fff;color:#fff;background:#1768e6e8;border-radius:99px;padding:10px 14px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px #06193c88;transition:.2s}.hotspot:hover{transform:translateY(-3px) scale(1.03)}.hotspot:after{content:'';position:absolute;left:50%;top:100%;height:32px;border-left:2px dashed #fff;opacity:.9}.hotspot.country{left:9%;bottom:29%;background:#83512e}.hotspot.moda{left:34%;top:25%;background:#7f51b5}.hotspot.praca{left:49%;top:42%;background:#1768e6}.hotspot.servicos{right:11%;top:40%;background:#1768e6}.hotspot.lote{right:8%;bottom:13%;background:#d88d00}.hotspot.outdoor{right:6%;top:18%;background:#b04771}.help{position:absolute;z-index:4;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 17px;border-radius:99px;background:#061d44df;color:#fff;font-size:13px;white-space:nowrap}.panel{display:none;position:fixed;z-index:10;right:20px;top:92px;width:min(350px,calc(100vw - 40px));padding:21px;border-radius:20px;background:#fff;color:var(--navy);box-shadow:0 22px 60px #020d2177}.panel.show{display:block}.panel button{float:right;border:0;border-radius:8px;width:30px;height:30px;background:#eaf3ff;font-size:18px;cursor:pointer}.panel small{color:var(--blue);font-weight:900}.panel h2{margin:10px 0;font-size:26px}.panel p{color:#557093;font-size:14px;line-height:1.5}.panel a{display:block;margin-top:14px;padding:13px;border-radius:11px;background:var(--blue);text-align:center;text-decoration:none;color:#fff;font-weight:900}@media(max-width:700px){.city{background-position:57% center}.intro{top:88px;left:14px;padding:16px;max-width:255px}.intro h1{font-size:25px}.intro p{font-size:12px}.hotspot{font-size:10px;padding:8px 10px}.hotspot.country{left:3%;bottom:24%}.hotspot.moda{left:29%;top:31%}.hotspot.praca{left:47%;top:48%}.hotspot.servicos{right:2%;top:43%}.hotspot.lote{right:4%;bottom:17%}.hotspot.outdoor{right:2%;top:22%}.help{font-size:10px;max-width:94%;white-space:normal;text-align:center}.panel{right:12px;top:auto;bottom:14px}}
  </style>
<script src="/analytics.js" defer></script></head>
<body>
  <header><div class="brand"><i></i>VitrineCity <small style="font-size:12px;color:#1768e6">PREMIUM</small></div><a href="/">← Página inicial</a></header>
  <main class="city">
    <section class="intro"><b>CIDADE VITRINE • FASE 1</b><h1>Uma cidade de verdade para explorar.</h1><p>Ande pelas avenidas, descubra lojas e encontre espaços para sua marca na VitrineCity.</p></section>
    <button class="hotspot country" data-tag="LOJA MODELO" data-name="Sertaneja Moda Country" data-desc="A primeira loja-modelo da cidade: fachada country premium, vitrine de roupas e letreiro de promoções.">★ Sertaneja Moda Country</button>
    <button class="hotspot moda" data-tag="AVENIDA DA MODA" data-name="Galeria Vitrine" data-desc="Lojas de moda, calçados, acessórios e vitrines com alto movimento.">Moda</button>
    <button class="hotspot praca" data-tag="PRAÇA CENTRAL" data-name="Praça VitrineCity" data-desc="O coração da cidade: fonte, eventos, campanhas especiais e experiências para visitantes.">Praça Central</button>
    <button class="hotspot servicos" data-tag="SERVIÇOS" data-name="Centro de Serviços" data-desc="Empresas, profissionais e negócios locais em uma área de destaque.">Serviços</button>
    <button class="hotspot lote" data-tag="LOTE PREMIUM DISPONÍVEL" data-name="Lote Avenida 021" data-desc="Seu comércio pode ocupar este ponto privilegiado da Avenida Principal.">Lote disponível</button>
    <button class="hotspot outdoor" data-tag="MÍDIA DIGITAL" data-name="Outdoor da Cidade" data-desc="Espaço para campanhas patrocinadas, lançamentos e promoções especiais.">Outdoor</button>
    <div class="help">Clique nos pontos da cidade para conhecer cada espaço.</div>
  </main>
  <aside class="panel" id="panel"><button id="close">×</button><small id="tag"></small><h2 id="name"></h2><p id="description"></p><a href="/#cadastro">Tenho interesse</a></aside>
  <script>const p=document.getElementById('panel');document.querySelectorAll('.hotspot').forEach(x=>x.onclick=()=>{tag.textContent=x.dataset.tag;name.textContent=x.dataset.name;description.textContent=x.dataset.desc;p.classList.add('show')});close.onclick=()=>p.classList.remove('show');</script>
</body>
</html>
