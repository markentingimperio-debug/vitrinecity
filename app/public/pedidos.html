<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meus pedidos — Vitriny</title>
  <style>
    body{margin:0;background:#07101d;color:#f5f8ff;font-family:Inter,Arial,sans-serif}header,main{max-width:960px;margin:auto;padding:22px}a{color:#6eabff}.card{background:#101d34;border:1px solid #263b5b;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:15px}.badge{background:#18345e;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.muted{color:#9caec7}.item{padding:9px 0;border-top:1px solid #263b5b}.button{border:1px solid #4675b6;border-radius:10px;background:#17365f;color:#fff;padding:9px 13px;font-weight:800;cursor:pointer}.return{margin-top:14px;padding:12px;border-radius:12px;background:#142844}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:16px 0}.timeline-step{border-top:4px solid #344967;padding-top:7px;color:#8295b2;font-size:11px;text-align:center}.timeline-step.done{border-color:#35cf8d;color:#dfffee}.timeline-step.current{border-color:#ffc628;color:#fff;font-weight:900}.delivery-map{height:260px;border-radius:14px;background:#172943;margin-top:12px;overflow:hidden}.map-note{font-size:12px;color:#a9bad2;margin-top:7px}@media(max-width:550px){.row{display:block}.badge{display:inline-block;margin-top:8px}.timeline{grid-template-columns:repeat(3,1fr);row-gap:13px}}
  </style>
  <style>.delivery-review{margin-top:14px;padding:14px;border:1px solid #35567f;border-radius:13px;background:#0d213c}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.delivery-review label{display:block;font-weight:800;margin:8px 0}.delivery-review input,.delivery-review textarea{width:100%;box-sizing:border-box;border:1px solid #4675b6;border-radius:9px;background:#07182c;color:#fff;padding:10px}.delivery-review textarea{min-height:80px}.reward-note{color:#ffd76c;font-weight:800}@media(max-width:550px){.review-grid{grid-template-columns:1fr}}</style>
</head>
<body>
  <header><a href="/loja">← Voltar à loja</a><h1>Meus pedidos</h1><p class="muted">Pagamento, nota fiscal, etiqueta e rastreamento em um só lugar.</p></header>
  <main><section class="card" aria-labelledby="customer-chat-title"><h2 id="customer-chat-title">Fale com a VitrineCity</h2><p class="muted">Tire dúvidas sobre seus pedidos com nossa equipe.</p><div data-profile-chat="customer"></div></section><div id="orders">Carregando...</div></main>
  <script src="/profile-chat.js"></script>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=v=>(v/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const labels={pending:'Aguardando',approved:'Pagamento aprovado',fiscal_pending:'Aguardando NF-e',label_pending:'Aguardando etiqueta',label_ready:'Etiqueta pronta',shipped:'Enviado',delivered:'Entregue',cancel_requested:'Cancelamento solicitado',cancelled:'Cancelado'};
    const deliveryLabels={awaiting_payment:'Aguardando pagamento',available:'Buscando entregador',assigned:'Entregador a caminho da loja',picked_up:'Pedido saiu para entrega',delivered:'Entregador marcou como entregue',cancelled:'Entrega cancelada'};
    const returnLabels={requested:'Devolução solicitada',approved:'Devolução aprovada',rejected:'Devolução recusada',received:'Produto devolvido',refunded:'Valor reembolsado'};
    const timelineLabels=['Pagamento aprovado','Preparando','Pronto','Coletado','Saiu para entrega','Entregue'];let mapsPromise=null,ordersLoading=false;
    function orderTimelineIndex(order){const job=order.localDelivery?.status,status=order.fulfillment_status;if(job==='delivered'||status==='delivered')return 5;if(job==='picked_up'||status==='out_for_delivery')return 4;if(status==='food_handed_off')return 3;if(status==='food_ready')return 2;if(['food_accepted','food_preparing'].includes(status))return 1;if(order.payment_status==='approved')return 0;return-1}
    function realtimeBlock(order){if(order.payment_status!=='approved'||!order.localDelivery)return'';const current=orderTimelineIndex(order),location=order.deliveryTracking?.location||order.localDelivery.courierLocation||order.localDelivery.location||order.courierLocation,last=location?.capturedAt||location?.updatedAt||location?.updated_at;return `<section class="order-realtime" data-realtime-order="${esc(order.reference)}"><div class="timeline" aria-label="Andamento do pedido">${timelineLabels.map((label,index)=>`<div class="timeline-step ${index<current?'done':index===current?'current':''}">${index<=current?'✓ ':''}${label}</div>`).join('')}</div>${current>=3&&current<5&&Number.isFinite(Number(location?.latitude))&&Number.isFinite(Number(location?.longitude))?`<div class="delivery-map" data-lat="${Number(location.latitude)}" data-lng="${Number(location.longitude)}" aria-label="Posição atual do entregador"></div><div class="map-note">Última atualização: ${last?new Date(String(last).endsWith('Z')?last:last+'Z').toLocaleString('pt-BR'):'agora'}</div>`:''}</section>`}
    function deliveryReviewBlock(order){if(!order.customerConfirmedAt)return'';const review=order.deliveryReview||order.review;if(review||order.alreadyReviewed){const moderation=review?.status==='pending_moderation'||review?.moderationStatus==='pending'?'<span class="badge">Em moderação</span>':'';return `<section class="delivery-review"><b>Já avaliado ✓</b> ${moderation}<p class="muted">Loja: ${Number(review?.storeRating||0)}★ · Entregador: ${Number(review?.courierRating||0)}★</p>${review?.rewardGranted?'<p class="reward-note">5 moedas recebidas.</p>':''}</section>`}return `<form class="delivery-review" data-delivery-review="${esc(order.reference)}"><h3>Como foi seu pedido?</h3><p class="reward-note">Ganhe uma recompensa única de 5 moedas ao completar as duas avaliações.</p><div class="review-grid"><label>Avaliar loja (1–5 estrelas)<input name="storeRating" type="number" min="1" max="5" step="1" required></label><label>Avaliar entregador (1–5 estrelas)<input name="courierRating" type="number" min="1" max="5" step="1" required></label></div><label>Comentário<textarea name="comment" minlength="3" maxlength="1000" required placeholder="Conte como foi sua experiência"></textarea></label><button class="button" type="submit">Enviar avaliação</button><p class="muted" data-review-message></p></form>`}
    async function loadGoogleMaps(){if(window.google?.maps)return window.google.maps;if(mapsPromise)return mapsPromise;mapsPromise=fetch('/api/maps/config',{cache:'no-store'}).then(response=>response.json()).then(config=>{if(!config.enabled||!config.apiKey)throw new Error('maps_disabled');return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(config.apiKey)}&v=weekly`;script.onload=()=>resolve(window.google.maps);script.onerror=reject;document.head.append(script)})});return mapsPromise}
    async function renderCourierMaps(){const containers=[...document.querySelectorAll('.delivery-map')];if(!containers.length)return;try{await loadGoogleMaps();for(const container of containers){const position={lat:Number(container.dataset.lat),lng:Number(container.dataset.lng)},map=new google.maps.Map(container,{center:position,zoom:16,mapTypeControl:false,streetViewControl:false,fullscreenControl:false});new google.maps.Marker({map,position,title:'Entregador VC Entregas'})}}catch{containers.forEach(container=>container.innerHTML='<p class="muted" style="padding:15px">Mapa temporariamente indisponível.</p>')}}
    function decorateRealtime(orderList){document.querySelectorAll('#orders .card').forEach((card,index)=>{const order=orderList[index];if(order&&!card.querySelector('.order-realtime'))card.insertAdjacentHTML('beforeend',realtimeBlock(order));if(order&&!card.querySelector('.delivery-review'))card.insertAdjacentHTML('beforeend',deliveryReviewBlock(order))});renderCourierMaps()}
    async function loadOrders(){
      if(ordersLoading)return;ordersLoading=true;
      const response=await fetch('/api/marketplace/orders',{cache:'no-store'}),data=await response.json();
      if(response.status===401)return location.href='/carteira.html?redirect='+encodeURIComponent('/pedidos.html');
      orders.innerHTML=data.orders?.map(order=>{
        const currentReturn=order.returns?.[0];
        const canReturn=order.payment_status==='approved'&&['shipped','delivered'].includes(order.fulfillment_status)&&!order.returns?.some(item=>['requested','approved','received'].includes(item.status));
        return `<article class="card"><div class="row"><div><b>Pedido ${esc(order.reference.slice(-8).toUpperCase())}</b><div class="muted">${esc(order.store_name)} · ${new Date(order.created_at+'Z').toLocaleString('pt-BR')}</div></div><span class="badge">${esc(labels[order.fulfillment_status]||order.fulfillment_status)}</span></div><h2>${money(order.total_cents)}</h2>${order.items.map(item=>`<div class="item">${item.quantity} × ${esc(item.product_name)} — ${money(item.subtotal_cents)}</div>`).join('')}${order.localDelivery?`<div class="return"><b>VC Entregas</b><p>${esc(deliveryLabels[order.localDelivery.status]||order.localDelivery.status)}</p>${order.customerConfirmedAt?'<p class="muted">Recebimento confirmado por você.</p>':''}${order.canConfirmDelivery?`<button class="button" type="button" data-confirm-delivery="${esc(order.reference)}">Confirmar recebimento</button>`:''}</div>`:''}${order.tracking_code?`<p>Rastreamento: <b>${esc(order.tracking_code)}</b></p>`:''}${currentReturn?`<div class="return"><b>${esc(returnLabels[currentReturn.status]||currentReturn.status)}</b><p>${esc(currentReturn.reason)}</p>${currentReturn.seller_note?`<p class="muted">Resposta da loja: ${esc(currentReturn.seller_note)}</p>`:''}</div>`:''}${canReturn?`<p><button class="button" type="button" data-return-order="${esc(order.reference)}">Solicitar devolução</button></p>`:''}</article>`;
      }).join('')||'<div class="card">Você ainda não possui pedidos. <a href="/loja">Conhecer produtos</a></div>';decorateRealtime(data.orders||[]);ordersLoading=false;
    }
    orders.addEventListener('submit',async event=>{const form=event.target.closest('[data-delivery-review]');if(!form)return;event.preventDefault();const message=form.querySelector('[data-review-message]'),button=form.querySelector('button[type="submit"]'),values=new FormData(form),body={storeRating:Number(values.get('storeRating')),courierRating:Number(values.get('courierRating')),comment:String(values.get('comment')||'').trim()};if(!Number.isInteger(body.storeRating)||!Number.isInteger(body.courierRating)||body.storeRating<1||body.storeRating>5||body.courierRating<1||body.courierRating>5){message.textContent='Escolha de 1 a 5 estrelas para a loja e o entregador.';return}button.disabled=true;message.textContent='Enviando avaliação...';const response=await fetch(`/api/marketplace/orders/${encodeURIComponent(form.dataset.deliveryReview)}/delivery-review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json().catch(()=>({}));if(!response.ok){message.textContent=data.error||'Não foi possível enviar a avaliação.';button.disabled=false;return}message.textContent=data.rewardGranted?'Avaliação enviada. Você recebeu 5 moedas!':'Avaliação enviada para moderação.';await loadOrders()});
    orders.addEventListener('click',async event=>{
      const deliveryReference=event.target.dataset.confirmDelivery;if(deliveryReference){if(!confirm('Confirmar que você recebeu este pedido?'))return;event.target.disabled=true;const response=await fetch(`/api/marketplace/orders/${encodeURIComponent(deliveryReference)}/confirm-delivery`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),data=await response.json().catch(()=>({}));alert(data.error||'Recebimento confirmado. O valor da entrega será liberado ao entregador.');await loadOrders();return}
      const reference=event.target.dataset.returnOrder;if(!reference)return;
      const reason=prompt('Explique o motivo da devolução (mínimo de 10 caracteres):');if(!reason)return;
      const response=await fetch(`/api/marketplace/orders/${encodeURIComponent(reference)}/returns`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})}),data=await response.json();
      alert(data.error||'Solicitação de devolução enviada para a loja.');if(response.ok)loadOrders();
    });
    loadOrders().catch(()=>{ordersLoading=false});async function pollOrders(){try{if(document.visibilityState==='visible')await loadOrders()}catch{ordersLoading=false}finally{setTimeout(pollOrders,12000)}}setTimeout(pollOrders,12000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadOrders().catch(()=>{ordersLoading=false})});
  </script>
</body>
</html>
