<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus pedidos — Vitriny</title><style>body{margin:0;background:#07101d;color:#f5f8ff;font-family:Inter,Arial,sans-serif}header,main{max-width:960px;margin:auto;padding:22px}a{color:#6eabff}.card{background:#101d34;border:1px solid #263b5b;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:15px}.badge{background:#18345e;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.muted{color:#9caec7}.item{padding:9px 0;border-top:1px solid #263b5b}@media(max-width:550px){.row{display:block}.badge{display:inline-block;margin-top:8px}}</style></head><body><header><a href="/loja.html">← Voltar à loja</a><h1>Meus pedidos</h1><p class="muted">Pagamento, nota fiscal, etiqueta J&T e rastreamento em um só lugar.</p></header><main id="orders">Carregando...</main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>(v/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const labels={pending:'Aguardando',approved:'Pagamento aprovado',fiscal_pending:'Aguardando NF-e',label_pending:'Aguardando etiqueta',shipped:'Enviado',cancelled:'Cancelado'};(async()=>{const r=await fetch('/api/marketplace/orders'),d=await r.json();if(r.status===401)return location.href='/carteira.html?redirect='+encodeURIComponent('/pedidos.html');orders.innerHTML=d.orders?.map(o=>`<article class="card"><div class="row"><div><b>Pedido ${esc(o.reference.slice(-8).toUpperCase())}</b><div class="muted">${esc(o.store_name)} · ${new Date(o.created_at+'Z').toLocaleString('pt-BR')}</div></div><span class="badge">${esc(labels[o.fulfillment_status]||o.fulfillment_status)}</span></div><h2>${money(o.total_cents)}</h2>${o.items.map(i=>`<div class="item">${i.quantity} × ${esc(i.product_name)} — ${money(i.subtotal_cents)}</div>`).join('')}${o.tracking_code?`<p>Rastreamento: <b>${esc(o.tracking_code)}</b></p>`:''}</article>`).join('')||'<div class="card">Você ainda não possui pedidos. <a href="/loja.html">Conhecer produtos</a></div>'})()</script></body></html>
