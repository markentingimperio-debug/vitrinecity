<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fábrica de Crescimento | VitrineCity</title><meta name="description" content="Auditoria SEO, conteúdo e estrutura digital por assinatura para empresas crescerem na internet."><style>
:root{--navy:#061c45;--blue:#146ce8;--gold:#ffbf2f;--bg:#f4f7fb;--text:#10254a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}header{padding:22px max(22px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;background:#fff}header a{color:var(--blue)}.hero{padding:75px 24px;background:linear-gradient(135deg,var(--navy),#0759c9);color:#fff;text-align:center}.hero h1{font-size:clamp(38px,7vw,68px);max-width:900px;margin:0 auto 18px}.hero p{font-size:20px;max-width:760px;margin:auto;line-height:1.6}.wrap{max-width:1120px;margin:auto;padding:55px 24px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.plan{background:#fff;border:1px solid #d9e4f3;border-radius:22px;padding:28px;box-shadow:0 14px 35px #0d28500d}.plan.featured{border:2px solid var(--blue);transform:translateY(-8px)}.price{font-size:36px;font-weight:900}.price small{font-size:15px}.plan li{margin:11px 0}.plan button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;cursor:pointer}.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:#e8f1ff;color:#0759c9;font-weight:800;font-size:12px}.modal{position:fixed;inset:0;background:#06152bcc;display:grid;place-items:center;padding:20px}.modal.hidden{display:none}.box{background:#fff;border-radius:20px;padding:26px;width:min(520px,100%)}input{width:100%;padding:14px;border:1px solid #b9c7da;border-radius:10px;margin:7px 0 14px;font:inherit}.actions{display:flex;gap:10px}.secondary{background:#dce6f4!important;color:#17345d!important}.message{padding:12px;border-radius:10px;background:#fff2c7;margin-top:12px}.hidden{display:none}@media(max-width:800px){.plans{grid-template-columns:1fr}.plan.featured{transform:none}}
</style><script src="/openai-ads.js" defer></script></head><body><header><strong>▰ VitrineCity</strong><a href="/painel-crescimento.html">Área do assinante</a></header><section class="hero"><span class="tag">FÁBRICA DE CRESCIMENTO</span><h1>Sua empresa preparada para crescer todos os meses</h1><p>Diagnóstico, SEO, conteúdo e execução digital em um único ecossistema, com acompanhamento claro e assinatura mensal.</p></section><main class="wrap"><div class="plans" id="plans"></div></main>
<div class="modal hidden" id="modal"><div class="box"><h2>Começar assinatura</h2><p id="selected"></p><label>Nome da empresa<input id="business" required placeholder="Minha empresa"></label><label>Site atual (opcional)<input id="website" type="url" placeholder="https://minhaempresa.com.br"></label><div class="actions"><button class="secondary" id="close">Voltar</button><button id="checkout">Ir para pagamento</button></div><div id="message" class="message hidden"></div></div></div>
<script>
let chosen='';const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function load(){const d=await fetch('/api/growth/plans').then(r=>r.json());document.querySelector('#plans').innerHTML=d.plans.map((p,i)=>`<article class="plan ${i===1?'featured':''}"><span class="tag">${i===1?'MAIS ESCOLHIDO':'ASSINATURA MENSAL'}</span><h2>${p.name.replace('Fábrica ','')}</h2><div class="price">${money(p.amount)} <small>/mês</small></div><ul>${p.features.map(x=>`<li>${x}</li>`).join('')}</ul><button onclick="selectPlan('${p.code}','${p.name}',${p.amount})">Assinar agora</button></article>`).join('')}function selectPlan(code,name,amount){chosen=code;document.querySelector('#selected').textContent=name+' — '+money(amount)+' por mês';document.querySelector('#modal').classList.remove('hidden')}document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.add('hidden');document.querySelector('#checkout').onclick=async()=>{const b=document.querySelector('#checkout'),m=document.querySelector('#message');b.disabled=true;m.classList.add('hidden');try{const r=await fetch('/api/growth/subscription/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({planCode:chosen,businessName:document.querySelector('#business').value,websiteUrl:document.querySelector('#website').value})}),d=await r.json();if(r.status===401){location.href='/minha-conta.html?retorno='+encodeURIComponent('/fabrica-crescimento.html');return}if(!r.ok)throw new Error(d.error||'Não foi possível iniciar.');location.href=d.checkoutUrl}catch(e){m.textContent=e.message;m.classList.remove('hidden')}finally{b.disabled=false}};load();
</script></body></html>
