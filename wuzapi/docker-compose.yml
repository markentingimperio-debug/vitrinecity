services:
  whatsapp-qr:
    image: asternic/wuzapi:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      WEBHOOK_FORMAT: json
      SESSION_DEVICE_NAME: VitrineCity
    volumes:
      - whatsapp_qr_data:/app/dbdata
      - whatsapp_qr_files:/app/files
    security_opt:
      - no-new-privileges:true
    networks:
      - default

volumes:
  whatsapp_qr_data:
  whatsapp_qr_files:

networks:
  default:
    external: true
    name: vitrinecity_default
