name: LIA Dev Workspace Checks

on:
  push:
    branches:
      - feat/lia-dev-gateway-20260917
    paths:
      - 'ops/lia-dev-workspace/**'
      - '.github/workflows/lia-dev-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          bash -n ops/lia-dev-workspace/install-vitrinecity-dev.sh
          bash -n ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          bash -n ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh

      - name: Workspace safety guards
        run: |
          grep -q "BASE_COMMIT='708c2bb294d4dabc08878e32e72b7b5f0af8f037'" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "LOCAL_BRANCH='lia/dev-worker'" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "LIA_GATEWAY_EXECUTION_ENABLED=0" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "LIA_CODEX_EXECUTION_ENABLED=0" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "LIA_BROKER_EXECUTION_ENABLED=0" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "blocked://lia-no-push" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "BLOQUEADO: este workspace da LIA nao possui permissao de push" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q '"gitPush": false' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q '"productionDeploy": false' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q '"credentialsMounted": false' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q 'Chamadas OpenAI realizadas nesta instalacao: ZERO' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          ! grep -q '/v1/run' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          ! grep -q '/v1/responses' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          ! grep -q 'OPENAI_API_KEY' ops/lia-dev-workspace/install-vitrinecity-dev.sh
      - name: First real Vitrine City task guards
        run: |
          grep -q "^BUDGET_USD=0.10$" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "^PROFILE='dev'$" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "ALLOWED_FILE='app/scripts/test-web-story-cta.mjs'" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "Codigo de producao alterado: NAO" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "Git push: continua BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "Deploy de producao: continua BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "node --test app/scripts/test-web-story-cta.mjs" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "LIA_GATEWAY_EXECUTION_ENABLED=0" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "LIA_CODEX_EXECUTION_ENABLED=0" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "LIA_BROKER_EXECUTION_ENABLED=0" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "disable_all" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          ! grep -q "git push origin" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
      - name: First real Vitrine City task v4 guards
        run: |
          grep -q "^BUDGET_USD=0.10$" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "^PROFILE='dev'$" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "vitrinecity-first-real-task-v4.attempted" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "ALLOWED_FILE='app/scripts/test-web-story-cta.mjs'" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "2026-09-18-v4-stream" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "2026-09-18-v3-diagnostics" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "ssePassthrough==true" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "DIAGNOSTICO AUTOMATICO BROKER" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "DIAGNOSTICO AUTOMATICO WORKER" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "node --test app/scripts/test-web-story-cta.mjs" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "Git push: BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "Deploy de producao: BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "disable_all" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
