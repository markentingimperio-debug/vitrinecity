name: LIA Dev Workspace Checks

on:
  push:
    branches:
      - feat/lia-dev-gateway-20260917
    paths:
      - 'ops/lia-dev-workspace/**'
      - '.github/workflows/lia-dev-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          bash -n ops/lia-dev-workspace/install-vitrinecity-dev.sh
          bash -n ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          bash -n ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          bash -n ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          bash -n ops/lia-dev-workspace/run-first-vitrinecity-task-v6.sh
          bash -n ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
          bash -n ops/lia-dev-workspace/prepare-review-pack.sh
          bash -n ops/lia-dev-workspace/approve-review-pack.sh

      - name: Workspace safety guards
        run: |
          grep -q "BASE_COMMIT='708c2bb294d4dabc08878e32e72b7b5f0af8f037'" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "LOCAL_BRANCH='lia/dev-worker'" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "LIA_GATEWAY_EXECUTION_ENABLED=0" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "LIA_CODEX_EXECUTION_ENABLED=0" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "LIA_BROKER_EXECUTION_ENABLED=0" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "blocked://lia-no-push" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q "BLOQUEADO: este workspace da LIA nao possui permissao de push" ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q '"gitPush": false' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q '"productionDeploy": false' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q '"credentialsMounted": false' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          grep -q 'Chamadas OpenAI realizadas nesta instalacao: ZERO' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          ! grep -q '/v1/run' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          ! grep -q '/v1/responses' ops/lia-dev-workspace/install-vitrinecity-dev.sh
          ! grep -q 'OPENAI_API_KEY' ops/lia-dev-workspace/install-vitrinecity-dev.sh
      - name: First real Vitrine City task guards
        run: |
          grep -q "^BUDGET_USD=0.10$" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "^PROFILE='dev'$" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "ALLOWED_FILE='app/scripts/test-web-story-cta.mjs'" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "Codigo de producao alterado: NAO" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "Git push: continua BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "Deploy de producao: continua BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "node --test app/scripts/test-web-story-cta.mjs" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "LIA_GATEWAY_EXECUTION_ENABLED=0" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "LIA_CODEX_EXECUTION_ENABLED=0" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "LIA_BROKER_EXECUTION_ENABLED=0" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          grep -q "disable_all" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
          ! grep -q "git push origin" ops/lia-dev-workspace/run-first-vitrinecity-task.sh
      - name: First real Vitrine City task v4 guards
        run: |
          grep -q "^BUDGET_USD=0.10$" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "^PROFILE='dev'$" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "vitrinecity-first-real-task-v4.attempted" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "ALLOWED_FILE='app/scripts/test-web-story-cta.mjs'" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "2026-09-18-v4-stream" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "2026-09-18-v3-diagnostics" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "ssePassthrough==true" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "DIAGNOSTICO AUTOMATICO BROKER" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "DIAGNOSTICO AUTOMATICO WORKER" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "node --test app/scripts/test-web-story-cta.mjs" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "Git push: BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "Deploy de producao: BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
          grep -q "disable_all" ops/lia-dev-workspace/run-first-vitrinecity-task-v4.sh
      - name: First real Vitrine City task v5 guards
        run: |
          grep -q "^BUDGET_USD=0.10$" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "^PROFILE='dev'$" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "vitrinecity-first-real-task-v5.attempted" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "ALLOWED_FILE='app/scripts/test-web-story-cta.mjs'" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "2026-09-18-v5-adaptive-budget" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "2026-09-18-v4-policy" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "2026-09-18-v5-budget" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "LIA_BROKER_MAX_REQUESTS_PER_LEASE=20" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "LIA_BROKER_BUDGET_SAFETY_RATIO=0.90" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "maxOutputTokens==4096" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "DIAGNOSTICO AUTOMATICO BROKER V5" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "node --test app/scripts/test-web-story-cta.mjs" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "Git push: BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
          grep -q "Deploy de producao: BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task-v5.sh
      - name: First real Vitrine City task v6 guards
        run: |
          grep -q "^BUDGET_USD=0.10$" ops/lia-dev-workspace/run-first-vitrinecity-task-v6.sh
          grep -q "vitrinecity-first-real-task-v6.attempted" ops/lia-dev-workspace/run-first-vitrinecity-task-v6.sh
          grep -q "AF_NETLINK" ops/lia-dev-workspace/run-first-vitrinecity-task-v6.sh
          grep -q "ALLOWED_FILE='app/scripts/test-web-story-cta.mjs'" ops/lia-dev-workspace/run-first-vitrinecity-task-v6.sh
          grep -q "node --test app/scripts/test-web-story-cta.mjs" ops/lia-dev-workspace/run-first-vitrinecity-task-v6.sh
          grep -q "Git push: BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task-v6.sh
          grep -q "Deploy de producao: BLOQUEADO" ops/lia-dev-workspace/run-first-vitrinecity-task-v6.sh
      - name: First local commit finalizer guards
        run: |
          grep -q "ALLOWED_FILE='app/scripts/test-web-story-cta.mjs'" ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
          grep -q "COMMIT_MESSAGE='test: cover web story CTA mapping'" ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
          grep -q 'node --test app/scripts/test-web-story-cta.mjs' ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
          grep -q 'git -C "$WORKSPACE" add -- "$ALLOWED_FILE"' ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
          grep -q 'push --dry-run' ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
          grep -q 'Git push: BLOQUEADO' ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
          grep -q 'Deploy de producao: BLOQUEADO' ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
          grep -q 'Chamadas OpenAI realizadas: ZERO' ops/lia-dev-workspace/finalize-first-vitrinecity-commit.sh
      - name: Review gate guards
        run: |
          grep -q "BASE_COMMIT='708c2bb294d4dabc08878e32e72b7b5f0af8f037'" ops/lia-dev-workspace/prepare-review-pack.sh
          grep -q "EXPECTED_FILE='app/scripts/test-web-story-cta.mjs'" ops/lia-dev-workspace/prepare-review-pack.sh
          grep -q 'humanApprovalRequired:true' ops/lia-dev-workspace/prepare-review-pack.sh
          grep -q 'Git push: BLOQUEADO' ops/lia-dev-workspace/prepare-review-pack.sh
          grep -q 'Deploy de producao: BLOQUEADO' ops/lia-dev-workspace/prepare-review-pack.sh
          grep -q 'Chamadas OpenAI realizadas: ZERO' ops/lia-dev-workspace/prepare-review-pack.sh
          grep -q "APROVAR_PR" ops/lia-dev-workspace/approve-review-pack.sh
          grep -q '"approved_for_pr_publication_only"' ops/lia-dev-workspace/approve-review-pack.sh
          grep -q 'mergeApproved:false' ops/lia-dev-workspace/approve-review-pack.sh
          grep -q 'productionDeployApproved:false' ops/lia-dev-workspace/approve-review-pack.sh
          grep -q 'Git push do Worker: continua BLOQUEADO' ops/lia-dev-workspace/approve-review-pack.sh
          grep -q 'Chamadas OpenAI realizadas: ZERO' ops/lia-dev-workspace/approve-review-pack.sh
