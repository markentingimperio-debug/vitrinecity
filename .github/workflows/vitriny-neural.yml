name: Vitriny Neural

on:
  pull_request:
    paths:
      - 'ops/lia-native-audio/**'
      - 'app/vitriny-neural/**'
      - 'app/scripts/test-vitriny-neural*.mjs'
      - 'app/scripts/test-neural-*.mjs'
      - 'app/scripts/run-vitriny-neural*.mjs'
      - 'app/public/*neural*'
      - 'app/server.js'
      - 'app/jarvis.js'
      - 'app/security-fetch-guard.js'
      - 'app/Dockerfile'
      - 'docker-compose*.yml'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/vitriny-neural.yml'
  push:
    branches:
      - main
      - feat/jarvis-auto-learning-skills
    paths:
      - 'ops/lia-native-audio/**'
      - 'app/vitriny-neural/**'
      - 'app/scripts/test-vitriny-neural*.mjs'
      - 'app/scripts/test-neural-*.mjs'
      - 'app/scripts/run-vitriny-neural*.mjs'
      - 'app/public/*neural*'
      - 'app/server.js'
      - 'app/jarvis.js'
      - 'app/security-fetch-guard.js'
      - 'app/Dockerfile'
      - 'docker-compose*.yml'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/vitriny-neural.yml'

permissions:
  contents: read

jobs:
  neural-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:neural
