name: LIA Preserve Kling Validation
on:
  push:
    branches: ['fix/lia-preserve-kling-vps-20260916']
    paths: ['ops/lia-preserve-kling/**', 'app/vitriny-neural/chat-engine.js', 'app/vitriny-neural/lia-chat-operations.js', 'app/scripts/test-vitriny-neural-lia-chat-operations.mjs', '.github/workflows/lia-preserve-kling.yml']
  pull_request:
    paths: ['ops/lia-preserve-kling/**', 'app/vitriny-neural/chat-engine.js', 'app/vitriny-neural/lia-chat-operations.js', 'app/scripts/test-vitriny-neural-lia-chat-operations.mjs', '.github/workflows/lia-preserve-kling.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer syntax and rollback safety tests
        run: |
          python3 -m py_compile ops/lia-preserve-kling/*.py
          python3 ops/lia-preserve-kling/test_install.py
          python3 ops/lia-preserve-kling/test_prepare_chat_update_v2.py
          python3 ops/lia-preserve-kling/test_resolve_chat_engine_v3.py
          python3 ops/lia-preserve-kling/test_inventory_reconciliation_v3.py
          python3 ops/lia-preserve-kling/test_retry_staged_tests_v4.py
      - name: Install existing locked application dependencies
        working-directory: app
        run: npm ci --omit=dev
      - name: Reproduce exact staged engine failure and verify assertion-only repair
        run: python3 ops/lia-preserve-kling/test_retry_staged_tests_v4.py --integration
      - name: Validate or apply local-first contract in CI only
        run: |
          if grep -q 'LIA_PRESERVE_KLING_V1' app/vitriny-neural/chat-engine.js; then
            echo 'Local-first already consolidated in source.'
          else
            python3 ops/lia-preserve-kling/patch.py --root .
          fi
          cp ops/lia-preserve-kling/test.mjs app/scripts/test-lia-preserve-kling.mjs
          node --check app/vitriny-neural/chat-engine.js
          node --check app/vitriny-neural/lia-chat-operations.js
      - name: Canonical operations billing and uncertain transport regression tests
        working-directory: app
        run: node --test scripts/test-vitriny-neural-lia-chat-operations.mjs
      - name: New routing tests and existing chat regression tests
        working-directory: app
        run: |
          node --test scripts/test-lia-preserve-kling.mjs scripts/test-vitriny-neural-chat.mjs scripts/test-vitriny-neural-chat-api.mjs scripts/test-neural-chat-contract.mjs scripts/test-neural-chat-queue-http.mjs scripts/test-vitriny-neural-durable-job-queue.mjs scripts/test-neural-openai-paid-chat.mjs scripts/test-neural-paid-credit-flow.mjs scripts/test-neural-ai-credit-pricing.mjs scripts/test-neural-ai-credit-wallet.mjs
      - name: Existing Kling adapter regressions
        working-directory: app
        run: node --test scripts/test-kling-paid-video.mjs scripts/test-kling-readiness.mjs
      - name: Assert validation never mutates providers, wallet or knowledge sources
        run: |
          CHANGED="$(git diff --name-only)"
          test -z "$CHANGED" || test "$CHANGED" = "app/vitriny-neural/chat-engine.js"
