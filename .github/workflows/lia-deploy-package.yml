name: LIA deploy package tests
on:
  pull_request:
    paths:
      - 'ops/lia-preserve-kling/**'
      - '.github/workflows/lia-deploy-package.yml'
permissions:
  contents: read
jobs:
  deployment-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and offline deployment contracts
        run: |
          python3 -m py_compile ops/lia-preserve-kling/deploy-lia-v9.py
          python3 ops/lia-preserve-kling/test_deploy_lia_v9.py
          python3 ops/lia-preserve-kling/test_compose_serialization_v9.py
      - name: Isolated real Docker Compose activation and rollback
        run: sudo env GITHUB_ACTIONS=true python3 ops/lia-preserve-kling/integration_compose_v9.py
