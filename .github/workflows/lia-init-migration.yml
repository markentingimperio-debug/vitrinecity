name: LIA init migration tests
on:
  pull_request:
    paths:
      - 'ops/lia-preserve-kling/**'
      - '.github/workflows/lia-init-migration.yml'
permissions:
  contents: read
jobs:
  init-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build SHA-256 pinned installer and check offline contracts
        run: |
          python3 ops/lia-preserve-kling/fix-deploy-selector-v91.py
          python3 ops/lia-preserve-kling/fix-deploy-init-v92.py
          python3 -m py_compile ops/lia-preserve-kling/deploy-lia-v92.py
          sudo python3 ops/lia-preserve-kling/test_deploy_init_v92.py
      - name: Real Docker initial transition and rollback with synthetic data
        run: sudo env GITHUB_ACTIONS=true python3 ops/lia-preserve-kling/integration_init_v92.py
