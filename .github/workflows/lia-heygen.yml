name: LIA HeyGen integration
on:
  pull_request:
    paths:
      - 'app/lia-postproduction/**'
      - 'app/scripts/test-lia-heygen*.mjs'
      - 'ops/lia-heygen/**'
      - '.github/workflows/lia-heygen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          npm ci --prefix app --no-audit --no-fund
      - name: HeyGen, ElevenLabs, SQLite, HTTP and FFmpeg tests without provider credentials
        working-directory: app
        run: |
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 node --test --test-concurrency=1 scripts/test-lia-heygen.mjs scripts/test-lia-heygen-flow.mjs scripts/test-lia-postproduction.mjs scripts/test-lia-video-audio-editing-plan.mjs
