name: Verify release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build application with locked dependencies
        run: docker build -t vitrinecity-test:app app
      - name: Build live-studio test runtime
        run: docker build -t vitrinecity-test:studio ops/live-studio
      - name: Build pinned browser-only test runtime
        run: docker build -t vitrinecity-test:browser ops/browser-tests
      - name: Run isolated application, live-studio and browser tests
        run: bash ops/verify-release.sh vitrinecity-test:app vitrinecity-test:studio vitrinecity-test:browser
