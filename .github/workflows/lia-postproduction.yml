name: LIA postproduction executor
on:
  pull_request:
    paths:
      - 'app/lia-postproduction/**'
      - 'app/lia-video-audio-editing-plan.mjs'
      - 'app/scripts/test-lia-postproduction.mjs'
      - 'app/scripts/test-lia-video-audio-editing-plan.mjs'
      - '.github/workflows/lia-postproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lia-postproduction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application dependencies and local media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          npm ci --prefix app --no-audit --no-fund
      - name: Test real media, SQLite and HTTP without provider secrets
        working-directory: app
        run: |
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 node --test --test-concurrency=1 scripts/test-lia-postproduction.mjs scripts/test-lia-video-audio-editing-plan.mjs
