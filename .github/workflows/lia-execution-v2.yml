name: LIA Execution V2 Checks

on:
  push:
    branches:
      - feat/lia-dev-gateway-20260917
    paths:
      - 'ops/lia-execution-v2/**'
      - '.github/workflows/lia-execution-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check ops/lia-execution-v2/model-policy.mjs
          node --check ops/lia-execution-v2/gateway-v2.mjs
          node --check ops/lia-execution-v2/worker-v2.mjs
          node --check ops/lia-execution-v2/broker-v2.mjs
          bash -n ops/lia-execution-v2/install-vps.sh
          bash -n ops/lia-execution-v2/enable-pilot.sh
          bash -n ops/lia-execution-v2/run-first-task.sh
          bash -n ops/lia-execution-v2/run-second-task.sh
          bash -n ops/lia-execution-v2/install-broker-observe.sh
          bash -n ops/lia-execution-v2/diagnose-openai-upstream.sh
          bash -n ops/lia-execution-v2/install-budget-v3.sh
          bash -n ops/lia-execution-v2/run-third-task.sh
          bash -n ops/lia-execution-v2/install-stream-v4.sh
          bash -n ops/lia-execution-v2/install-budget-v5.sh
          bash -n ops/lia-execution-v2/install-worker-netlink-v6.sh
      - name: Policy checks
        run: |
          node --input-type=module <<'NODE'
          import { MODEL_PROFILES, resolveProfile, conservativeReservationMicroUsd } from './ops/lia-execution-v2/model-policy.mjs';
          const expected = ['economico','dev','codex','avancado','forte','maximo'];
          for (const name of expected) {
            const p = resolveProfile(name);
            if (!p || !p.model || !p.reasoning || !(p.maxOutputTokens > 0)) throw new Error('profile_invalid:'+name);
          }
          if (MODEL_PROFILES.maximo.model !== 'gpt-6-astra' || MODEL_PROFILES.maximo.premium !== true) throw new Error('astra_must_be_premium');
          if (MODEL_PROFILES.dev.model !== 'gpt-5.4-mini') throw new Error('dev_model_changed');
          if (!(conservativeReservationMicroUsd(1000, resolveProfile('dev')) > 0)) throw new Error('reservation_invalid');
          console.log('MODEL_POLICY_OK');
          NODE
      - name: Safety guard checks
        run: |
          grep -q 'LIA_GATEWAY_EXECUTION_ENABLED 0' ops/lia-execution-v2/install-vps.sh
          grep -q 'LIA_CODEX_EXECUTION_ENABLED 0' ops/lia-execution-v2/install-vps.sh
          grep -q 'LIA_BROKER_EXECUTION_ENABLED 0' ops/lia-execution-v2/install-vps.sh
          grep -q "premiumApproval!=='ASTRA'" ops/lia-execution-v2/gateway-v2.mjs
          grep -q "networkAccessEnabled:false" ops/lia-execution-v2/worker-v2.mjs
          grep -q "webSearchMode:'disabled'" ops/lia-execution-v2/worker-v2.mjs
          grep -q "broker_execution_locked" ops/lia-execution-v2/broker-v2.mjs
          grep -q "lease_budget_exhausted" ops/lia-execution-v2/broker-v2.mjs
          grep -q "Tarefa paga criada por este script: NAO" ops/lia-execution-v2/enable-pilot.sh
          grep -q "Chamadas OpenAI feitas por este script: ZERO" ops/lia-execution-v2/enable-pilot.sh
          ! grep -q '/v1/run' ops/lia-execution-v2/enable-pilot.sh
          ! grep -q '/v1/responses' ops/lia-execution-v2/enable-pilot.sh
      - name: First paid pilot guard checks
        run: |
          grep -q '^BUDGET_USD=0.10$' ops/lia-execution-v2/run-first-task.sh
          grep -q '^PROFILE=dev$' ops/lia-execution-v2/run-first-task.sh
          grep -q '^WORKSPACE_NAME=lia-first-task$' ops/lia-execution-v2/run-first-task.sh
          grep -q 'first-paid-pilot.attempted' ops/lia-execution-v2/run-first-task.sh
          grep -q 'disable_pilot' ops/lia-execution-v2/run-first-task.sh
          grep -q 'LIA_GATEWAY_EXECUTION_ENABLED=0' ops/lia-execution-v2/run-first-task.sh
          grep -q 'LIA_CODEX_EXECUTION_ENABLED=0' ops/lia-execution-v2/run-first-task.sh
          grep -q 'LIA_BROKER_EXECUTION_ENABLED=0' ops/lia-execution-v2/run-first-task.sh
          grep -q 'Nenhum deploy de producao foi realizado' ops/lia-execution-v2/run-first-task.sh
      - name: Second paid pilot guard checks
        run: |
          grep -q '^BUDGET_USD=0.10$' ops/lia-execution-v2/run-second-task.sh
          grep -q '^PROFILE=dev$' ops/lia-execution-v2/run-second-task.sh
          grep -q '^WORKSPACE_NAME=lia-second-task$' ops/lia-execution-v2/run-second-task.sh
          grep -q 'second-paid-pilot.attempted' ops/lia-execution-v2/run-second-task.sh
          grep -q 'spentUsd // 0)==0' ops/lia-execution-v2/run-second-task.sh
          grep -q 'reservedUsd // 0)==0' ops/lia-execution-v2/run-second-task.sh
          grep -q 'Codex CLI nao esta instalado' ops/lia-execution-v2/run-second-task.sh
          grep -q 'disable_pilot' ops/lia-execution-v2/run-second-task.sh
          grep -q 'LIA_GATEWAY_EXECUTION_ENABLED=0' ops/lia-execution-v2/run-second-task.sh
          grep -q 'LIA_CODEX_EXECUTION_ENABLED=0' ops/lia-execution-v2/run-second-task.sh
          grep -q 'LIA_BROKER_EXECUTION_ENABLED=0' ops/lia-execution-v2/run-second-task.sh
          grep -q 'Nenhum deploy de producao foi realizado' ops/lia-execution-v2/run-second-task.sh
      - name: Direct upstream diagnostic guard checks
        run: |
          grep -q '^BUDGET_MICRO_USD=20000$' ops/lia-execution-v2/diagnose-openai-upstream.sh
          grep -q 'Gateway: BLOQUEADO' ops/lia-execution-v2/diagnose-openai-upstream.sh
          grep -q 'Worker: BLOQUEADO' ops/lia-execution-v2/diagnose-openai-upstream.sh
          grep -q 'Reply only with OK' ops/lia-execution-v2/diagnose-openai-upstream.sh
          grep -q 'max_output_tokens:16' ops/lia-execution-v2/diagnose-openai-upstream.sh
          grep -q 'disable_broker' ops/lia-execution-v2/diagnose-openai-upstream.sh
          grep -q 'LIA_GATEWAY_EXECUTION_ENABLED=0' ops/lia-execution-v2/diagnose-openai-upstream.sh
          grep -q 'LIA_CODEX_EXECUTION_ENABLED=0' ops/lia-execution-v2/diagnose-openai-upstream.sh
          ! grep -q 'LIA_GATEWAY_EXECUTION_ENABLED=1' ops/lia-execution-v2/diagnose-openai-upstream.sh
          ! grep -q 'LIA_CODEX_EXECUTION_ENABLED=1' ops/lia-execution-v2/diagnose-openai-upstream.sh
      - name: Budget v5 and stream guard checks
        run: |
          grep -q '2026-09-18-v5-adaptive-budget' ops/lia-execution-v2/broker-v2.mjs
          grep -q 'adaptiveBudgetReservation:true' ops/lia-execution-v2/broker-v2.mjs
          grep -q 'BUDGET_SAFETY_RATIO' ops/lia-execution-v2/broker-v2.mjs
          grep -q 'adaptive_text_observed_175pct' ops/lia-execution-v2/broker-v2.mjs
          grep -q 'ssePassthrough:true' ops/lia-execution-v2/broker-v2.mjs
          grep -q 'response.incomplete' ops/lia-execution-v2/broker-v2.mjs
          grep -q 'lia_broker_upstream_terminal_event' ops/lia-execution-v2/broker-v2.mjs
          grep -q 'lia_codex_run_failed' ops/lia-execution-v2/worker-v2.mjs
          grep -q '2026-09-18-v4-policy' ops/lia-execution-v2/worker-v2.mjs
          grep -q 'workerDetail' ops/lia-execution-v2/gateway-v2.mjs
          grep -q '2026-09-18-v5-budget' ops/lia-execution-v2/gateway-v2.mjs
          grep -q "maxOutputTokens: 4096" ops/lia-execution-v2/model-policy.mjs
          grep -q 'LIA_BROKER_MAX_REQUESTS_PER_LEASE 20' ops/lia-execution-v2/install-budget-v5.sh
          grep -q 'LIA_BROKER_BUDGET_SAFETY_RATIO 0.90' ops/lia-execution-v2/install-budget-v5.sh
          grep -q 'Chamadas OpenAI realizadas nesta instalacao: ZERO' ops/lia-execution-v2/install-budget-v5.sh
          grep -q 'LIA_GATEWAY_EXECUTION_ENABLED=0' ops/lia-execution-v2/install-budget-v5.sh
          grep -q 'LIA_CODEX_EXECUTION_ENABLED=0' ops/lia-execution-v2/install-budget-v5.sh
          grep -q 'LIA_BROKER_EXECUTION_ENABLED=0' ops/lia-execution-v2/install-budget-v5.sh
      - name: Third paid pilot guard checks
        run: |
          grep -q '^BUDGET_USD=0.10$' ops/lia-execution-v2/run-third-task.sh
          grep -q '^PROFILE=dev$' ops/lia-execution-v2/run-third-task.sh
          grep -q '^WORKSPACE_NAME=lia-third-task$' ops/lia-execution-v2/run-third-task.sh
          grep -q 'third-paid-pilot.attempted' ops/lia-execution-v2/run-third-task.sh
          grep -q '2026-09-18-v3-budget' ops/lia-execution-v2/run-third-task.sh
          grep -q 'disable_all' ops/lia-execution-v2/run-third-task.sh
          grep -q 'Nenhum deploy de producao foi realizado' ops/lia-execution-v2/run-third-task.sh
          ! grep -q 'premiumApproval' ops/lia-execution-v2/run-third-task.sh
      - name: Worker netlink v6 guard checks
        run: |
          grep -q 'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK' ops/lia-execution-v2/install-worker-netlink-v6.sh
          grep -q 'NETLINK_ROUTE_SOCKET_OK' ops/lia-execution-v2/install-worker-netlink-v6.sh
          grep -q 'socket.AF_NETLINK' ops/lia-execution-v2/install-worker-netlink-v6.sh
          grep -q 'socket.NETLINK_ROUTE' ops/lia-execution-v2/install-worker-netlink-v6.sh
          grep -q 'Chamadas OpenAI realizadas: ZERO' ops/lia-execution-v2/install-worker-netlink-v6.sh
          grep -q 'LIA_GATEWAY_EXECUTION_ENABLED=0' ops/lia-execution-v2/install-worker-netlink-v6.sh
          grep -q 'LIA_CODEX_EXECUTION_ENABLED=0' ops/lia-execution-v2/install-worker-netlink-v6.sh
          grep -q 'LIA_BROKER_EXECUTION_ENABLED=0' ops/lia-execution-v2/install-worker-netlink-v6.sh
