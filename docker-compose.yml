services:
  app:
    build: ./app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      COURSE_FILES_DIR: /private-courses
      LIVE_STUDIO_DIR: /live-studio
      JARVIS_LOCAL_MODEL: ${JARVIS_LOCAL_MODEL:-0}
    networks:
      - default
      - jarvis_private
    volumes:
      - vitrinecity_data:/data
      - ./private-courses:/private-courses:ro
      - live_studio:/live-studio
      - kling_credentials:/var/lib/vitrinecity-kling
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
  jarvis-model:
    profiles: [jarvis]
    extends:
      file: docker-compose.jarvis.yml
      service: jarvis-model
  live-studio:
    extends:
      file: docker-compose.live.yml
      service: live-studio
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - chatbotx
volumes:
  kling_credentials:
  live_studio:
  vitrinecity_data:
  caddy_data:
  caddy_config:
networks:
  jarvis_private:
    internal: true
  chatbotx:
    external: true
    name: chatbotx_main
