# Apply to the existing Chatbotx stack; do not copy its .env into this repository.
# Next.js listens on the container hostname in the currently deployed image.
services:
  builder:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get({host:process.env.HOSTNAME||'127.0.0.1',port:3000,path:'/api/health',timeout:8000},r=>{r.resume();process.exitCode=r.statusCode===200?0:1}).on('error',()=>{process.exitCode=1}).on('timeout',function(){this.destroy();process.exitCode=1})"
      interval: 30s
      timeout: 10s
      retries: 3
